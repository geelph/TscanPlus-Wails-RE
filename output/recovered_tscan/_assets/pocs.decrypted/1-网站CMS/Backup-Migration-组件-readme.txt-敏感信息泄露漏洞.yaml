id: poc-yaml-backup-migration-sensitive-information-leak
info:
  name: "Backup Migration 组件 readme.txt 敏感信息泄露漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: wordpress

variables:
  version: ""

flow: |
  http(1) && http(2)

http:
  - raw:
      - |
        GET /wp-content/plugins/backup-backup/readme.txt HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "backup-backup"
      - type: regex
        part: body
        regex:
          - "(?mi)Stable tag\x3a ([0-9.]+)"

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - "Stable tag\x3a (?P<version>[0-9.]+)"
        internal: true

  - raw:
      - |
        GET /wp-content/plugins/backup-backup/readme.txt HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - compare_versions(version, "<1.3.5")
