id: wordpress-readme-file

info:
  name: "WordPress readme.html 文件存在"
  author: tess
  severity: info
  metadata:
    max-request: 3
    verified: true
    shodan-query: http.component:"wordpress"
  tags: WordPress

http:
  - method: GET
    path:
      - "{{BaseURL}}/readme.html"
      - "{{BaseURL}}/wp/readme.html"
      - "{{BaseURL}}/blog/wp/readme.html"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'WordPress &#8250; ReadMe'

      - type: status
        status:
          - 200
