id: joomla-marvikshop-shoppingcart-3-4-sqli

info:
  name: Joomla MarvikShop ShoppingCart 3.4 SQL注入
  author: r3Y3r53
  severity: high
  description: |
    Joomla MarvikShop ShoppingCart 3.4 存在SQL注入漏洞，攻击者可通过Web页面输入构造恶意SQL语句，从而破坏数据库或窃取敏感信息。该漏洞属于典型的代码注入技术，是Web应用面临的高危安全风险之一。
  reference:
    - https://vulners.com/zdt/1337DAY-ID-38020
    - https://cxsecurity.com/issue/WLB-2022100015
    - https://extensions.joomla.org/
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 1
  tags: Joomla
  remediation: >-
    所有数据库访问均应使用参数化查询或安全的 ORM，按照允许列表校验输入，并为应用配置最小权限的数据库账号。升级到厂商已修复的版本，在完成修复前限制对受影响端点的访问。

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?option=com_oscommerce&osMod=mshop_pl_src&manufacturers_id=7&sort=products_sort_order&page=index.php&format=xml&task=showproducts&view=med&sort=latest&sortdir=%27"
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "You have an error in your SQL syntax") && contains(body, "manufacturers_id") && contains(body, "products_price")'
          - 'contains(content_type, "text/html")'
          - 'status_code == 200'
        condition: and
