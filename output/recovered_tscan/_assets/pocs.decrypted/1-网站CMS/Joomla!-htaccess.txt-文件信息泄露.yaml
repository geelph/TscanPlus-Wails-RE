id: joomla-htaccess-file

info:
  name: "Joomla! htaccess.txt 文件信息泄露"
  author: oppsec
  severity: info
  description: Joomla!  has an htaccess file to store configurations about HTTP config, directory listing, etc.
  tags: Joomla!
  metadata:
    max-request: 1

http:
  - method: GET
    path:
      - "{{BaseURL}}/htaccess.txt"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Joomla"
          - "Open Source Matters. All rights reserved"
        condition: and

      - type: word
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
