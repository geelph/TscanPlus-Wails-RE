id: laravel-terminal-unauthorized-access

info:
  name: Laravel Terminal 未授权访问漏洞
  author: pussycat0x
  severity: high
  description: |
    该Web应用基于Laravel框架构建，其Laravel Terminal组件在生产环境中被启用且可公开访问，导致攻击者能够直接访问该终端接口，进而造成敏感应用信息泄露。
  reference:
    - https://github.com/recca0120/laravel-terminal
    - https://www.acunetix.com/vulnerabilities/web/laravel-terminal-open/
  metadata:
    max-request: 1
    verified: false
  tags: Laravel-Framework
  remediation: >-
    升级到已修复版本，在受影响端点实施身份认证和授权，移除响应及调试输出中的敏感数据，限制管理接口的暴露范围，并轮换可能已泄露的凭据或密钥。

http:
  - method: GET
    path:
      - "{{BaseURL}}/asf/terminal"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Laravel Terminal"
          - "terminal.endpoint"
        condition: or
      - type: status
        status:
          - 200
