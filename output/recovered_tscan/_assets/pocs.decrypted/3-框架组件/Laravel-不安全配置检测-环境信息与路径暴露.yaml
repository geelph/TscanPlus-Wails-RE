id: laravel-unsafe-config

info:
  name: "Laravel 不安全配置检测：环境信息与路径暴露"
  author: ProjectDiscoveryAI
  severity: medium
  tags: laravel
  description: |
    Detects unsafe configuration in Laravel applications, specifically the exposure of environment details and vendor paths.

http:
  - method: POST
    path:
      - "{{BaseURL}}/"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 405
      - type: word
        words:
          - "MethodNotAllowedHttpException"
        part: body
      - type: word
        words:
          - "Environment &amp; details"
        part: body
      - type: word
        words:
          - "vendor\\laravel\\framework\\src\\Illuminate\\Routing\\RouteCollection.php"
          - "vendor/laravel/framework/src/Illuminate/Routing/RouteCollection.php"
        condition: or
        part: body
