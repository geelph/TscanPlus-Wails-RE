id: laravel-debug-error

info:
  name: "Larvel 调试方法启用导致错误泄露"
  author: dhiyaneshDK
  severity: medium
  tags: Laravel
  metadata:
    max-request: 1

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - Whoops! There was an error

      - type: status
        status:
          - 500