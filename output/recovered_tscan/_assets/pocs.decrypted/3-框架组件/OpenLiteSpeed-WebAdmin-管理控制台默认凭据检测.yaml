id: openlitespeed-webadmin-default-credentials-check

info:
  name: OpenLiteSpeed WebAdmin 管理控制台默认凭据检测
  author: 0x_Akoko
  severity: high
  description: |
    检测到 OpenLiteSpeed WebAdmin 控制台使用默认凭据进行登录，攻击者可借此直接获取管理权限，导致系统配置泄露或遭受恶意篡改。
  reference:
    - https://www.digitalocean.com/community/tutorials/how-to-install-the-openlitespeed-web-server-on-ubuntu-18-04
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="OpenLiteSpeed WebAdmin"
  tags: OpenLiteSpeed
  remediation: >-
    升级到已修复版本，并在服务端对每个受影响的操作和资源执行身份认证与授权检查。采用默认拒绝的访问控制策略，删除默认凭据，在可用时启用多因素认证，并限制管理端点的访问。

variables:
  username: "admin"
  password: "123456"

http:
  - raw:
      - |
        POST /login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        userid={{username}}&pass={{password}}
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - 'contains_all(header, "LSID", "LSPA", "Location: /index.php")'
        condition: and
        # digest: 4a0a0047304502210086e3f15499d21f86845420b2b801a30bea4392bbffaaf580b9d2787f532a4054022042c2cb22efc6196bfc12685dbf97e3b0eb4de9a64e9a4a2868ff0214a91e85c3:922c64590222798bb761d5b6d8e72950
