id: jboss-seam-debug-page

info:
  name: "Jboss Seam debug.seam 调试页面启用"
  author: dhiyaneshDK
  severity: medium
  reference:
    - https://github.com/jaeles-project/jaeles-signatures/blob/master/common/jboss-seam-debug-page.yaml
  tags: Jboss
  metadata:
    max-request: 1

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug.seam"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "SeamDebugPage"
          - "org.jboss.seam"
        condition: and

      - type: status
        status:
          - 200
