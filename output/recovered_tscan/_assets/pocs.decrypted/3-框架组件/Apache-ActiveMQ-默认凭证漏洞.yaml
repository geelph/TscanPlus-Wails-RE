id: apache-activemq-default-credentials

info:
  name: "Apache ActiveMQ 默认凭证漏洞"
  author: pdteam
  severity: high
  description: |-
    Default authentication credentials were detected on the Apache ActiveMQ service.
  reference:
  - https://knowledge.broadcom.com/external/article/142813/vulnerability-apache-activemq-admin-con.html
  metadata:
    max-request: 2
  tags: Apache,ActiveMQ

http:
- raw:
  - |
    GET /admin/ HTTP/1.1
    Host: {{Hostname}}
    Authorization: Basic {{base64(username + ':' + password)}}

  payloads:
    username:
    - user
    - admin
    password:
    - user
    - admin
  attack: pitchfork
  matchers:
  - type: word
    words:
    - 'Welcome to the Apache ActiveMQ Console of <b>'
    - '<h2>Broker</h2>'
    condition: and

