id: apache-skywalking-dashboard-unauthorized-access
info:
  name: Apache SkyWalking Dashboard 未授权访问
  author: icarot
  severity: high
  description: |-
    Apache SkyWalking 作为一个应用性能监控系统（APM），其后端监控仪表板（Dashboard）接口存在未授权访问漏洞。攻击者无需认证即可访问敏感监控数据并执行非授权操作。
    fofa查询语法: count: 1079443086
  reference:
  - https://github.com/apache/skywalking
  - https://github.com/apache/skywalking-ui
  metadata:
    max-request: 9
    vendor: apache
    product: skywalking
    shodan-query: title:"Apache SkyWalking"
  tags: apache, skywalking
http:
- raw:
  - |
    GET /dashboard/list HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: word
    words:
    - title>Apache SkyWalking
    - /css/monaco-editor
    condition: and
  - type: status
    status:
    - 200
