id: poc-yaml-consul-service-api-rce
info:
  name: "Consul Service API 远程代码执行漏洞"
  author: ProjectDiscoveryAI
  severity: critical
  tags: consul
http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/agent/self"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "EnableRemoteScriptChecks\":true"
