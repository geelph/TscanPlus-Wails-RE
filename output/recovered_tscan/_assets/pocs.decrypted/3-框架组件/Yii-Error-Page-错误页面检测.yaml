id: yii-error-page

info:
  name: "Yii Error Page 错误页面检测"
  author: DhiyaneshDk
  severity: unknown
  metadata:
    max-request: 1
    verified: "true"
    shodan-query: html:"yii\base\ErrorException"
  tags: Yii

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>yii\base\ErrorException</title>'

      - type: status
        status:
          - 500
