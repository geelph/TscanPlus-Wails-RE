id: laravel-passport-oauth2-key-file-leak

info:
  name: Laravel Passport OAuth2 私钥公钥文件泄露漏洞
  author: moamenbasel
  severity: high
  description: |
    Laravel Passport 的 OAuth2 RSA 私钥或公钥在默认存储路径下可被公开访问。攻击者可利用泄露的私钥伪造 OAuth2 访问令牌，进而冒充任意用户。
  remediation: |
    Ensure the storage directory is not publicly accessible. Move Passport keys outside the web root or configure the web server to deny access to the storage directory.
  reference:
    - https://laravel.com/docs/10.x/passport#installation
  metadata:
    verified: true
    max-request: 2
  tags: Laravel-Framework

http:
  - method: GET
    path:
      - "{{BaseURL}}/storage/oauth-private.key"
      - "{{BaseURL}}/storage/oauth-public.key"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "-----BEGIN RSA PRIVATE KEY-----"
          - "-----BEGIN PUBLIC KEY-----"
        condition: or
      - type: word
        part: body
        words:
          - "<html"
          - "<!DOCTYPE"
        negative: true
      - type: status
        status:
          - 200

