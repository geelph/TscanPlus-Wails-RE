id: redis-exporter-metrics-exposure
info:
  name: Redis Exporter Metrics 接口暴露
  author: koungq
  severity: low
  description: |-
    Redis Exporter 的 metrics 端点未进行有效访问控制，导致敏感监控数据对外暴露。
    count: 10030486
  reference:
  - https://github.com/oliver006/redis_exporter
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: redis
http:
- method: GET
  path:
  - '{{BaseURL}}/metrics'
  matchers:
  - type: dsl
    dsl:
    - contains_any(body, "redis_connected_clients", "redis_memory_used_bytes", "redis_instance_info")
    - contains_all(body, "# HELP", "redis_exporter_build_info", "redis_up")
    - contains(content_type, "text/plain")
    - status_code == 200
    condition: and
