id: eureka-unauthorized-access
info:
  name: "Eureka 未授权访问发现"
  author: ProjectDiscoveryAI
  severity: high
  tags: eureka
http:
  - method: GET
    path:
      - "/eureka/apps"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "<application>"
          - "<ipAddr>"
      - type: word
        words:
          - "<p>"
        negative: true
