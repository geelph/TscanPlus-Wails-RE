                  "paths": [
                  ]
                }
              }
            ]
          },
          "status": {
            "loadBalancer": {}
          }
        },
        "oldObject": null,
        "dryRun": true,
        "options": {
          "kind": "CreateOptions",
          "apiVersion": "meta.k8s.io/v1"
        }
      }
    }
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'AdmissionReview'
