id: cve-2023-34468
info:
  name: "Apache NiFi H2 JDBC 远程代码执行漏洞"
  author: ProjectDiscoveryAI
  severity: critical
  tags: Apache,NiFi
http:
  - method: GET
    path:
      - "{{BaseURL}}/nifi-api/process-groups/root"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "revision"
          - "canRead"
          - "permissions"
        part: body
      - type: word
        words:
          - "application/json"
        part: header
