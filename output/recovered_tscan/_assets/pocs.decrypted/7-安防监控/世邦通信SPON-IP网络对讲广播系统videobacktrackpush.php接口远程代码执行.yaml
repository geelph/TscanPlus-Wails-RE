id: SPON-IP-videobacktrackpush_php-File-upload

info:
  name: "世邦通信SPON-IP网络对讲广播系统videobacktrackpush.php接口远程代码执行"
  author: Unknown
  severity: high
  description: |-
    fofa: body="vendors/toastr-master/build/toastr.min.js"
      世邦通信SPON-IP网络对讲广播系统在videobacktrackpush.php接口中存在文件上传逻辑缺陷，攻击者可利用此漏洞在目标服务器上执行任意代码，导致远程代码执行（RCE）。该漏洞允许未经授权的请求者部署恶意负载，获取系统权限，并进一步控制整个Web服务器环境。
  reference:
  - https://mp.weixin.qq.com/s/vFQVqG7gFMWSzb9d6VOzIw
  tags: 世邦通信SPON-IP网络对讲广播系统

