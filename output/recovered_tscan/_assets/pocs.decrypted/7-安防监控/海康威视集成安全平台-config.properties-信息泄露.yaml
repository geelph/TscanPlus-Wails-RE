id: hikvision-config-properties-info-leak
info:
  name: "海康威视集成安全平台 config.properties 信息泄露"
  author: ProjectDiscoveryAI
  severity: medium
  tags: hikvision
http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/conf/config.properties"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "@bic.serviceDirectory.ip"
          - "@bic.notify.password"
          - "parent.secretKey"
        part: body
