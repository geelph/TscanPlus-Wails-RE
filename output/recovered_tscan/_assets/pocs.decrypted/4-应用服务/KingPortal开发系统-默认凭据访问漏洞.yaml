id: kingportal-weak-password

info:
  name: KingPortal开发系统 默认凭据访问漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: Hunter: web.title="KingPortal"或fofa:title="KingPortal"
          KingPortal系统作为工业控制系统集成平台，提供工控产品、数据库及第三方系统的快速接入能力。其内置图形化展示模块与事件交互框架支持跨行业应用开发，但存在默认身份验证凭据未强制修改的配置缺陷。攻击者可通过预设账户凭证直接获取系统控制权限，进而实施数据篡改、服务中断或横向渗透等攻击行为。
  tags: KingPortal开发系统

