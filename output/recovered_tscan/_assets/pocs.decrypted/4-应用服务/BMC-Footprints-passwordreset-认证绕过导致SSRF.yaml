id: bmc-footprints-weakauth-ssrf

info:
  name: "BMC Footprints passwordreset 认证绕过导致SSRF"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: icon_hash="-1106787596" || body="/footprints/servicedesk/"
    攻击者通过构造恶意请求，利用SEC_TOEKN机制实现任意文件写入，进而获取服务器远程执行权限。
  tags: BMC_Footprints

http:
- raw:
  - |
    GET /footprints/servicedesk/passwordreset/request/ HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept: */*
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'SEC_TOEKN'
  - type: status
    status: [404]