id: xxllnc-zaaksysteem-detect

info:
  name: "xxllnc Zaaksysteem 应用检测"
  severity: info
  author: darses
  description: |
    Detects xxllnc Zaaksysteem application.
  metadata:
    vendor: xxllnc
    product: Zaaksysteem
    fofa-query:
      - "Set-Cookie: zaaksysteem_session="
      - icon_hash="1478021101"
  reference:
    - https://www.xxllnc.nl/
  tags: xxllnc-Zaaksysteem

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 302

      - type: word
        part: header
        words:
          - "Set-Cookie: zaaksysteem_session"
