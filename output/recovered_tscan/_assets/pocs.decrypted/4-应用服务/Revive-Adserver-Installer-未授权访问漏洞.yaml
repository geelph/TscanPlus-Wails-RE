id: revive-adserver-installer-unauthorized-access

info:
  name: Revive Adserver Installer 未授权访问漏洞
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Revive Adserver 安装向导暴露，攻击者可未经授权执行安装与配置操作，可能导致系统被接管。
  reference:
    - https://github.com/revive-adserver/revive-adserver
    - https://www.revive-adserver.com/support/installation/
    - https://documentation.revive-adserver.com/
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"Installing Revive Adserver"
  tags: Revive-Adserver
  remediation: >-
    升级到已修复版本，在受影响端点实施身份认证和授权，移除响应及调试输出中的敏感数据，限制管理接口的暴露范围，并轮换可能已泄露的凭据或密钥。

http:
  - method: GET
    path:
      - "{{BaseURL}}/www/admin/install.php?action=welcome"
      - "{{BaseURL}}/admin/install.php?action=welcome"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Installing Revive Adserver"
          - "installer"
        condition: and
      - type: status
        status:
          - 200

