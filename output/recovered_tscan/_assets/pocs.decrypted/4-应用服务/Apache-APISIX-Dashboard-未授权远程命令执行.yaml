id: apache-apisix-dashboard-unauth
info:
  name: "Apache APISIX Dashboard 未授权远程命令执行"
  author: ProjectDiscoveryAI
  severity: critical
  tags: Apache-APISIX-Dashboard
http:
  - method: GET
    path:
      - "{{BaseURL}}/apisix/admin/migrate/export"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "\"Routes\":["
          - "\"Consumers\""
