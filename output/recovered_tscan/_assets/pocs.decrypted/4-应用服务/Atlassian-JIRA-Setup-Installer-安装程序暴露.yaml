id: jira-setup

info:
  name: "Atlassian JIRA Setup - Installer 安装程序暴露"
  author: ritikchaddha
  severity: high
  metadata:
    max-request: 2
    verified: "true"
    shodan-query: title:"JIRA - JIRA setup"
  tags: JIRA

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/secure/SetupMode!default.jspa'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'JIRA - JIRA setup'
          - 'jira.webresources:jira-setup"'
        case-insensitive: true
        condition: or

      - type: status
        status:
          - 200
