id: chatwoot-installation-onboarding-unauth-access

info:
  name: Chatwoot 未授权访问
  author: 0x_Akoko
  severity: high
  description: |
    检测到 Chatwoot 实例的初始安装引导页面 /installation/onboarding 可公开访问，未认证用户可利用该页面创建首个超级管理员账户，从而获得平台完全控制权。
  reference:
    - https://github.com/chatwoot/chatwoot
    - https://www.chatwoot.com/docs/self-hosted/monitoring/super-admin-sidekiq
  metadata:
    verified: true
    max-request: 1
    vendor: chatwoot
    product: chatwoot
    shodan-query: http.title:"SuperAdmin | Chatwoot"
    fofa-query: title="SuperAdmin | Chatwoot"
  tags: Chatwoot
  remediation: >-
    升级受影响产品至最新的厂商支持版本，并安装所有可用的安全补丁。如果暂时无法升级，应限制对受影响端点的访问，尽可能禁用存在风险的功能，并采取身份认证、网络隔离和请求过滤等补偿性措施。同时检查相关 日志，并轮换可能已暴露的凭据或密钥。

http:
  - method: GET
    path:
      - "{{BaseURL}}/installation/onboarding"
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "SuperAdmin | Chatwoot", "Howdy, Welcome to Chatwoot", "Finish Setup")'
          - 'status_code == 200'
        condition: and

