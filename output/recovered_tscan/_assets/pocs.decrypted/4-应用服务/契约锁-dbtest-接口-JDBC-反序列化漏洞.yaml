id: qiyuesuo-dbtest-jdbc-deserialization

info:
  name: 契约锁 dbtest 接口 JDBC 反序列化漏洞
  author: bl
  severity: critical
  description: |-
    契约锁 /api/setup/dbtest 接口存在 JDBC 反序列化漏洞，攻击者利用该漏洞可远程执行任意命令，获取主机控制权限。
  reference:
    - https://mp.weixin.qq.com/s/2CkkpotZJ6XwSeuyXf5lRg
  classification:
    cwe-id: CWE-502
  metadata:
    fofa-query: app="契约锁-电子签署平台" && port="9181"
  tags: 契约锁-电子签署平台
  remediation: >-
    升级到已修复版本，避免反序列化不可信数据。使用安全的数据格式，严格限制允许的类或类型，对序列化消息进行身份校验，并以最小权限运行服务。

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/setup/dbtest"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - '\u8BF7\u586B\u5199\u4E3B\u673A\u540D\u79F0'
      - type: status
        status:
          - 200
