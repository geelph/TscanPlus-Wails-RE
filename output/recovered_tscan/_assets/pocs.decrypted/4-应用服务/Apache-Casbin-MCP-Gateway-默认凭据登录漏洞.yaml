id: apache-casbin-mcp-gateway-default-login

info:
  name: Apache Casbin MCP Gateway 默认凭据登录漏洞
  author: icarot
  severity: high
  description: |
    检测到 Apache Casbin MCP Gateway 服务器存在默认登录凭据，攻击者可利用该默认账号密码直接登录系统，获取未授权访问权限。
  reference:
    - https://github.com/apache/casbin-mcp-gateway
  metadata:
    max-request: 2
    vendor: apache
    product: casbin-mcp-gateway
  tags: Casbin
  remediation: >-
    升级到已修复版本，并在服务端对每个受影响的操作和资源执行身份认证与授权检查。采用默认拒绝的访问控制策略，删除默认凭据，在可用时启用多因素认证，并限制管理端点的访问。

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}
    attack: pitchfork
    payloads:
      username:
        - alice
        - bob
      password:
        - password123
        - password456
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: content_type
        words:
          - "application/json"
      - type: word
        part: body
        words:
          - '"token":'
          - '"user":'
        condition: and
      - type: status
        status:
          - 200

