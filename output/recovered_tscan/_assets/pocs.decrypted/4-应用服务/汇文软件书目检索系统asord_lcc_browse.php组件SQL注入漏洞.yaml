id: huiwen-library-asord_lcc_browse-sqli

info:
  name: 汇文软件书目检索系统asord_lcc_browse.php组件SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    该系统中的asord_lcc_browse.php组件存在SQL注入漏洞。攻击者可通过构造恶意输入利用此漏洞，获取数据库敏感信息。受影响组件为汇文软件书目检索系统的核心检索模块。

    fofa: app="汇文软件-书目检索系统"
  tags: 汇文软件书目检索系统

