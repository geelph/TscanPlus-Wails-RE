id: molgenis-default-credential-login-detection

info:
  name: Molgenis 默认凭据登录漏洞检测
  author: ritikchaddha
  severity: high
  description: |
    该检测尝试以默认账号 admin/admin 对 Molgenis 进行登录验证。若认证成功，说明目标系统未修改初始口令，可能遭受未授权访问。
  reference:
    - https://molgenis.org/
    - https://github.com/molgenis/molgenis-emx2
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"MOLGENIS"
  tags: MOLGENIS
  remediation: >-
    升级到已修复版本，并在服务端对每个受影响的操作和资源执行身份认证与授权检查。采用默认拒绝的访问控制策略，删除默认凭据，在可用时启用多因素认证，并限制管理端点的访问。

variables:
  username: 'admin'
  password: 'admin'

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}
    matchers-condition: and
    matchers:
      - type: word
        part: location
        words:
          - "/login?error"
        negative: true
      - type: word
        part: header
        words:
          - "Set-Cookie: JSESSIONID="
      - type: status
        status:
          - 302
