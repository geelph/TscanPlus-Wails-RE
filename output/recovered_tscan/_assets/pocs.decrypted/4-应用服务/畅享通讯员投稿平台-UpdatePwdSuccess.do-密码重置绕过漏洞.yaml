id: changxiang-contributor-updatepwdsuccessdo-pwd-change

info:
  name: "畅享通讯员投稿平台 UpdatePwdSuccess.do 密码重置绕过漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="FOUNDER-全媒体采编系统"
      北京北大方正电子有限公司开发的畅享通讯员投稿平台在UpdatePwdSuccess.do接口中存在用户身份验证逻辑缺陷。攻击者可绕过密码找回验证机制，通过构造特定请求直接修改任意用户账户的密码，从而实现未授权的账户控制。该漏洞可能导致用户凭证泄露及平台敏感数据被非法访问。
  tags: 畅享通讯员投稿平台,FOUNDER-全媒体采编系统

