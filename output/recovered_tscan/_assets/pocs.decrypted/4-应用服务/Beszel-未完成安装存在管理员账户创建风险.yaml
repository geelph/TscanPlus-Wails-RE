id: beszel-unfinished-install-admin-creation

info:
  name: Beszel 未完成安装存在管理员账户创建风险
  author: 0x_Akoko
  severity: high
  description: |
    检测到 Beszel 服务器监控中心存在未完成的安装流程，当前未配置管理员账户，攻击者可利用该状态创建管理员账户并获取系统完全控制权限。
  reference:
    - https://github.com/henrygd/beszel
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"globalThis.BESZEL"
    fofa-query: body="globalThis.BESZEL"
  tags: Beszel
  remediation: >-
    升级受影响产品至最新的厂商支持版本，并安装所有可用的安全补丁。如果暂时无法升级，应限制对受影响端点的访问，尽可能禁用存在风险的功能，并采取身份认证、网络隔离和请求过滤等补偿性措施。同时检查相关 日志，并轮换可能已暴露的凭据或密钥。

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/beszel/first-run"
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "\"firstRun\":true")'
        condition: and
