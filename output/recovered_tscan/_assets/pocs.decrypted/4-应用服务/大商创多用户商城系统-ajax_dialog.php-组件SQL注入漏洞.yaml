id: dashang-ajax_dialog_php-sql

info:
  name: 大商创多用户商城系统 ajax_dialog.php 组件SQL注入漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: body="dsc-choie"
      大商创多用户商城系统中的 ajax_dialog.php 组件存在SQL注入漏洞。攻击者无需身份验证即可通过构造恶意SQL负载，在未授权情况下执行任意SQL查询，导致数据库敏感信息泄露或篡改。该漏洞可能允许攻击者访问、修改或删除员工个人资料、企业核心业务数据等关键信息，并进一步利用以获取服务器权限。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247488267&idx=1&sn=c7d3d87728dec44c2d4f1aea4d17eded&chksm=c267a638f5102f2e00afab40bf2869bd134e7d42ceec6f2de4c6b5b269ee21965039ba234d37&token=350950895&lang=zh_CN#rd
  tags: 大商创多用户商城系统


