id: tianyu-data-security-deviceid-sql

info:
  name: "天喻数据安全平台 deviceid 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="数据安全" && body="天喻"
      天喻数据安全平台在 deviceid 接口处理逻辑中存在SQL注入缺陷。攻击者可通过构造恶意输入触发SQL注入，从而执行未经授权的数据库操作，如数据篡改、信息泄露或服务中断，进而影响系统完整性和可用性。
  tags: 天喻数据安全平台

