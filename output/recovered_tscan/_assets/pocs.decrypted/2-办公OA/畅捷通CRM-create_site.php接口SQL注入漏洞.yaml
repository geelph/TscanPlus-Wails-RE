id: yonyou-chanjet-crm-create_sitephp-sqli

info:
  name: 用友畅捷通CRM create_site.php接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: 鹰图：web.icon=="223dcd70f982801e9177078a818a9b59"
        用友畅捷通T-CRM是用友公司推出的基于B/S架构的客户关系管理软件，支持多部门协作及客户全生命周期管理。该系统create_site.php接口存在SQL注入漏洞，攻击者可利用此漏洞执行恶意SQL语句，获取数据库敏感信息，进而可能控制服务器，造成严重安全威胁。
  tags: 用友畅捷通CRM

http:
- raw:
  - |
    GET /webservice/create_site.php?site_id=1 HTTP/1.1
    Host: {{Hostname}}
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'register'
