id: yongyouNC-expertschedule-sql

info:
  name: 用友NC系统expertschedule接口SQL注入漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
      用友NC系统expertschedule接口存在SQL注入缺陷，攻击者可通过构造恶意输入绕过输入验证机制，直接与后端数据库建立未授权连接。该漏洞允许远程执行任意SQL语句，可能导致数据库凭证泄露、敏感数据被非法提取以及系统权限被篡夺。
  reference:
  - https://mp.weixin.qq.com/s/edSnM1ewdPjX6olXyGzUqA
  tags: 用友NC



