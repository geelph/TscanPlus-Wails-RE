id: finereport-duchamp-fileupload-arbitrary

info:
  name: FineReport duchamp主题插件FileUpload任意文件上传漏洞
  author: qwtd
  severity: critical
  description: |-
    FineReport duchamp主题插件的FileUpload功能存在任意文件上传漏洞，攻击者可通过构造恶意请求上传任意文件，进而可能导致远程代码执行。
  tags: 帆软-FineReport
  remediation: >-
    升级到已修复版本，仅允许业务必需的文件类型，校验文件实际内容而不能只检查扩展名；将上传文件存放在 Web 根目录之外并使用随机生成的文件名，禁止上传目录执行脚本，同时限制文件大小和访问权限。
  
http:
  - raw:
      - |
        GET /webroot/decision/view/duchamp/theme/list HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip, deflate
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "theme_config"
      - type: status
        status:
          - 200
