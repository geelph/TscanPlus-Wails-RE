id: weida-crm-accountselect-sqli

info:
  name: "维达外贸客户关系管理系统 AccountSelect 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="维达外贸客户关系管理系统"
      该系统 AccountSelect 接口参数过滤机制存在缺陷，允许攻击者通过注入恶意 SQL 语句操控数据库查询逻辑，可能导致敏感数据泄露或权限突破。此漏洞影响系统核心数据交互功能，需通过 fofa 指纹定位目标资产并验证注入点有效性。
  tags: 维达外贸客户关系管理系统

