id: yongyouU8-CRM-ajaxgetborrowdata_php-sql

info:
  name: "用友U8 CRM系统 ajaxgetborrowdata.php SQL注入漏洞"
  author: Unknown
  severity: high
  description: |-
    fofa: title="用友U8CRM"
      用友U8 CRM客户关系管理系统中/borrowout/ajaxgetborrowdata.php接口存在SQL注入安全缺陷。攻击者可未经身份验证构造恶意请求，通过SQL注入漏洞执行任意数据库查询，利用xp_cmdshell扩展存储过程实现文件系统写入操作，最终达成任意代码执行并获取服务器控制权限。该漏洞允许远程攻击者突破应用层安全防护，直接操作底层数据库并扩展至操作系统级别控制。
  reference:
  - https://mp.weixin.qq.com/s/ITXL8rw9puAbnFQgErXY1g?token=974751616&lang=zh_CN
  tags: 用友


