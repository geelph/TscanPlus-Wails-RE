id: git-head-file-exposure

info:
  name: .git 文件泄露漏洞
  author: qwtd
  severity: high
  description: |-
    目标服务器上的 .git/HEAD 文件可被公开访问，攻击者可据此确认 Git 仓库的存在，并进一步尝试枚举 Git 对象与历史记录，可能导致源代码及敏感配置信息泄露。
  metadata:
    dast: true
    verified: true
    max-request: 1
  tags: dast
  remediation: >-
    升级到已修复版本，在受影响端点实施身份认证和授权，移除响应及调试输出中的敏感数据，限制管理接口的暴露范围，并轮换可能已泄露的凭据或密钥。

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/HEAD"
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '^ref: refs/(heads|remotes)/[^\r\n]+'
